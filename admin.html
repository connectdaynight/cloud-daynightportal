<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFDF8">
  <title>Admin Dashboard · Day Night Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&display=swap">
  <style>
    /* ==========================================================================
       DAY NIGHT MEDIA - FULL PAGE ADMIN DASHBOARD SYSTEM
       Theme: Preserved signature milk-white luxury palette with desktop-grade layout
       ========================================================================== */
    :root {
      --bg: #FFFDF8;
      --card: #FFFFFF;
      --line: #EEE8DD;
      --soft: #F7F3EC;
      --ink: #1D2433;
      --navy: #12294A;
      --mute: #7A7468;
      --gold: #B8935A;
      --red: #E53225;
      --rose: #E8457A;
      --teal: #17A598;
      --amber: #F2992E;
      --violet: #6C5CE7;
      --blue: #2F7DF6;
      --green: #16884D;
      --f: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --serif: 'Cormorant Garamond', Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--f);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    /* Top Navigation Header */
    .admin-header {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 2px 12px rgba(29, 36, 51, 0.03);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--red);
      display: grid;
      place-items: center;
      box-shadow: 0 4px 12px rgba(229, 50, 37, 0.25);
    }
    .brand-mark svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2.2; }

    .brand-title b {
      display: block;
      font-size: 17px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.01em;
    }
    .brand-title span {
      display: block;
      font-size: 11px;
      color: var(--mute);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--soft);
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
    }
    .status-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status-dot.offline { background: var(--red); }

    .btn-portal {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      font-size: 12px;
      font-weight: 600;
      color: var(--navy);
      transition: all 0.15s ease;
    }
    .btn-portal:hover { border-color: var(--navy); background: var(--soft); }

    /* Main Layout */
    .admin-layout {
      display: flex;
      flex: 1;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 28px;
      gap: 28px;
    }

    /* Sidebar Navigation */
    .admin-sidebar {
      width: 240px;
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--mute);
      border: 1px solid transparent;
      background: none;
      text-align: left;
      width: 100%;
      transition: all 0.15s ease;
    }
    .nav-item:hover { color: var(--navy); background: var(--soft); }
    .nav-item.active {
      color: var(--navy);
      background: var(--card);
      border-color: var(--line);
      box-shadow: 0 4px 14px rgba(29, 36, 51, 0.04);
    }
    .nav-item .icon { width: 20px; height: 20px; display: grid; place-items: center; flex: none; }
    .nav-item .icon svg { width: 18px; height: 18px; stroke: currentColor; }

    /* Content Area */
    .admin-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Stats Overview Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(29, 36, 51, 0.03);
    }
    .stat-card small { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--mute); letter-spacing: 0.05em; }
    .stat-card b { font-size: 28px; font-weight: 700; color: var(--navy); line-height: 1.1; }
    .stat-card span { font-size: 11px; color: var(--green); font-weight: 500; }

    /* Action Bar */
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .action-bar h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
    }
    .action-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-input {
      padding: 10px 16px;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      font-size: 13px;
      width: 240px;
      outline: none;
    }
    .search-input:focus { border-color: var(--navy); }

    .btn-primary {
      background: var(--navy);
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(18, 41, 74, 0.18);
      transition: all 0.15s ease;
    }
    .btn-primary:hover { background: #1C3A63; }

    /* Reels Grid Desktop */
    .reels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    .reel-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(29, 36, 51, 0.04);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .reel-box:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(29, 36, 51, 0.08);
    }

    .reel-thumb-wrap {
      aspect-ratio: 9/16;
      border-radius: 14px;
      background: radial-gradient(120% 80% at 50% 30%, #B8935A 0%, #12294A 100%);
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: #fff;
      cursor: pointer;
    }
    .reel-thumb-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .reel-thumb-wrap .dur {
      position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.45);
      padding: 2px 6px; border-radius: 999px; font-size: 9px; font-weight: 600;
    }
    .reel-thumb-wrap .play-badge {
      width: 44px; height: 44px; border-radius: 50%; background: #fff; color: var(--navy);
      display: grid; place-items: center; box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }
    .reel-thumb-wrap .zari {
      position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
      background: repeating-linear-gradient(90deg, #E9C77B 0 6px, #B8935A 6px 9px, #F6E3B4 9px 12px);
    }

    .reel-details h4 {
      font-size: 13px; font-weight: 600; color: var(--navy); line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .reel-details p {
      font-size: 11px; color: var(--mute); margin-top: 2px;
    }
    .reel-meta-row {
      display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--mute);
    }

    .badge-status {
      font-size: 9px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 6px;
    }
    .badge-status.approved { background: rgba(22, 136, 77, 0.12); color: var(--green); }
    .badge-status.review { background: rgba(242, 153, 46, 0.15); color: var(--amber); }
    .badge-status.draft { background: rgba(122, 116, 104, 0.15); color: var(--mute); }
    .badge-status.hidden { background: rgba(229, 50, 37, 0.12); color: var(--red); }

    .reel-box-actions {
      display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-top: 4px; border-top: 1px solid var(--line);
    }
    .reel-box-actions button {
      border: 0; background: none; font-size: 11px; font-weight: 600; padding: 4px 6px; border-radius: 6px;
    }
    .reel-box-actions button:hover { background: var(--soft); }
    .action-edit { color: var(--blue); }
    .action-hide { color: var(--amber); }
    .action-delete { color: var(--red); }

    /* Client Cards Grid */
    .clients-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }

    .client-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 4px 16px rgba(29, 36, 51, 0.03);
    }

    .client-card-head {
      display: flex; align-items: center; gap: 14px;
    }
    .client-logo-box {
      width: 70px; height: 42px; border-radius: 12px; border: 1px solid var(--line);
      display: grid; place-items: center; padding: 6px; background: #fff; flex: none;
    }
    .client-logo-box img { max-width: 100%; max-height: 100%; }

    .client-info h3 { font-size: 16px; font-weight: 700; color: var(--navy); }
    .client-info p { font-size: 11px; color: var(--mute); }

    .client-url-box {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 11px;
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: space-between;
      word-break: break-all;
    }
    .client-url-box button {
      border: 0; background: none; color: var(--blue); font-weight: 600; cursor: pointer; flex: none;
    }

    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-pill {
      font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 999px;
      background: var(--soft); color: var(--mute);
    }

    /* Modal Sheet Backdrop */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(29, 36, 51, 0.45); backdrop-filter: blur(4px);
      z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-window {
      background: var(--card); border-radius: 24px; padding: 28px; width: 100%; max-width: 540px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2); max-height: 90vh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 16px;
    }
    .modal-window h3 { font-size: 20px; color: var(--navy); font-weight: 700; }

    /* Form Fields */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 11px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: 0.05em; }
    .form-group input, .form-group select, .form-group textarea {
      padding: 11px 14px; border: 1px solid var(--line); background: var(--bg); border-radius: 12px;
      font-size: 13px; width: 100%; outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--navy); }
    .form-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Floating Toast Alerts */
    .toast-tray {
      position: fixed; top: 20px; right: 28px; z-index: 100; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
    }
    .toast-box {
      padding: 12px 20px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #fff;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18); pointer-events: auto; animation: toastIn 0.3s ease;
    }
    @keyframes toastIn { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
    .toast-box.success { background: var(--green); }
    .toast-box.error { background: var(--red); }
    .toast-box.info { background: var(--navy); }

    /* Video Player Modal */
    .video-dialog-wrap {
      display: flex; flex-direction: column; gap: 14px; align-items: center; width: 100%; max-width: 360px;
    }
    .video-viewport {
      width: 100%; aspect-ratio: 9/16; border-radius: 20px; overflow: hidden; background: #000;
      box-shadow: 0 16px 40px rgba(0,0,0,0.3);
    }
    .video-viewport iframe { width: 100%; height: 100%; border: 0; }

    /* Responsive Design */
    @media (max-width: 900px) {
      .admin-layout { flex-direction: column; padding: 16px; }
      .admin-sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding-bottom: 6px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <div class="toast-tray" id="toasts"></div>

  <!-- Top Navigation Header -->
  <header class="admin-header">
    <div class="brand-group">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <div class="brand-title">
        <b id="hdr-agency">Day Night Media</b>
        <span>Executive Production Control</span>
      </div>
    </div>
    <div class="header-actions">
      <div class="status-pill">
        <span class="status-dot" id="hdr-dot"></span>
        <span id="hdr-status">Checking Connection...</span>
      </div>
      <a href="/" target="_blank" class="btn-portal"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg> View Client Portal</a>
    </div>
  </header>

  <!-- Main Content Layout -->
  <div class="admin-layout">
    
    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar">
      <button class="nav-item active" data-tab="dashboard"><span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span> Overview</button>
      <button class="nav-item" data-tab="reels"><span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"/></svg></span> Reels &amp; Videos</button>
      <button class="nav-item" data-tab="clients"><span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M9 8h1M9 12h1M9 16h1M14 8h1M14 12h1M14 16h1M5 21V5a2 2 0 012-2h10a2 2 0 012 2v16"/></svg></span> Clients &amp; URLs</button>
      <button class="nav-item" data-tab="folders"><span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg></span> Drive Folders</button>
      <button class="nav-item" data-tab="engine"><span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></span> Google Drive Engine</button>
      <button class="nav-item" data-tab="branding"><span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.4-1.1-.3-.4-.4-.8-.4-1.4 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-5.5-4.5-10-10-10z"/></svg></span> Agency Branding</button>
    </aside>

    <!-- Content Workspace -->
    <main class="admin-content" id="workspace"></main>

  </div>

  <script>
  (function() {
    'use strict';

    const GAS_URL = localStorage.getItem('dn_gas_url') || 'https://script.google.com/macros/s/AKfycbxo--i9HaTv4ejd6iYFweq3W-a-I3zzqp0rI2ACMjY5cyJ26-yh3byNRn8u0IrpRkdt/exec';
    const PASSKEY = localStorage.getItem('dn_admin_passkey') || 'DN@2026';

    let DATA = {
      settings: { agency: "Day Night Media", agencySub: "Production Company", slogan: "Creating impact that brands remember" },
      clients: [
        {
          id: "tcs", slug: "tcs", name: "The Chennai Silks", code: "4821",
          tagline: "Let the celebrations begin!", accent: "celebrations", animStyle: "confetti",
          branches: ["T. Nagar", "Velachery", "Chromepet", "Thiruvallur"],
          albums: ["Diwali 2026", "Bridal Edit", "Festive Specials"]
        }
      ],
      reels: []
    };

    let activeTab = 'dashboard';
    let searchQuery = '';
    const workspace = document.getElementById('workspace');
    const toastTray = document.getElementById('toasts');

    function toast(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = 'toast-box ' + type;
      el.textContent = msg;
      toastTray.appendChild(el);
      setTimeout(() => el.remove(), 2800);
    }

    function modal(html, onMount) {
      document.querySelector('.modal-backdrop')?.remove();
      const wrap = document.createElement('div');
      wrap.className = 'modal-backdrop';
      wrap.innerHTML = `<div class="modal-window">${html}</div>`;
      wrap.onclick = e => { if (e.target === wrap || e.target.closest('[data-close]')) wrap.remove(); };
      document.body.appendChild(wrap);
      onMount && onMount(wrap);
      return wrap;
    }

    async function api(action, payload = {}) {
      payload.action = action;
      payload.passkey = PASSKEY;
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    async function sync() {
      try {
        const res = await fetch(`${GAS_URL}?action=getData`);
        const json = await res.json();
        if (json.success && json.data) {
          DATA = json.data;
          document.getElementById('hdr-dot').className = 'status-dot online';
          document.getElementById('hdr-status').textContent = 'Google Drive Connected';
          document.getElementById('hdr-agency').textContent = DATA.settings?.agency || 'Day Night Media';
          render();
        }
      } catch(e) {
        document.getElementById('hdr-dot').className = 'status-dot offline';
        document.getElementById('hdr-status').textContent = 'Drive Engine Offline';
      }
    }

    function render() {
      if (activeTab === 'dashboard') renderDashboard();
      else if (activeTab === 'reels') renderReels();
      else if (activeTab === 'clients') renderClients();
      else if (activeTab === 'folders') renderFolders();
      else if (activeTab === 'engine') renderEngine();
      else if (activeTab === 'branding') renderBranding();
    }

    // TAB 1: OVERVIEW DASHBOARD

    function bindReelActions() {
      document.querySelectorAll('[data-play]').forEach(b => {

          if (r) openVideoModal(r);

      document.querySelectorAll('[data-edit]').forEach(b => {
        b.onclick = () => {
          const r = DATA.reels.find(x => x.id === b.dataset.edit);
          if (r) openEditModal(r);
        };
      });
      document.querySelectorAll('[data-hide]').forEach(b => {
        b.onclick = async () => {
          const r = DATA.reels.find(x => x.id === b.dataset.hide);
          if (r) {
            r.hidden = !r.hidden;
            await api('toggleHideReel', { id: r.id });
            toast(r.hidden ? 'Reel hidden from client' : 'Reel visible to client', 'info');
            render();
          }
        };
      });
      document.querySelectorAll('[data-del]').forEach(b => {
        b.onclick = async () => {
          const r = DATA.reels.find(x => x.id === b.dataset.del);
          if (r && confirm(`Are you sure you want to delete "${r.title}"? This will trash the file in Google Drive.`)) {
            DATA.reels = DATA.reels.filter(x => x.id !== r.id);
            await api('deleteReel', { id: r.id });

            render();

      function driveId(u) {
        if (!u) return null;
        const m = u.match(/\/d\/([\w-]{15,})/) || u.match(/[?&]id=([\w-]{15,})/) || u.match(/([\w-]{25,})/);
        return m ? m[1] : null;
      }
      const id = driveId(r.url);
      const embedSrc = id ? `https://drive.google.com/file/d/${id}/preview` : r.url;

      modal(`
        <div class="video-dialog-wrap">
          <div style="width:100%;display:flex;align-items:center;justify-content:space-between;">
            <div>
              <h4 style="font-size:16px;color:var(--navy);">${r.title}</h4>
              <p style="font-size:11px;color:var(--mute);">${r.date} · ${r.b || r.album || 'Reel'}</p>
            </div>
            <button class="btn-portal" data-close>Close</button>
          </div>
          <div class="video-viewport">
            <iframe src="${embedSrc}" allow="autoplay; fullscreen" allowfullscreen></iframe>
          </div>
          <div style="display:flex;gap:10px;width:100%;">
            <a href="https://drive.google.com/uc?export=download&id=${id}" target="_blank" class="btn-primary" style="flex:1;justify-content:center;">Direct Download</a>
            <a href="https://drive.google.com/file/d/${id}/view" target="_blank" class="btn-portal" style="flex:1;justify-content:center;">Drive View</a>
          </div>
        </div>`, () => {});
    }

    // Sidebar Tab Switching
    document.querySelectorAll('.nav-item').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        activeTab = b.dataset.tab;
        render();
      };
    });

    // Initial Load
    sync();

  })();
  </script>
</body>
</html>
