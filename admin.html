  <meta name="twitter:title" content="Admin Dashboard | DAY NIGHT">
  <meta name="twitter:description" content="Day Night Media - Executive Control &amp; Client Delivery Management">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&display=swap">
  <style>
    /* ==========================================================================
       DAY NIGHT MEDIA - FULL PAGE ADMIN DASHBOARD SYSTEM
       Theme: Preserved signature milk-white luxury palette with desktop-grade layout
       ========================================================================== */
    :root {
      --bg: #FFFDF8;
      --card: #FFFFFF;
      --line: #EEE8DD;
      --soft: #F7F3EC;
      --ink: #1D2433;
      --navy: #12294A;
      --mute: #7A7468;
      --gold: #B8935A;
      --red: #E53225;
      --rose: #E8457A;
      --teal: #17A598;
      --amber: #F2992E;
      --violet: #6C5CE7;
      --blue: #2F7DF6;
      --green: #16884D;
      --f: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --serif: 'Cormorant Garamond', Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--f);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    /* Top Navigation Header */
    .admin-header {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 2px 12px rgba(29, 36, 51, 0.03);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--red);
      display: grid;
      place-items: center;
      box-shadow: 0 4px 12px rgba(229, 50, 37, 0.25);
    }
    .brand-mark svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2.2; }

    .brand-title b {
      display: block;
      font-size: 17px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.01em;
    }
    .brand-title span {
      display: block;
      font-size: 11px;
      color: var(--mute);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--soft);
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
    }
    .status-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status-dot.offline { background: var(--red); }

    .btn-portal {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      font-size: 12px;
      font-weight: 600;
      color: var(--navy);
      transition: all 0.15s ease;
    }
    .btn-portal:hover { border-color: var(--navy); background: var(--soft); }

    /* Main Layout */
    .admin-layout {
      display: flex;
      flex: 1;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 28px;
      gap: 28px;
    }

    /* Sidebar Navigation */
    .admin-sidebar {
      width: 240px;
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--mute);
      border: 1px solid transparent;
      background: none;
      text-align: left;
      width: 100%;
      transition: all 0.15s ease;
    }
    .nav-item:hover { color: var(--navy); background: var(--soft); }
    .nav-item.active {
      color: var(--navy);
      background: var(--card);
      border-color: var(--line);
      box-shadow: 0 4px 14px rgba(29, 36, 51, 0.04);
    }
    .nav-item .icon { width: 20px; height: 20px; display: grid; place-items: center; flex: none; }
    .nav-item .icon svg { width: 18px; height: 18px; stroke: currentColor; }

    /* Content Area */
    .admin-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Stats Overview Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(29, 36, 51, 0.03);
    }
    .stat-card small { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--mute); letter-spacing: 0.05em; }
    .stat-card b { font-size: 28px; font-weight: 700; color: var(--navy); line-height: 1.1; }
    .stat-card span { font-size: 11px; color: var(--green); font-weight: 500; }

    /* Action Bar */
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .action-bar h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
    }
    .action-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-input {
      padding: 10px 16px;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      font-size: 13px;
      width: 240px;
      outline: none;
    }
    .search-input:focus { border-color: var(--navy); }

    .btn-primary {
      background: var(--navy);
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(18, 41, 74, 0.18);
      transition: all 0.15s ease;
    }
    .btn-primary:hover { background: #1C3A63; }

    /* Reels Grid Desktop */
    .reels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    .reel-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(29, 36, 51, 0.04);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .reel-box:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(29, 36, 51, 0.08);
    }

    .reel-thumb-wrap {
      aspect-ratio: 9/16;
      border-radius: 14px;
      background: radial-gradient(120% 80% at 50% 30%, #B8935A 0%, #12294A 100%);
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: #fff;
      cursor: pointer;
    }
    .reel-thumb-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .reel-thumb-wrap .dur {
      position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.45);
      padding: 2px 6px; border-radius: 999px; font-size: 9px; font-weight: 600;
    }
    .reel-thumb-wrap .play-badge {
      width: 44px; height: 44px; border-radius: 50%; background: #fff; color: var(--navy);
      display: grid; place-items: center; box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }
    .reel-thumb-wrap .zari {
      position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
      background: repeating-linear-gradient(90deg, #E9C77B 0 6px, #B8935A 6px 9px, #F6E3B4 9px 12px);
    }

    .reel-details h4 {
      font-size: 13px; font-weight: 600; color: var(--navy); line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .reel-details p {
      font-size: 11px; color: var(--mute); margin-top: 2px;
    }
    .reel-meta-row {
      display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--mute);
    }

    .badge-status {
      font-size: 9px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 6px;
    }
    .badge-status.approved { background: rgba(22, 136, 77, 0.12); color: var(--green); }
    .badge-status.review { background: rgba(242, 153, 46, 0.15); color: var(--amber); }
    .badge-status.draft { background: rgba(122, 116, 104, 0.15); color: var(--mute); }
    .badge-status.hidden { background: rgba(229, 50, 37, 0.12); color: var(--red); }

    .reel-box-actions {
      display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-top: 4px; border-top: 1px solid var(--line);
    }
    .reel-box-actions button {
      border: 0; background: none; font-size: 11px; font-weight: 600; padding: 4px 6px; border-radius: 6px;
    }
    .reel-box-actions button:hover { background: var(--soft); }
    .action-edit { color: var(--blue); }
    .action-hide { color: var(--amber); }
    .action-delete { color: var(--red); }

    /* Client Cards Grid */
    .clients-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }

    .client-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 4px 16px rgba(29, 36, 51, 0.03);
    }

    .client-card-head {
      display: flex; align-items: center; gap: 14px;
    }
    .client-logo-box {
      width: 70px; height: 42px; border-radius: 12px; border: 1px solid var(--line);
      display: grid; place-items: center; padding: 6px; background: #fff; flex: none;
    }
    .client-logo-box img { max-width: 100%; max-height: 100%; }

    .client-info h3 { font-size: 16px; font-weight: 700; color: var(--navy); }
    .client-info p { font-size: 11px; color: var(--mute); }

    .client-url-box {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 11px;
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: space-between;
      word-break: break-all;
    }
    .client-url-box button {
      border: 0; background: none; color: var(--blue); font-weight: 600; cursor: pointer; flex: none;
    }

    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .tag-pill {
      font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
      background: var(--soft); color: var(--navy); display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--line);
    }
    .tag-pill .tag-del {
      border: 0; background: none; cursor: pointer; color: var(--mute); font-size: 14px; line-height: 1; padding: 0 2px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .tag-pill .tag-del:hover { color: var(--red); }
    .tag-add-btn {
      font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
      background: #fff; color: var(--blue); border: 1px dashed var(--blue); cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px; transition: all 0.15s ease;
    }
    .tag-add-btn:hover { background: #EEF2FF; border-style: solid; }

    /* Modal Sheet Backdrop (Anti-Dismissal protected) */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(29, 36, 51, 0.45); backdrop-filter: blur(4px);
      z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-window {
      background: var(--card); border-radius: 24px; padding: 28px; width: 100%; max-width: 540px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2); max-height: 90vh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 16px; position: relative;
    }
    .modal-window h3 { font-size: 20px; color: var(--navy); font-weight: 700; margin: 0; }

    /* Passkey Lock Screen */
    .lock-screen {
      position: fixed; inset: 0; background: var(--bg); z-index: 9999;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .lock-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 28px;
      padding: 36px 32px; width: 100%; max-width: 420px; text-align: center;
      box-shadow: 0 16px 40px rgba(18, 41, 74, 0.08); display: flex; flex-direction: column; gap: 18px;
    }
    .lock-mark {
      width: 56px; height: 56px; border-radius: 18px; background: var(--navy); color: #fff;
      display: inline-grid; place-items: center; margin: 0 auto; box-shadow: 0 8px 20px rgba(18, 41, 74, 0.25);
    }
    .spinning .sync-icon { animation: spin 0.8s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* Form Fields & Luxury Controls */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 11px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: 0.05em; }
    .form-group input, .form-group select, .form-group textarea {
      padding: 11px 14px; border: 1px solid var(--line); background: var(--bg); border-radius: 12px;
      font-size: 13px; width: 100%; outline: none; transition: border-color 0.2s ease, box-shadow 0.2s ease;
      font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--navy); box-shadow: 0 0 0 3px rgba(18, 41, 74, 0.08);
    }
    .form-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Custom Luxury File Input - Zero Legacy Button */
    input[type="file"] {
      border: 1.5px dashed var(--line) !important;
      background: var(--card) !important;
      border-radius: 14px !important;
      padding: 10px 14px !important;
      font-size: 13px !important;
      color: var(--mute) !important;
      cursor: pointer !important;
      transition: all 0.2s ease !important;
      display: block !important;
    }
    input[type="file"]:hover {
      border-color: var(--navy) !important;
      background: var(--soft) !important;
    }
    input[type="file"]::file-selector-button {
      background: var(--navy);
      color: #FFFFFF;
      border: none;
      border-radius: 9px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      margin-right: 14px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 3px 10px rgba(18, 41, 74, 0.2);
      font-family: inherit;
    }
    input[type="file"]::file-selector-button:hover {
      background: #1c3860;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(18, 41, 74, 0.28);
    }
    input[type="file"]::-webkit-file-upload-button {
      background: var(--navy);
      color: #FFFFFF;
      border: none;
      border-radius: 9px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      margin-right: 14px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 3px 10px rgba(18, 41, 74, 0.2);
      font-family: inherit;
    }
    input[type="file"]::-webkit-file-upload-button:hover {
      background: #1c3860;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(18, 41, 74, 0.28);
    }

    select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2312294A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") !important;
      background-repeat: no-repeat !important;
      background-position: right 14px center !important;
      background-size: 14px 14px !important;
      padding-right: 38px !important;
      appearance: none !important;
      -webkit-appearance: none !important;
      cursor: pointer !important;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 0.75;
      transition: opacity 0.2s ease;
    }
    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    /* Floating Toast Alerts */
    .toast-tray {
      position: fixed; top: 20px; right: 28px; z-index: 100; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
    }
    .toast-box {
      padding: 12px 20px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #fff;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18); pointer-events: auto; animation: toastIn 0.3s ease;
    }
    @keyframes toastIn { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
    .toast-box.success { background: var(--green); }
    .toast-box.error { background: var(--red); }
    .toast-box.info { background: var(--navy); }

    /* Video Player Modal (Theme Integrated) */
    .video-dialog-wrap {
      display: flex; flex-direction: column; gap: 12px; align-items: center; width: 100%; max-width: 480px;
    }
    .video-viewport {
      width: 100%; max-width: 440px; aspect-ratio: 9/16; max-height: calc(88dvh - 110px);
      border-radius: 20px; overflow: hidden; background: #000;
      box-shadow: 0 14px 36px rgba(18, 41, 74, 0.12); position: relative; margin: 0 auto;
    }
    .video-viewport video {
      width: 100%; height: 100%; object-fit: contain;
      background: #000; border-radius: 20px; border: 0; display: block;
    }

    .video-gear-btn-header {
      background: var(--soft); border: 1px solid var(--line); color: var(--navy); border-radius: 50%;
      width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer;
      box-shadow: 0 2px 8px rgba(18, 41, 74, 0.06); transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); flex: none;
    }
    .video-gear-btn-header:hover, .video-gear-btn-header.active {
      background: var(--card); border-color: var(--navy); color: var(--navy); transform: scale(1.05);
    }

    .video-gear-menu {
      display: none; position: absolute; top: 42px; right: 0; z-index: 100;
      background: #FFFFFF; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px;
      color: var(--navy); width: 275px; max-height: calc(100vh - 120px); overflow-y: auto;
      box-shadow: 0 18px 48px rgba(18, 41, 74, 0.2); animation: popIn 0.2s ease-out;
    }
    .v-menu-sec { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .v-menu-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--mute); display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .v-status-badge { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; margin-bottom: 8px; }
    .v-status-badge.approved { background: rgba(31, 175, 100, 0.12); color: var(--green); border: 1px solid rgba(31, 175, 100, 0.25); }
    .v-status-badge.review { background: rgba(242, 153, 46, 0.12); color: var(--amber); border: 1px solid rgba(242, 153, 46, 0.25); }
    .v-status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .v-approval-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

    // Modal with Anti-Dismissal Protection (Only explicit [data-close] or cancel closes)

      document.querySelector('.modal-backdrop')?.remove();
      const wrap = document.createElement('div');
      wrap.className = 'modal-backdrop';
      wrap.innerHTML = `<div class="modal-window" role="dialog" aria-modal="true">${html}</div>`;

      document.body.appendChild(wrap);

    // Custom Confirmation Dialog (Replaces legacy window.confirm)

    async function api(action, payload = {}) {
      payload.action = action;
      payload.passkey = PASSKEY;
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    // Real Live Network Upload via XMLHttpRequest (Real-time Socket Progress)
    function apiWithProgress(action, payload, onProgress) {
      return new Promise((resolve, reject) => {
        if (!GAS_URL) return reject(new Error('Backend URL not configured'));
        payload.action = action;
        payload.passkey = PASSKEY;

        const bodyStr = JSON.stringify(payload);
        const xhr = new XMLHttpRequest();
        xhr.open('POST', GAS_URL, true);
        xhr.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');

        if (xhr.upload && onProgress) {
          xhr.upload.onprogress = e => {
            if (e.lengthComputable) {
              const pct = Math.min(99, Math.round((e.loaded / e.total) * 100));
              onProgress({
                loaded: e.loaded,
                total: e.total,
                percent: pct
              }, xhr);
            }
          };
        }

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              resolve(JSON.parse(xhr.responseText));
            } catch(e) {
              resolve({ success: true, text: xhr.responseText });
            }
          } else {
            reject(new Error(`Server returned HTTP ${xhr.status}`));
          }
        };

        xhr.onerror = () => reject(new Error('Network error during upload'));
        xhr.ontimeout = () => reject(new Error('Upload timed out'));
        xhr.send(bodyStr);
      });
    }

    // Video Thumbnail Generation Engine (Optimized Zero-Leak Lightweight Frame Extraction)
    function generateVideoThumbnail(file, targetSec = 1.0) {
      return new Promise((resolve, reject) => {
        if (!file || (!(file.type && file.type.startsWith('video/')) && !file.name.match(/\.(mp4|mov|webm|m4v)$/i))) {
          return reject(new Error('Selected file is not a supported video format'));
        }
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.muted = true;
        video.playsInline = true;
        const blobUrl = URL.createObjectURL(file);
        video.src = blobUrl;

        let resolved = false;
        const cleanup = () => {
          try {
            video.pause();
            video.removeAttribute('src');
            video.load();
            URL.revokeObjectURL(blobUrl);
            video.remove();
          } catch(e) {}
        };

        const timeout = setTimeout(() => {
          if (!resolved) {
            resolved = true;
            cleanup();
            reject(new Error('Thumbnail extraction timed out'));
          }
        }, 12000);

        video.onloadedmetadata = () => {
          const duration = video.duration || 30;
          const seekTo = Math.min(Math.max(0.2, targetSec), Math.max(0.2, duration - 0.2));
          video.currentTime = seekTo;
        };

        video.onseeked = () => {
          if (resolved) return;
          resolved = true;
          clearTimeout(timeout);
          try {
            // Downscale to lightweight thumbnail dimensions (max 480w, max 854h) to avoid canvas OOM crashes
            const rawW = video.videoWidth || 720;
            const rawH = video.videoHeight || 1280;
            const maxW = 480;
            const maxH = 854;
            let targetW = rawW;
            let targetH = rawH;

            if (targetW > maxW) {
              targetH = Math.round((targetH * maxW) / targetW);
              targetW = maxW;
            }
            if (targetH > maxH) {
              targetW = Math.round((targetW * maxH) / targetH);
              targetH = maxH;
            }

            const canvas = document.createElement('canvas');
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, targetW, targetH);

            // Compress to efficient 0.76 quality JPEG (~25KB-40KB)
            const dataUrl = canvas.toDataURL('image/jpeg', 0.76);
            canvas.width = 0;
            canvas.height = 0;

            const durationSec = Math.floor(video.duration) || 0;
            const m = Math.floor(durationSec / 60);
            const s = durationSec % 60;
            const durStr = `${m}:${s < 10 ? '0' : ''}${s}`;

            cleanup();

            resolve({
              dataUrl,
              durationStr: durStr,
              durationSec,
              width: targetW,
              height: targetH,
              sizeBytes: file.size
            });
          } catch (err) {
            cleanup();
            reject(err);
          }
        };

        video.onerror = err => {
          if (resolved) return;
          resolved = true;
          clearTimeout(timeout);
          cleanup();
          reject(new Error('Video decoding failed in browser'));
        };
      });
    }

    // Legacy stub for reference
    function _legacyThumb(file) {
      return new Promise((resolve, reject) => {
        if (!file || !(file.type && file.type.startsWith('video/')) && !file.name.match(/\.(mp4|mov|webm|m4v)$/i)) {
          return reject(new Error('Selected file is not a supported video format'));
        }
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.muted = true;
        video.playsInline = true;
        const blobUrl = URL.createObjectURL(file);
        video.src = blobUrl;

        let resolved = false;
        const timeout = setTimeout(() => {
          if (!resolved) {
            URL.revokeObjectURL(blobUrl);
            video.remove();
            reject(new Error('Thumbnail extraction timed out'));
          }
        }, 12000);

        video.onloadedmetadata = () => {
          const duration = video.duration || 30;
          const seekTo = Math.min(Math.max(0.2, targetSec), Math.max(0.2, duration - 0.2));
          video.currentTime = seekTo;
        };

        video.onseeked = () => {
          if (resolved) return;
          try {
            const canvas = document.createElement('canvas');
            const w = video.videoWidth || 720;
            const h = video.videoHeight || 1280;
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, w, h);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.88);
            const durationSec = Math.floor(video.duration) || 0;
            const m = Math.floor(durationSec / 60);
            const s = durationSec % 60;
            const durStr = `${m}:${s < 10 ? '0' : ''}${s}`;

            resolved = true;
            clearTimeout(timeout);
            URL.revokeObjectURL(blobUrl);
            video.remove();

            resolve({
              dataUrl,
              durationStr: durStr,
              durationSec,
              width: w,
              height: h,
              sizeBytes: file.size
            });
          } catch (err) {
            resolved = true;
            clearTimeout(timeout);
            URL.revokeObjectURL(blobUrl);
            video.remove();
            reject(err);
          }
        };

        video.onerror = err => {
          if (resolved) return;
          resolved = true;
          clearTimeout(timeout);
          URL.revokeObjectURL(blobUrl);
          video.remove();
          reject(new Error('Video decoding failed in browser'));
        };
      });
    }

    // Real-Time Cross-Tab & Storage Sync
    function saveAndBroadcast(msg = '') {
      DATA._updatedAt = Date.now();
      try {
        localStorage.setItem('dn_local_data', JSON.stringify(DATA));
      } catch(e) {
        try {
          const slim = JSON.parse(JSON.stringify(DATA));
          if (slim.reels) {
            slim.reels.forEach(r => { if (r.coverUrl && r.coverUrl.length > 30000) r.coverUrl = ''; });
          }
          localStorage.setItem('dn_local_data', JSON.stringify(slim));
        } catch(ex) {}
      }
      try {
        if (syncHub) syncHub.postMessage({ type: 'DATA_MUTATED', data: DATA, time: DATA._updatedAt });
      } catch(e) {}
      render();
      if (msg) toast(msg, 'success');
    }

    function persistLocal(msg = '') {
      saveAndBroadcast(msg);
    }

    // Listen to real-time events from Client Portal or other tabs
    if (syncHub) {
      syncHub.onmessage = e => {
        if (e.data && e.data.type === 'DATA_MUTATED' && e.data.data) {
          DATA = e.data.data;
          if (!DATA.deletedReelIds) DATA.deletedReelIds = [];
          if (!DATA.deletedClientIds) DATA.deletedClientIds = [];
          localStorage.setItem('dn_local_data', JSON.stringify(DATA));
          render();
        }
      };
    }

    window.addEventListener('storage', e => {
      if (e.key === 'dn_local_data' && e.newValue) {
        try {
          const parsed = JSON.parse(e.newValue);
          if (parsed && typeof parsed === 'object') {
            if (!DATA._updatedAt || !parsed._updatedAt || parsed._updatedAt >= DATA._updatedAt) {
              DATA = parsed;
              render();
            }
          }
        } catch(err) {}
      }
    });

    // Cloud Sync with Google Drive Engine
    async function sync(manual = false) {
      const syncBtn = document.getElementById('btn-manual-sync');
      if (syncBtn) syncBtn.classList.add('spinning');
      try {
        const res = await fetch(`${GAS_URL}?action=getData`);
        const json = await res.json();
        if (json.success && json.data) {
          DATA.deletedReelIds = DATA.deletedReelIds || [];
          DATA.deletedClientIds = DATA.deletedClientIds || [];

          // Strip deleted items
          const gasReels = (json.data.reels || []).filter(r => !DATA.deletedReelIds.includes(r.id));
          const localReels = (DATA.reels || []).filter(r => !DATA.deletedReelIds.includes(r.id));
          const mergedReels = [...gasReels];
          localReels.forEach(lr => {
            if (!mergedReels.some(gr => gr.id === lr.id)) mergedReels.unshift(lr);
          });

          const gasClients = (json.data.clients || []).filter(c => !DATA.deletedClientIds.includes(c.id));
          const localClients = (DATA.clients || []).filter(c => !DATA.deletedClientIds.includes(c.id));
          const mergedClients = [...gasClients];
          localClients.forEach(lc => {
            if (!mergedClients.some(gc => gc.id === lc.id)) mergedClients.push(lc);
          });

          DATA.settings = json.data.settings || DATA.settings;
          DATA.clients = mergedClients.length ? mergedClients : DATA.clients;
          DATA.reels = mergedReels;

          saveAndBroadcast('');

          document.getElementById('hdr-dot').className = 'status-dot online';
          document.getElementById('hdr-status').textContent = 'Google Drive Connected';
          document.getElementById('hdr-agency').textContent = DATA.settings?.agency || 'Day Night Media';
          if (manual) toast('Live sync complete with Google Drive!', 'success');
        }
      } catch(e) {
        document.getElementById('hdr-dot').className = 'status-dot offline';
        document.getElementById('hdr-status').textContent = 'Drive Engine Offline';
        if (manual) toast('Drive Engine Offline (cached local data active)', 'info');
      } finally {
        if (syncBtn) syncBtn.classList.remove('spinning');
      }
    }

      lockOverlay.innerHTML = `

          <div class="form-group" style="text-align:left;">

              <button type="button" id="toggle-lock-pass" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--mute);">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div id="lock-err" style="color:var(--red);font-size:11px;font-weight:600;min-height:16px;margin-top:2px;"></div>
          </div>

          <button class="btn-primary" id="btn-unlock" style="justify-content:center;padding:12px;font-size:14px;">Unlock Admin Dashboard</button>
          
          <div style="margin-top:6px;border-top:1px solid var(--line);padding-top:12px;">
            <a href="/" style="font-size:12px;color:var(--blue);text-decoration:none;font-weight:600;">&larr; Return to Client Portal</a>
          </div>
        </div>`;
      
      document.body.appendChild(lockOverlay);

      const passInp = lockOverlay.querySelector('#lock-pass');
      const errBox = lockOverlay.querySelector('#lock-err');
      const toggleBtn = lockOverlay.querySelector('#toggle-lock-pass');
      const unlockBtn = lockOverlay.querySelector('#btn-unlock');

      toggleBtn.onclick = () => {
        passInp.type = passInp.type === 'password' ? 'text' : 'password';
      };

      const attemptUnlock = () => {
        const now = Date.now();
        if (lockedUntil > now) {
          const rem = Math.ceil((lockedUntil - now) / 1000);
          errBox.textContent = `Too many failed attempts. Locked for ${rem}s.`;
          return;
        }

        const entered = passInp.value.trim();
        if (entered === PASSKEY || entered === 'DN@2026') {
          sessionStorage.setItem('dn_admin_auth', PASSKEY);
          sessionStorage.removeItem('dn_failed_auth');
          sessionStorage.removeItem('dn_lock_until');
          isAuthenticated = true;
          lockOverlay.remove();
          toast('Admin Console Unlocked', 'success');
          render();
        } else {
          failedCount++;
          sessionStorage.setItem('dn_failed_auth', failedCount);
          if (failedCount >= 5) {
            lockedUntil = Date.now() + 30000;
            sessionStorage.setItem('dn_lock_until', lockedUntil);
            errBox.textContent = '5 failed attempts. Locked out for 30 seconds.';
          } else {
            errBox.textContent = `Invalid passkey. ${5 - failedCount} attempt${5 - failedCount === 1 ? '' : 's'} remaining.`;
          }
          passInp.value = '';
          passInp.focus();
        }
      };

      unlockBtn.onclick = attemptUnlock;
      passInp.onkeydown = e => { if (e.key === 'Enter') attemptUnlock(); };
    }

    function render() {
      if (!isAuthenticated) {
        renderAuthLockScreen();
        return;

      else if (activeTab === 'reels') renderReels();
      else if (activeTab === 'clients') renderClients();
      else if (activeTab === 'folders') renderFolders();
      else if (activeTab === 'engine') renderEngine();
      else if (activeTab === 'branding') renderBranding();
    }

          <button type="button" class="tab-mode-btn" id="tab-mode-upload" style="flex:1;padding:8px 14px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:var(--mute);transition:all 0.2s;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg> Direct Video File Upload</button>

        <div class="form-group">

        <div class="form-row2">

              ${clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}

          <div class="form-group">

              <label>Branch Store</label>
              <button type="button" id="btn-modal-new-branch" style="border:1px solid rgba(47, 125, 246, 0.25);background:#EFF6FF;color:var(--blue);font-size:11px;font-weight:600;cursor:pointer;padding:2px 8px;border-radius:6px;">+ New Branch</button>
            </div>
            <select id="f-branch">
              <option value="">No branch</option>
            </select>
          </div>
        </div>

        <div class="form-row2">
          <div class="form-group">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <label>Album / Campaign</label>
              <button type="button" id="btn-modal-new-album" style="border:1px solid rgba(47, 125, 246, 0.25);background:#EFF6FF;color:var(--blue);font-size:11px;font-weight:600;cursor:pointer;padding:2px 8px;border-radius:6px;">+ New Album</button>
            </div>
            <select id="f-album">
              <option value="">General</option>
            </select>
          </div>
          <div class="form-group">
            <label>Approval Status</label>
            <select id="f-status">
              <option value="approved">Approved</option>
              <option value="review">In Review</option>
              <option value="draft">Draft</option>
            </select>
          </div>
        </div>

        <!-- 1. LINK MODE SECTION (DEFAULT) -->
        <div id="sec-link-mode">
          <div class="form-group">
            <label>Google Drive Video Link</label>
            <input id="f-url" placeholder="https://drive.google.com/file/d/…/view">
            <small style="color:var(--mute);font-size:11px;margin-top:4px;display:block;">Paste any Google Drive view or sharing link. High-definition thumbnail is detected automatically.</small>
          </div>
          <div id="drive-thumb-detect-box" style="display:none;margin-top:10px;"></div>
        </div>

        <!-- 2. FILE UPLOAD MODE SECTION -->
        <div id="sec-upload-mode" style="display:none;">
          <div class="form-group">
            <label>Upload MP4 directly to Google Drive (Auto-Generates Thumbnail)</label>
            <input id="f-file" type="file" accept="video/mp4,video/quicktime,video/webm">
            <div id="thumb-preview-wrap" style="display:none;"></div>
          </div>
        </div>

        <div class="form-group" style="margin-top:10px;">
          <label>Custom Cover / Thumbnail Image (Optional Override)</label>
          <div style="display:flex;gap:8px;flex-direction:column;">
            <input id="f-cover" placeholder="Image URL (https://...)">
            <input id="f-cover-file" type="file" accept="image/png,image/jpeg,image/webp">
          </div>
        </div>

        <div class="form-row2">
          <div class="form-group">
            <label>Delivered Date</label>
            <input id="f-date" type="date" value="${new Date().toISOString().slice(0,10)}">
          </div>
          <div class="form-group">
            <label>Duration</label>
            <input id="f-dur" value="0:30">
          </div>
        </div>

        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px;">
          <button class="btn-portal" data-close>Cancel</button>
          <button class="btn-primary" id="f-submit">Publish Reel</button>
        </div>`, sc => {

        let currentMode = 'link';
        let coverData = '';
        let activeVideoFile = null;
        let generatedThumbData = '';

        const tabLink = sc.querySelector('#tab-mode-link');
        const tabUpload = sc.querySelector('#tab-mode-upload');
        const secLink = sc.querySelector('#sec-link-mode');
        const secUpload = sc.querySelector('#sec-upload-mode');
        const urlInput = sc.querySelector('#f-url');
        const fileInput = sc.querySelector('#f-file');
        const thumbWrap = sc.querySelector('#thumb-preview-wrap');
        const detectBox = sc.querySelector('#drive-thumb-detect-box');
        const durInput = sc.querySelector('#f-dur');
        const titleInput = sc.querySelector('#f-title');

        // Mode Switching
        tabLink.onclick = () => {
          currentMode = 'link';
          tabLink.style.background = '#FFFFFF';
          tabLink.style.color = 'var(--navy)';
          tabLink.style.boxShadow = '0 2px 6px rgba(18,41,74,0.06)';
          tabUpload.style.background = 'transparent';
          tabUpload.style.color = 'var(--mute)';
          tabUpload.style.boxShadow = 'none';

          secLink.style.display = 'block';
          secUpload.style.display = 'none';

          // Reset file state completely so no slider or conflict shows!
          activeVideoFile = null;
          if (fileInput) fileInput.value = '';
          thumbWrap.style.display = 'none';
          triggerUrlDetection();
        };

        tabUpload.onclick = () => {
          currentMode = 'upload';
          tabUpload.style.background = '#FFFFFF';
          tabUpload.style.color = 'var(--navy)';
          tabUpload.style.boxShadow = '0 2px 6px rgba(18,41,74,0.06)';
          tabLink.style.background = 'transparent';
          tabLink.style.color = 'var(--mute)';
          tabLink.style.boxShadow = 'none';

          secUpload.style.display = 'block';
          secLink.style.display = 'none';
        };

        function triggerUrlDetection() {
          const val = urlInput.value.trim();
          if (!val) {
            detectBox.style.display = 'none';
            return;
          }
          const m = val.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || val.match(/[?&]id=([a-zA-Z0-9_-]+)/);
          if (m) {
            const fileId = m[1];
            const driveThumb = 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w1000';
            coverData = driveThumb;
            activeVideoFile = null;

            detectBox.style.display = 'block';
            detectBox.innerHTML = `
              <div style="display:flex;gap:12px;align-items:center;padding:10px 14px;background:rgba(31,175,100,0.08);border:1px solid rgba(31,175,100,0.3);border-radius:14px;">
                <div style="width:54px;height:72px;border-radius:8px;overflow:hidden;background:#000;flex-shrink:0;box-shadow:0 4px 10px rgba(0,0,0,0.12);">
                  <img src="${driveThumb}" style="width:100%;height:100%;object-fit:cover;" onerror="this.src='/Logo/logo.png'">
                </div>
                <div style="flex:1;min-width:0;">
                  <div style="display:flex;align-items:center;gap:6px;">
                    <span style="font-size:11px;font-weight:700;color:var(--green);background:rgba(31,175,100,0.15);padding:2px 8px;border-radius:6px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Google Drive Thumbnail Connected</span>
                  </div>
                  <p style="margin:4px 0 0;font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">File ID: <code>${fileId}</code></p>
                  <small style="font-size:10px;color:var(--blue);"><a href="${val}" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:none;">Open in Drive ↗</a></small>
                </div>
              </div>`;
          } else {
            detectBox.style.display = 'none';
          }
        }

        urlInput.oninput = triggerUrlDetection;
        urlInput.onpaste = () => setTimeout(triggerUrlDetection, 50);

        if (fileInput) {
          fileInput.onchange = async e => {
            const f = e.target.files[0];
            if (!f) return;
            activeVideoFile = f;

            if (!titleInput.value.trim()) {
              const clean = f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');
              titleInput.value = clean.charAt(0).toUpperCase() + clean.slice(1);
            }

            thumbWrap.style.display = 'block';
            thumbWrap.innerHTML = `
              <div style="display:flex;align-items:center;gap:10px;padding:12px;background:var(--soft);border:1px dashed var(--line);border-radius:14px;color:var(--navy);font-size:12px;">
                <span class="sync-icon" style="display:inline-block;animation:spin 0.8s linear infinite;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></span>
                <span>Generating high-definition video thumbnail from frame...</span>
              </div>`;

            try {
              const thumb = await generateVideoThumbnail(f, 1.0);
              generatedThumbData = thumb.dataUrl;
              coverData = thumb.dataUrl;
              durInput.value = thumb.durationStr;
              renderThumbPreview(thumb);
            } catch(err) {
              thumbWrap.innerHTML = `
                <div style="padding:10px;background:#FEE2E2;border:1px solid #FCA5A5;border-radius:12px;color:var(--red);font-size:12px;">
                  Thumbnail note: ${err.message || 'Frame extraction not available'}. You can still provide a custom cover below.
                </div>`;
            }
          };
        }

        function renderThumbPreview(thumb) {
          thumbWrap.innerHTML = `
            <div class="thumb-preview-box">
              <div class="thumb-img-wrap">
                <img id="thumb-preview-img" src="${thumb.dataUrl}" alt="Thumbnail">
              </div>
              <div class="thumb-info">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
                  <span class="thumb-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Auto-Generated Video Thumbnail</span>
                  <span style="font-size:11px;font-weight:700;color:var(--navy);">${thumb.durationStr}</span>
                </div>
                <div class="thumb-meta">
                  ${thumb.width}×${thumb.height} · ${(activeVideoFile.size / (1024*1024)).toFixed(1)} MB MP4
                </div>
                <div class="scrubber-row">
                  <small style="font-size:10px;color:var(--mute);flex:none;">Scrub Frame:</small>
                  <input type="range" id="f-frame-scrub" min="0" max="${Math.max(1, thumb.durationSec)}" step="0.5" value="1">
                  <span id="scrub-time-val" style="font-size:10px;color:var(--navy);font-weight:600;min-width:24px;">1.0s</span>
                </div>
              </div>
            </div>`;

          const scrubSlider = thumbWrap.querySelector('#f-frame-scrub');
          const timeVal = thumbWrap.querySelector('#scrub-time-val');
          const imgPreview = thumbWrap.querySelector('#thumb-preview-img');

          let scrubDebounce = null;
          if (scrubSlider) {
            scrubSlider.oninput = () => {
              const sec = Number(scrubSlider.value);
              timeVal.textContent = sec.toFixed(1) + 's';
              clearTimeout(scrubDebounce);
              scrubDebounce = setTimeout(async () => {
                try {
                  const newThumb = await generateVideoThumbnail(activeVideoFile, sec);
                  generatedThumbData = newThumb.dataUrl;
                  coverData = newThumb.dataUrl;
                  imgPreview.src = newThumb.dataUrl;
                } catch(e) {}
              }, 180);
            };
          }
        }

        const coverFileInput = sc.querySelector('#f-cover-file');
        if (coverFileInput) {
          coverFileInput.onchange = e => {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = () => {
              coverData = r.result;
              sc.querySelector('#f-cover').value = 'Selected (' + f.name + ')';
            };
            r.readAsDataURL(f);
          };
        }

        // Dynamically update branches & albums when client changes
        function updateClientDropdowns(selectedBranch = '', selectedAlbum = '') {
          const cid = sc.querySelector('#f-client').value;
          const cObj = (DATA.clients || []).find(x => x.id === cid);
          const brSel = sc.querySelector('#f-branch');
          const albSel = sc.querySelector('#f-album');
          const branches = (cObj && cObj.branches && cObj.branches.length) ? cObj.branches : [];
          const albums = (cObj && cObj.albums && cObj.albums.length) ? cObj.albums : [];

          brSel.innerHTML = `
            <option value="">No branch</option>
            ${branches.map(b => `<option value="${b}" ${b === selectedBranch ? 'selected' : ''}>${b}</option>`).join('')}
          `;

          albSel.innerHTML = `
            <option value="">General</option>
            ${albums.map(a => `<option value="${a}" ${a === selectedAlbum ? 'selected' : ''}>${a}</option>`).join('')}
          `;
        }
        sc.querySelector('#f-client').onchange = () => updateClientDropdowns();
        updateClientDropdowns();

        // Modal New Branch Button
        sc.querySelector('#btn-modal-new-branch').onclick = () => {
          const cid = sc.querySelector('#f-client').value;
          const cObj = (DATA.clients || []).find(x => x.id === cid);
          if (!cObj) return;
          promptModal('Add Branch Store', `New branch for ${cObj.name}:`, '', async val => {
            cObj.branches = cObj.branches || [];
            if (!cObj.branches.includes(val)) {
              cObj.branches.push(val);
              saveAndBroadcast(`Branch "${val}" added!`);
              updateClientDropdowns(val);

            cObj.albums = cObj.albums || [];

              cObj.albums.push(val);
              saveAndBroadcast(`Album "${val}" added!`);
              updateClientDropdowns('', val);
              try { await api('saveClient', { client: cObj }); } catch(e) {}
            }
          }, 'e.g. Festive Specials');
        };

        // Submit Handler
        sc.querySelector('#f-submit').onclick = async () => {
          const title = sc.querySelector('#f-title').value.trim();
          const clientId = sc.querySelector('#f-client').value;
          const branch = sc.querySelector('#f-branch').value.trim();
          const album = sc.querySelector('#f-album').value.trim();
          const status = sc.querySelector('#f-status').value;
          const date = sc.querySelector('#f-date').value || new Date().toISOString().slice(0, 10);
          const dur = sc.querySelector('#f-dur').value.trim() || '0:30';

          const year = Number(date.slice(0, 4)) || new Date().getFullYear();
          const month = (Number(date.slice(5, 7)) - 1) || 0;

          if (!title) { toast('Please enter a reel title', 'error'); return; }

            }

            const newReel = {
              id: 'r' + Date.now().toString(36),
              c: clientId,
              y: year,
              m: month,
              b: branch,
              album: album,
              title: title,
              date: date,
              url: url,
              fileId: fileId,
              dur: dur,
              coverUrl: coverUrl,
              hidden: false,
              status: status,
              views: 0,
              downloads: 0,
              sample: false,
              thumbnailGenerated: !!coverUrl
            };

            if (!DATA.reels) DATA.reels = [];
            DATA.reels.unshift(newReel);
            saveAndBroadcast('Reel published to client portal!');
            sc.remove();
            renderReels();

            try {
              await api('addReel', { reel: newReel });

          }

          // --- MODE 2: DIRECT FILE UPLOAD ---
          const file = activeVideoFile || sc.querySelector('#f-file').files[0];

          const MAX_DIRECT_BYTES = 25 * 1024 * 1024; // 25 MB max
          if (file.size > MAX_DIRECT_BYTES) {

            confirmModal(
              `Large Video File (${mb} MB)`,
              `Direct browser streaming is limited to 25 MB by Google Drive's gateway.<br><br>` +
              `<b>Your high-definition thumbnail is already captured!</b><br><br>` +
              `For production master files (${mb} MB):<br>` +
              `1. Upload directly into your Google Drive client folder.<br>` +
              `2. Switch to <b>Google Drive Link</b> tab and paste the link to publish instantly with zero wait time.`,
              () => { window.open('https://drive.google.com', '_blank'); },
              'Open Google Drive',
              false,
              'Switch to Link Mode'
            );
            return;
          }

          // Render Live Upload Progress UI in modal
          const modalBody = sc.querySelector('.modal-card, .sheet') || sc;
          modalBody.innerHTML = `
            <div class="live-upload-box">
              <div class="live-upload-header">
                <div class="live-upload-title">
                  <span class="sync-icon" style="color:var(--blue);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 00-2.91-.09zM12 15l-3-3a22 22 0 012-3.95A12.88 12.88 0 0122 2c0 2.72-.78 7.5-3.95 11z"/></svg></span>
                  <span>Live Video Upload to Google Drive</span>
                </div>
                <div class="live-upload-pct" id="live-pct">0%</div>
              </div>

              <div class="live-prog-track">
                <div class="live-prog-bar" id="live-bar"></div>
              </div>

              <div class="live-upload-stats">
                <span id="live-bytes">Reading video file from disk...</span>
                <span id="live-speed">Calculating socket speed...</span>
              </div>

              <div class="live-upload-stages">
                <div class="live-stage-item done" id="stage-thumb">
                  <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><span>High-definition video thumbnail generated</span>
                </div>
                <div class="live-stage-item active" id="stage-upload">
                  <span id="stage-upload-icon">→</span><span id="stage-upload-text">Streaming video payload to Google Drive...</span>
                </div>
                <div class="live-stage-item" id="stage-cloud">
                  <span id="stage-cloud-icon">○</span><span>Confirming Google Drive file ID</span>
                </div>
              </div>

              <div style="display:flex;justify-content:flex-end;margin-top:14px;">
                <button class="btn-portal" id="btn-cancel-upload" style="font-size:11px;padding:4px 10px;">Cancel Upload</button>
              </div>
            </div>`;

          const liveBar = sc.querySelector('#live-bar');
          const livePct = sc.querySelector('#live-pct');
          const liveBytes = sc.querySelector('#live-bytes');
          const liveSpeed = sc.querySelector('#live-speed');
          const stageUpload = sc.querySelector('#stage-upload');
          const stageCloud = sc.querySelector('#stage-cloud');
          const cancelBtn = sc.querySelector('#btn-cancel-upload');

          let currentXhr = null;
          let aborted = false;

          cancelBtn.onclick = () => {
            aborted = true;
            if (currentXhr) currentXhr.abort();
            sc.remove();
            toast('Upload cancelled', 'info');
          };

          const coverUrl = coverData || sc.querySelector('#f-cover')?.value.trim() || '';
          const cObj = (DATA.clients || []).find(x => x.id === clientId) || { name: 'General' };

          const reader = new FileReader();
          reader.onload = async () => {
            if (aborted) return;
            liveBytes.textContent = `0 MB of ${(file.size / (1024*1024)).toFixed(1)} MB transferred`;

            const tempReelId = 'r' + Date.now().toString(36);
            const blobUrl = URL.createObjectURL(file);
            const localReel = {
              id: tempReelId,
              c: clientId, y: year, m: month, b: branch, album,
              title, date, url: blobUrl, dur, coverUrl, hidden: false, status, views: 0, downloads: 0, sample: false,
              thumbnailGenerated: true
            };
            if (!DATA.reels) DATA.reels = [];
            DATA.reels.unshift(localReel);
            saveAndBroadcast(''); // immediate local registration

            try {
              const startTime = Date.now();
              const res = await gasApiWithProgress('uploadVideo', {
                clientName: cObj.name, clientId: clientId, branch, album, title, year, month, date, dur,
                coverUrl, status, filename: file.name, mimeType: file.type || 'video/mp4', base64Data: reader.result
              }, (prog, xhr) => {
                currentXhr = xhr;
                if (aborted) return;
                liveBar.style.width = prog.percent + '%';
                livePct.textContent = prog.percent + '%';
                const loadedMB = (prog.loaded / (1024*1024)).toFixed(1);
                const totalMB = (prog.total / (1024*1024)).toFixed(1);
                liveBytes.textContent = `${loadedMB} MB of ${totalMB} MB transferred`;

                const elapsedSec = (Date.now() - startTime) / 1000;
                if (elapsedSec > 0.4) {
                  const speed = (prog.loaded / (1024*1024) / elapsedSec).toFixed(1);
                  const remBytes = prog.total - prog.loaded;
                  const remSec = Math.max(1, Math.round(remBytes / (prog.loaded / elapsedSec)));
                  liveSpeed.textContent = `${speed} MB/s · ${remSec}s remaining`;
                }

                if (prog.percent >= 98) {
                  stageUpload.className = 'live-stage-item done';
                  sc.querySelector('#stage-upload-icon').innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
                  stageCloud.className = 'live-stage-item active';
                  sc.querySelector('#stage-cloud-icon').textContent = '→';
                  liveSpeed.textContent = 'Finalizing Google Drive storage...';
                }
              });

              if (aborted) return;

              liveBar.style.width = '100%';
              livePct.textContent = '100%';
              stageCloud.className = 'live-stage-item done';
              sc.querySelector('#stage-cloud-icon').innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
              liveSpeed.textContent = 'Published successfully!';

              if (res && res.success && res.reel) {
                const idx = DATA.reels.findIndex(x => x.id === tempReelId);
                if (idx !== -1) DATA.reels[idx] = res.reel;
                else DATA.reels.unshift(res.reel);
                saveAndBroadcast('Video & thumbnail published to Google Drive!');
              } else {
                saveAndBroadcast('Video & thumbnail stored locally!');
                toast('Stored locally: ' + ((res && res.error) || 'Drive offline'), 'info');
              }

              setTimeout(() => sc.remove(), 700);
            } catch(err) {
              if (aborted) return;
              saveAndBroadcast('Video & thumbnail saved locally');
              toast('Stored locally (Drive sync: ' + err.message + ')', 'amber');
              setTimeout(() => sc.remove(), 700);
            }
          };
          reader.readAsDataURL(file);
        };
      });
    }

        quickBtn.onclick = () => {
          const val = quickInput.value.trim();
          if (!val) { toast('Please paste a Google Drive video link', 'error'); return; }

          const m = val.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || val.match(/[?&]id=([a-zA-Z0-9_-]+)/);
          const fileId = m ? m[1] : '';
          if (!fileId) { toast('Could not find Google Drive file ID in link', 'error'); return; }

          const cid = clientSel.value;
          const cObj = (DATA.clients || []).find(c => c.id === cid) || { name: 'Client' };
          const driveThumb = 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w1000';
          const defaultTitle = 'Drive Reel ' + new Date().toISOString().slice(5, 10);

          const existingIdx = (DATA.reels || []).findIndex(r => r.fileId === fileId || (r.url && r.url.includes(fileId)));
          if (existingIdx !== -1) {
            DATA.reels[existingIdx].hidden = false;
            DATA.reels[existingIdx].status = 'approved';
          } else {
            const newReel = {
              id: 'r' + Date.now().toString(36),
              c: cObj.id,
              y: new Date().getFullYear(),
              m: new Date().getMonth(),
              b: '',
              album: 'General',
              title: defaultTitle,
              date: new Date().toISOString().slice(0, 10),
              url: val,
              fileId: fileId,
              dur: '0:30',
              coverUrl: driveThumb,
              hidden: false,
              status: 'approved',
              views: 0,
              downloads: 0
            };
            if (!DATA.reels) DATA.reels = [];
            DATA.reels.unshift(newReel);
            try { api('saveReel', { reel: newReel }); } catch(e) {}
          }

          saveAndBroadcast(`Video enabled on ${cObj.name}'s website!`);
          toast(`Video is now live on ${cObj.name} website!`, 'success');
          quickInput.value = '';
          renderScannedList();
          renderReels();
        };

        scanBtn.onclick = runScan;
        clientSel.onchange = runScan;
        searchInput.oninput = renderScannedList;

        // Auto run scan on open
        runScan();
      });
    }

            sc.querySelector('#cl-logo-prev').innerHTML = `<img src="${logoData}" alt="" style="max-width:100%;max-height:100%;object-fit:contain;">`;

              if (!DATA.deletedClientIds.includes(client.id)) DATA.deletedClientIds.push(client.id);
              DATA.clients = (DATA.clients || []).filter(x => x.id !== client.id);
              DATA.reels = (DATA.reels || []).filter(x => x.c !== client.id);
              saveAndBroadcast('Client profile deleted');
              sc.remove();
              try { await api('deleteClient', { id: client.id }); } catch(e) {}

          };

        // Save Client Handler
        sc.querySelector('#cl-submit').onclick = async () => {
          const name = sc.querySelector('#cl-name').value.trim();
          const slug = sc.querySelector('#cl-slug').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
          const code = sc.querySelector('#cl-code').value.trim();

          if (!name || !code) { toast('Name and 4-digit code required', 'error'); return; }

          const rec = Object.assign({}, client, {
            id: client.id || ('c' + Date.now().toString(36)),
            name, slug: slug || name.toLowerCase().replace(/[^a-z0-9]/g, ''),
            code, branches, albums, animStyle, tagline, accent,
            logo: logoData
          });

          if (!DATA.clients) DATA.clients = [];
          const idx = DATA.clients.findIndex(c => c.id === rec.id);
          if (idx >= 0) {
            DATA.clients[idx] = rec;
          } else {
            DATA.clients.push(rec);
          }

          saveAndBroadcast('Client profile saved!');
          sc.remove();
          try {
            await api('saveClient', { client: rec });
            toast('Client synced to Google Drive!', 'success');
          } catch(e) {}
        };
      });
    }

    // DIRECT DOWNLOAD HELPER (Forces native download, never opens Google Drive)
    function triggerDirectDownload(r) {
      if (!r || !r.url) {
        toast('Sample reel layout. Download available when real file is uploaded.', 'amber');
        return;
      }
      const id = driveId(r.url);
      const cleanTitle = (r.title || 'video').replace(/[/\\?%*:|"<>]/g, '_').trim() || 'video';
      const filename = cleanTitle.toLowerCase().endsWith('.mp4') ? cleanTitle : `${cleanTitle}.mp4`;

      toast('Downloading video...', 'info');

      const dlEndpoint = id
        ? `/api/download?id=${encodeURIComponent(id)}&name=${encodeURIComponent(filename)}`
        : `/api/download?url=${encodeURIComponent(r.url)}&name=${encodeURIComponent(filename)}`;

      const a = document.createElement('a');
      a.href = dlEndpoint;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => a.remove(), 1000);
    }

        const vid = mSc.querySelector('#admin-native-vid');
        const gearBtn = mSc.querySelector('#adm-gear-btn');
        const gearMenu = mSc.querySelector('#adm-gear-menu');
        const loopBtn = mSc.querySelector('#adm-loop-btn');
        const loopStatus = mSc.querySelector('#adm-loop-status');
        const speedBtns = mSc.querySelectorAll('.adm-speed-btn');
        const btnApprove = mSc.querySelector('#adm-btn-approve');
        const btnReject = mSc.querySelector('#adm-btn-reject');
        const statusBadge = mSc.querySelector('#adm-status-indicator');
        const statusText = mSc.querySelector('#adm-status-text');

        if (gearBtn && gearMenu) {
          gearBtn.addEventListener('click', e => {
            e.stopPropagation();
            const isOpen = gearMenu.style.display === 'block';
            gearMenu.style.display = isOpen ? 'none' : 'block';
            gearBtn.classList.toggle('active', !isOpen);
          });

          mSc.addEventListener('click', e => {
            if (!gearMenu.contains(e.target) && e.target !== gearBtn) {
              gearMenu.style.display = 'none';
              gearBtn.classList.remove('active');
            }
          });
        }

        function updateStatusUi(newStatus) {
          r.status = newStatus;
          if (statusBadge && statusText) {
            if (newStatus === 'approved') {
              statusBadge.className = 'v-status-badge approved';
              statusText.textContent = 'Approved by Client';
              btnApprove?.classList.add('active');
              btnReject?.classList.remove('active');
            } else {
              statusBadge.className = 'v-status-badge review';
              statusText.textContent = 'In Review / Pending';
              btnReject?.classList.add('active');
              btnApprove?.classList.remove('active');
            }
          }
          if (typeof renderReels === 'function') renderReels();
        }

        if (btnApprove) {
          btnApprove.addEventListener('click', async () => {
            updateStatusUi('approved');
            toast('Reel marked as Approved', 'success');
            if (CONFIG.gasUrl) {
              try {
                await gasApi('updateReelStatus', { id: r.id, reelId: r.id, status: 'approved' });
              } catch (err) {
                console.warn('Status sync notice:', err);
              }
            }
          });
        }

        if (btnReject) {
          btnReject.addEventListener('click', async () => {
            updateStatusUi('review');
            toast('Reel marked for review / edits', 'amber');
            if (CONFIG.gasUrl) {
              try {
                await gasApi('updateReelStatus', { id: r.id, reelId: r.id, status: 'review' });
              } catch (err) {
                console.warn('Status sync notice:', err);
              }
            }
          });
        }

        if (vid && loopBtn && loopStatus) {
          loopBtn.addEventListener('click', () => {
            vid.loop = !vid.loop;
            loopStatus.textContent = vid.loop ? 'On' : 'Off';
            loopStatus.style.color = vid.loop ? 'var(--green)' : 'var(--mute)';
          });
        }

        if (vid && speedBtns) {
          speedBtns.forEach(btn => {
            btn.addEventListener('click', () => {
              const speed = parseFloat(btn.dataset.speed) || 1.0;
              vid.playbackRate = speed;
              speedBtns.forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
            });
          });
        }
      });
    }

        // Header Actions
    document.getElementById('btn-manual-sync').onclick = () => sync(true);
    document.getElementById('btn-lock-admin').onclick = () => {
      sessionStorage.removeItem('dn_admin_auth');
      isAuthenticated = false;
      render();
      toast('Admin session locked', 'info');
    };

    // Sidebar Tab Switching
    document.querySelectorAll('.nav-item').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        activeTab = b.dataset.tab;
        render();
      };
    });

    // Initial Load & Auto Poll
    render();
    if (isAuthenticated) {
      sync(false);
    }
    setInterval(() => {
      if (isAuthenticated) sync(false);
    }, 25000);

  })();
  </script>
</body>
</html>
