              <div style="display:flex;gap:12px;align-items:center;padding:10px 14px;background:rgba(31,175,100,0.08);border:1px solid rgba(31,175,100,0.3);border-radius:14px;">
                <div style="width:54px;height:72px;border-radius:8px;overflow:hidden;background:#000;flex-shrink:0;box-shadow:0 4px 10px rgba(0,0,0,0.12);">
                  <img src="${driveThumb}" style="width:100%;height:100%;object-fit:cover;" onerror="this.src='/Logo/logo.png'">
                </div>
                <div style="flex:1;min-width:0;">
                  <div style="display:flex;align-items:center;gap:6px;">
                    <span style="font-size:11px;font-weight:700;color:var(--green);background:rgba(31,175,100,0.15);padding:2px 8px;border-radius:6px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Google Drive Thumbnail Connected</span>
                  </div>
                  <p style="margin:4px 0 0;font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">File ID: <code>${fileId}</code></p>
                  <small style="font-size:10px;color:var(--blue);"><a href="${val}" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:none;">Open in Drive ↗</a></small>
                </div>
              </div>`;
          } else {
            detectBox.style.display = 'none';
          }
        }

        urlInput.oninput = triggerUrlDetection;
        urlInput.onpaste = () => setTimeout(triggerUrlDetection, 50);

        if (fileInput) {
          fileInput.onchange = async e => {
            const f = e.target.files[0];
            if (!f) return;
            activeVideoFile = f;

            if (!titleInput.value.trim()) {
              const clean = f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');
              titleInput.value = clean.charAt(0).toUpperCase() + clean.slice(1);
            }

            thumbWrap.style.display = 'block';
            thumbWrap.innerHTML = `
              <div style="display:flex;align-items:center;gap:10px;padding:12px;background:var(--soft);border:1px dashed var(--line);border-radius:14px;color:var(--navy);font-size:12px;">
                <span class="sync-icon" style="display:inline-block;animation:spin 0.8s linear infinite;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></span>
                <span>Generating high-definition video thumbnail from frame...</span>
              </div>`;

            try {
              const thumb = await generateVideoThumbnail(f, 1.0);
              generatedThumbData = thumb.dataUrl;
              coverData = thumb.dataUrl;
              durInput.value = thumb.durationStr;
              renderThumbPreview(thumb);
            } catch(err) {
              thumbWrap.innerHTML = `
                <div style="padding:10px;background:#FEE2E2;border:1px solid #FCA5A5;border-radius:12px;color:var(--red);font-size:12px;">
                  Thumbnail note: ${err.message || 'Frame extraction not available'}. You can still provide a custom cover below.
                </div>`;
            }
          };
        }

        function renderThumbPreview(thumb) {
          thumbWrap.innerHTML = `
            <div class="thumb-preview-box">
              <div class="thumb-img-wrap">
                <img id="thumb-preview-img" src="${thumb.dataUrl}" alt="Thumbnail">
              </div>
              <div class="thumb-info">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
                  <span class="thumb-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Auto-Generated Video Thumbnail</span>
                  <span style="font-size:11px;font-weight:700;color:var(--navy);">${thumb.durationStr}</span>
                </div>
                <div class="thumb-meta">
                  ${thumb.width}×${thumb.height} · ${(activeVideoFile.size / (1024*1024)).toFixed(1)} MB MP4
                </div>
                <div class="scrubber-row">
                  <small style="font-size:10px;color:var(--mute);flex:none;">Scrub Frame:</small>
                  <input type="range" id="f-frame-scrub" min="0" max="${Math.max(1, thumb.durationSec)}" step="0.5" value="1">
                  <span id="scrub-time-val" style="font-size:10px;color:var(--navy);font-weight:600;min-width:24px;">1.0s</span>
                </div>
              </div>
            </div>`;

          const scrubSlider = thumbWrap.querySelector('#f-frame-scrub');
          const timeVal = thumbWrap.querySelector('#scrub-time-val');
          const imgPreview = thumbWrap.querySelector('#thumb-preview-img');

          let scrubDebounce = null;
          if (scrubSlider) {
            scrubSlider.oninput = () => {
              const sec = Number(scrubSlider.value);
              timeVal.textContent = sec.toFixed(1) + 's';
              clearTimeout(scrubDebounce);
              scrubDebounce = setTimeout(async () => {
                try {
                  const newThumb = await generateVideoThumbnail(activeVideoFile, sec);
                  generatedThumbData = newThumb.dataUrl;
                  coverData = newThumb.dataUrl;
                  imgPreview.src = newThumb.dataUrl;
                } catch(e) {}
              }, 180);
            };
          }
        }

        const customThumbInput = sc.querySelector('#f-custom-thumb-file');
        const btnPickCustomThumb = sc.querySelector('#btn-pick-custom-thumb');
        const customThumbFname = sc.querySelector('#custom-thumb-fname');
        const btnRemoveCustomThumb = sc.querySelector('#btn-remove-custom-thumb');
        const customThumbPrevBox = sc.querySelector('#custom-thumb-preview-box');
        const customThumbPrevImg = sc.querySelector('#custom-thumb-preview-img');
        const customThumbDims = sc.querySelector('#custom-thumb-dims');
        const customThumbStatus = sc.querySelector('#custom-thumb-status');

        if (btnPickCustomThumb && customThumbInput) {
          btnPickCustomThumb.onclick = () => customThumbInput.click();
          customThumbInput.onchange = e => {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = () => {
              const img = new Image();
              img.onload = () => {
                const maxDim = 1200;
                let w = img.width, h = img.height;
                if (w > maxDim || h > maxDim) {
                  if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                  else { w = Math.round((w * maxDim) / h); h = maxDim; }
                }
                const canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.88);
                coverData = dataUrl;

                customThumbFname.textContent = f.name;
                customThumbDims.textContent = `${w}×${h} · Custom Cover`;
                customThumbPrevImg.src = dataUrl;
                customThumbPrevBox.style.display = 'flex';
                btnRemoveCustomThumb.style.display = 'inline-block';
                customThumbStatus.textContent = 'Custom Image Selected';
                customThumbStatus.style.color = 'var(--green)';

                // If in upload mode, also update the main thumbnail preview image
                const thumbPreviewImg = sc.querySelector('#thumb-preview-img');
                if (thumbPreviewImg) thumbPreviewImg.src = dataUrl;
              };
              img.src = r.result;
            };
            r.readAsDataURL(f);
          };
        }

        if (btnRemoveCustomThumb) {
          btnRemoveCustomThumb.onclick = () => {
            customThumbInput.value = '';
            customThumbFname.textContent = 'Auto frame / Drive thumbnail';
            customThumbPrevBox.style.display = 'none';
            btnRemoveCustomThumb.style.display = 'none';
            customThumbStatus.textContent = 'JPG, PNG, WebP';
            customThumbStatus.style.color = 'var(--mute)';
            coverData = generatedThumbData || '';
            const thumbPreviewImg = sc.querySelector('#thumb-preview-img');
            if (thumbPreviewImg && generatedThumbData) thumbPreviewImg.src = generatedThumbData;
            if (currentMode === 'link') triggerUrlDetection();
          };
        }

        // Dynamically update branches & albums when client changes
        function updateClientDropdowns(selectedBranch = '', selectedAlbum = '') {
          const cid = sc.querySelector('#f-client').value;
          const cObj = (DATA.clients || []).find(x => x.id === cid);
          const brSel = sc.querySelector('#f-branch');
          const albSel = sc.querySelector('#f-album');
          const branches = (cObj && cObj.branches && cObj.branches.length) ? cObj.branches : [];
          const albums = (cObj && cObj.albums && cObj.albums.length) ? cObj.albums : [];

          brSel.innerHTML = `
            <option value="">No branch</option>
            ${branches.map(b => `<option value="${b}" ${b === selectedBranch ? 'selected' : ''}>${b}</option>`).join('')}
          `;

          albSel.innerHTML = `
            <option value="">General</option>
            ${albums.map(a => `<option value="${a}" ${a === selectedAlbum ? 'selected' : ''}>${a}</option>`).join('')}
          `;
        }
        sc.querySelector('#f-client').onchange = () => updateClientDropdowns();
        updateClientDropdowns();

        // Modal New Branch Button
        sc.querySelector('#btn-modal-new-branch').onclick = () => {
          const cid = sc.querySelector('#f-client').value;
          const cObj = (DATA.clients || []).find(x => x.id === cid);
          if (!cObj) return;
          promptModal('Add Branch Store', `New branch for ${cObj.name}:`, '', async val => {
            cObj.branches = cObj.branches || [];
            if (!cObj.branches.includes(val)) {
              cObj.branches.push(val);
              saveAndBroadcast(`Branch "${val}" added!`);
              updateClientDropdowns(val);
              try { await api('saveClient', { client: cObj }); } catch(e) {}
            }
          }, 'e.g. Chromepet');
        };

        // Modal New Album Button
        sc.querySelector('#btn-modal-new-album').onclick = () => {
          const cid = sc.querySelector('#f-client').value;
          const cObj = (DATA.clients || []).find(x => x.id === cid);
          if (!cObj) return;
          promptModal('Add Album / Campaign', `New album for ${cObj.name}:`, '', async val => {
            cObj.albums = cObj.albums || [];
            if (!cObj.albums.includes(val)) {
              cObj.albums.push(val);
              saveAndBroadcast(`Album "${val}" added!`);
              updateClientDropdowns('', val);
              try { await api('saveClient', { client: cObj }); } catch(e) {}
            }
          }, 'e.g. Festive Specials');
        };

        // Submit Handler
        sc.querySelector('#f-submit').onclick = async () => {
          const title = sc.querySelector('#f-title').value.trim();
          const clientId = sc.querySelector('#f-client').value;
          const branch = sc.querySelector('#f-branch').value.trim();
          const album = sc.querySelector('#f-album').value.trim();
          const status = sc.querySelector('#f-status').value;
          const date = sc.querySelector('#f-date').value || new Date().toISOString().slice(0, 10);
          const dur = sc.querySelector('#f-dur').value.trim();

          const year = Number(date.slice(0, 4)) || new Date().getFullYear();
          const month = (Number(date.slice(5, 7)) - 1) || 0;

          if (!title) { toast('Please enter a reel title', 'error'); return; }

          // --- MODE 1: GOOGLE DRIVE LINK ---
          if (currentMode === 'link') {
            const url = sc.querySelector('#f-url').value.trim();
            if (!url) { toast('Please paste a Google Drive video link', 'error'); return; }

            let coverUrl = coverData || '';
            const m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            const fileId = m ? m[1] : '';
            if (!coverUrl && fileId) {
              coverUrl = 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w1000';
            }

            const newReel = {
              id: 'r' + Date.now().toString(36),
              c: clientId,
              y: year,
              m: month,
              b: branch,
              album: album,
              title: title,
              date: date,
              url: url,
              fileId: fileId,
              dur: dur,
              coverUrl: coverUrl,
              hidden: false,
              status: status,
              views: 0,
              downloads: 0,
              sample: false,
              thumbnailGenerated: !!coverUrl
            };

            if (!DATA.reels) DATA.reels = [];
            DATA.reels.unshift(newReel);
            saveAndBroadcast('Reel published to client portal!');
            sc.remove();
            renderReels();

            try {
              await api('addReel', { reel: newReel });
              toast('Reel synced to Google Drive!', 'success');
            } catch(e) {}
            return;
          }

          // --- MODE 2: DIRECT HIGH-CAPACITY RESUMABLE UPLOAD (Supports 700MB - 5GB+) ---
          const file = activeVideoFile || sc.querySelector('#f-file').files[0];
          if (!file) { toast('Please select an MP4 video file to upload', 'error'); return; }

          const coverUrl = coverData || generatedThumbData || '';
          const cObj = (DATA.clients || []).find(x => x.id === clientId) || { name: 'General' };

          // Render Live Upload Progress UI in modal
          const modalBody = sc.querySelector('.modal-window') || sc;
          modalBody.innerHTML = `
            <div class="live-upload-box">
              <div class="live-upload-header">
                <div class="live-upload-title">
                  <span class="sync-icon" style="color:var(--blue);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 00-2.91-.09zM12 15l-3-3a22 22 0 012-3.95A12.88 12.88 0 0122 2c0 2.72-.78 7.5-3.95 11z"/></svg></span>
                  <span>Direct Master Stream to Google Drive</span>
                </div>
                <div class="live-upload-pct" id="live-pct">0%</div>
              </div>

              <div class="live-prog-track">
                <div class="live-prog-bar" id="live-bar"></div>
              </div>

              <div class="live-upload-stats">
                <span id="live-bytes">Initializing Google Drive session (${(file.size / (1024*1024)).toFixed(1)} MB)...</span>
                <span id="live-speed">Connecting...</span>
              </div>

              <div class="live-upload-stages">
                <div class="live-stage-item done" id="stage-thumb">
                  <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><span>High-definition video thumbnail generated</span>
                </div>
                <div class="live-stage-item active" id="stage-upload">
                  <span id="stage-upload-icon">→</span><span id="stage-upload-text">Streaming raw binary directly to Google Drive...</span>
                </div>
                <div class="live-stage-item" id="stage-cloud">
                  <span id="stage-cloud-icon">○</span><span>Confirming Google Drive file ID &amp; permissions</span>
                </div>
              </div>

              <div style="display:flex;justify-content:flex-end;margin-top:14px;">
                <button class="btn-portal" id="btn-cancel-upload" style="font-size:11px;padding:4px 10px;">Cancel Upload</button>
              </div>
            </div>`;

          const liveBar = sc.querySelector('#live-bar');
          const livePct = sc.querySelector('#live-pct');
          const liveBytes = sc.querySelector('#live-bytes');
          const liveSpeed = sc.querySelector('#live-speed');
          const stageUpload = sc.querySelector('#stage-upload');
          const stageCloud = sc.querySelector('#stage-cloud');
          const cancelBtn = sc.querySelector('#btn-cancel-upload');

          let currentXhr = null;
          let aborted = false;

          cancelBtn.onclick = () => {
            aborted = true;
            if (currentXhr) currentXhr.abort();
            sc.remove();
            toast('Upload cancelled', 'info');
          };

          (async () => {
            try {
              // 1. Request Resumable Upload URL from GAS
              const initRes = await api('initVideoUpload', {
                clientName: cObj.name,
                branch,
                album,
                filename: file.name,
                mimeType: file.type || 'video/mp4',
                fileSize: file.size,
                origin: window.location.origin
              });

              if (!initRes || !initRes.success || !initRes.uploadUrl) {
                // If the user has not deployed the updated gas/Code.gs yet (returns 'Invalid action'),
                // automatically fallback to standard direct upload for smaller videos <= 20MB
                if (initRes && initRes.error === 'Invalid action' && file.size <= 20 * 1024 * 1024) {
                  liveSpeed.textContent = 'Using direct video stream...';
                  const base64Data = await new Promise((res, rej) => {
                    const reader = new FileReader();
                    reader.onload = () => res(reader.result);
                    reader.onerror = () => rej(new Error('Failed to read video file'));
                    reader.readAsDataURL(file);
                  });

                  if (aborted) return;
                  const fallbackRes = await apiWithProgress('uploadVideo', {
                    clientName: cObj.name,
                    clientId,
                    branch,
                    album,
                    title,
                    year,
                    month,
                    date,
                    dur,
                    coverUrl,
                    base64Data,
                    filename: file.name,
                    mimeType: file.type || 'video/mp4'
                  }, prog => {
                    if (aborted) return;
                    liveBar.style.width = prog.percent + '%';
                    livePct.textContent = prog.percent + '%';
                    const loadedMB = (prog.loaded / (1024 * 1024)).toFixed(1);
                    const totalMB = (prog.total / (1024 * 1024)).toFixed(1);
                    liveBytes.textContent = `${loadedMB} MB of ${totalMB} MB transferred`;
                  });

                  if (!fallbackRes || !fallbackRes.success) {
                    throw new Error((fallbackRes && fallbackRes.error) || 'Upload failed');
                  }

                  const publishedReel = fallbackRes.reel || {
                    id: 'r' + Date.now().toString(36),
                    c: clientId,
                    type: 'reel',
                    y: year,
                    m: month,
                    b: branch,
                    album,
                    title,
                    date,
                    url: fallbackRes.viewUrl || `https://drive.google.com/file/d/${fallbackRes.fileId}/view`,
                    fileId: fallbackRes.fileId,
                    dur,
                    coverUrl,
                    hidden: false,
                    status,
                    views: 0,
                    downloads: 0,
                    sample: false,
                    thumbnailGenerated: true
                  };

                  liveBar.style.width = '100%';
                  livePct.textContent = '100%';
                  stageCloud.className = 'live-stage-item done';
                  sc.querySelector('#stage-cloud-icon').innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
                  liveSpeed.textContent = 'Published successfully!';

                  if (!DATA.reels) DATA.reels = [];
                  DATA.reels.unshift(publishedReel);
                  saveAndBroadcast('Video published to Google Drive!');
                  setTimeout(() => sc.remove(), 600);
                  return;
                }

                if (initRes && initRes.error === 'Invalid action') {
                  throw new Error('This video is ' + (file.size / (1024 * 1024)).toFixed(1) + ' MB. Direct Google Drive streaming requires deploying the updated Code.gs in script.google.com (tab 5). Please update your Apps Script deployment.');
                }

                throw new Error((initRes && initRes.error) || 'Could not initialize resumable Drive session');
              }

              if (aborted) return;

              // 2. Stream raw binary File directly to Google Drive (Zero Base64 / Zero RAM limit)
              const startTime = Date.now();
              const driveFileJson = await new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                currentXhr = xhr;
                xhr.open('PUT', initRes.uploadUrl, true);
                xhr.setRequestHeader('Content-Type', file.type || 'video/mp4');

                xhr.upload.onprogress = e => {
                  if (aborted || !e.lengthComputable) return;
                  const pct = Math.min(99, Math.round((e.loaded / e.total) * 100));
                  liveBar.style.width = pct + '%';
                  livePct.textContent = pct + '%';

                  const loadedMB = (e.loaded / (1024 * 1024)).toFixed(1);
                  const totalMB = (e.total / (1024 * 1024)).toFixed(1);
                  liveBytes.textContent = `${loadedMB} MB of ${totalMB} MB transferred`;

                  const elapsedSec = (Date.now() - startTime) / 1000;
                  if (elapsedSec > 0.5 && e.loaded > 0) {
                    const speed = (e.loaded / (1024 * 1024) / elapsedSec).toFixed(1);
                    const remBytes = e.total - e.loaded;
                    const remSec = Math.max(1, Math.round(remBytes / (e.loaded / elapsedSec)));
                    const remMin = remSec >= 60 ? `${Math.floor(remSec / 60)}m ${remSec % 60}s` : `${remSec}s`;
                    liveSpeed.textContent = `${speed} MB/s · ${remMin} remaining`;
                  }
                };

                xhr.onload = () => {
                  if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                      resolve(JSON.parse(xhr.responseText));
                    } catch (err) {
                      reject(new Error('Invalid response from Google Drive upload'));
                    }
                  } else {
                    reject(new Error(`Google Drive upload returned HTTP ${xhr.status}`));
                  }
                };

                xhr.onerror = () => reject(new Error('Network error during direct Google Drive stream'));
                xhr.onabort = () => reject(new Error('Upload cancelled'));
                xhr.send(file);
              });

              if (aborted) return;

              // 3. Finalize permissions & save metadata via GAS
              stageUpload.className = 'live-stage-item done';
              sc.querySelector('#stage-upload-icon').innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
              stageCloud.className = 'live-stage-item active';
              sc.querySelector('#stage-cloud-icon').textContent = '→';
              liveSpeed.textContent = 'Finalizing Google Drive permissions...';

              const reelId = 'r' + Date.now().toString(36);
              const fileId = driveFileJson.id;
              const finalCover = coverUrl || `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;

              const finRes = await api('finalizeVideoUpload', {
                id: reelId,
                fileId,
                clientId,
                clientName: cObj.name,
                branch,
                album,
                title,
                year,
                month,
                date,
                dur,
                coverUrl: finalCover,
                status
              });

              const publishedReel = (finRes && finRes.reel) || {
                id: reelId,
                c: clientId,
                type: 'reel',
                y: year,
                m: month,
                b: branch,
                album,
                title,
                date,
                url: `https://drive.google.com/file/d/${fileId}/view`,
                fileId,
                dur,
                coverUrl: finalCover,
                hidden: false,
                status,
                views: 0,
                downloads: 0,
                sample: false,
                thumbnailGenerated: true
              };

              liveBar.style.width = '100%';
              livePct.textContent = '100%';
              stageCloud.className = 'live-stage-item done';
              sc.querySelector('#stage-cloud-icon').innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
              liveSpeed.textContent = 'Published successfully!';

              if (!DATA.reels) DATA.reels = [];
              DATA.reels.unshift(publishedReel);
              saveAndBroadcast('Video published to Google Drive!');
              setTimeout(() => sc.remove(), 600);
            } catch (err) {
              if (aborted) return;
              toast('Upload failed: ' + (err.message || 'Check GAS deployment'), 'error');
              setTimeout(() => sc.remove(), 1200);

        const searchInput = sc.querySelector('#drive-filter-search');
        const quickInput = sc.querySelector('#quick-drive-link');
        const quickBtn = sc.querySelector('#btn-quick-enable-drive');

        async function runScan() {
          const cid = clientSel.value;
          const cObj = (DATA.clients || []).find(c => c.id === cid);
          if (!cObj) return;

          statusEl.textContent = 'Client Folder: Day Night Media Portal / ' + cObj.name;
          listEl.innerHTML = `
            <div style="text-align:center;padding:40px;color:var(--navy);">
              <div class="sync-icon" style="display:inline-block;animation:spin 0.8s linear infinite;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></div>
              <p style="margin:10px 0 0;font-size:13px;font-weight:600;">Scanning Google Drive folder for "${cObj.name}"...</p>
              <small style="color:var(--mute);font-size:11px;">Inspecting master folder & branch subfolders for MP4 files</small>
            </div>`;

          try {
            const res = await api('scanDriveVideos', { clientName: cObj.name });
            if (res && res.success && Array.isArray(res.videos)) {
              currentScannedVideos = res.videos;
              renderScannedList();
            } else {
              listEl.innerHTML = `
                <div style="text-align:center;padding:30px;color:var(--mute);font-size:12px;background:var(--soft);border-radius:12px;">
                  ${(res && res.error) || 'No video files found yet in Drive folder.'}<br><br>
                  Upload MP4 files directly into Google Drive folder <b>"${cObj.name}"</b>, then click Scan!
                </div>`;
            }
          } catch(err) {
            listEl.innerHTML = `
              <div style="text-align:center;padding:24px;color:var(--red);font-size:12px;background:#FEE2E2;border-radius:12px;">
                Scan note: ${err.message || 'Drive API offline'}. You can still paste any Drive video link above to enable it instantly!
              </div>`;
          }
        }

        function renderScannedList() {
          const q = (searchInput.value || '').toLowerCase().trim();
          const cid = clientSel.value;
          const cObj = (DATA.clients || []).find(c => c.id === cid);

          let filtered = currentScannedVideos.filter(v => {
            if (!q) return true;
            return (v.title || '').toLowerCase().includes(q) || (v.name || '').toLowerCase().includes(q) || (v.folder || '').toLowerCase().includes(q);
          });

          if (!filtered.length) {
            listEl.innerHTML = `
              <div style="text-align:center;padding:30px;color:var(--mute);font-size:12px;background:var(--soft);border-radius:12px;">
                No videos found matching "${q}".
              </div>`;
            return;
          }

          listEl.innerHTML = filtered.map(v => {
            const matchedReel = (DATA.reels || []).find(r => (r.fileId === v.fileId || (r.url && r.url.includes(v.fileId))));
            const isLive = matchedReel && matchedReel.hidden !== true;

            return `
              <div style="display:flex;gap:12px;align-items:center;padding:12px;background:#FFFFFF;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px rgba(18,41,74,0.04);">
                <div style="width:64px;height:88px;border-radius:8px;overflow:hidden;background:#000;flex-shrink:0;position:relative;">
                  <img src="${v.thumbUrl}" style="width:100%;height:100%;object-fit:cover;" onerror="this.src='/Logo/logo.png'">
                  <span style="position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,0.7);color:#fff;font-size:9px;font-weight:700;padding:1px 4px;border-radius:4px;">${v.sizeMB} MB</span>

                <div style="flex:1;min-width:0;">
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                    <h4 style="margin:0;font-size:13px;font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px;">${v.title}</h4>
                    ${v.folder ? `<span style="font-size:10px;background:var(--soft);padding:2px 6px;border-radius:4px;color:var(--mute);"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg> ${v.folder}</span>` : ''}
                  </div>
                  <p style="margin:4px 0 0;font-size:11px;color:var(--mute);">
                    Date: ${v.dateCreated || 'Recent'} &middot; <a href="${v.viewUrl}" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:none;">Open in Drive ↗</a>
                  </p>
                  <div style="margin-top:6px;display:flex;align-items:center;gap:8px;">
                    ${isLive ? `
                      <span class="badge-status approved" style="font-size:10px;padding:3px 8px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Live on Website</span>
                      <button class="btn-portal" data-toggle-reel="${matchedReel.id}" style="padding:4px 8px;font-size:11px;">Hide from Client</button>
                    ` : `
                      <span class="badge-status draft" style="font-size:10px;padding:3px 8px;">Not on Website</span>
                      <button class="btn-primary" data-enable-vid="${v.fileId}" style="background:linear-gradient(135deg, #1FAF64, #17A598);border-color:#1FAF64;font-size:11px;padding:5px 12px;font-weight:700;">
                        + Enable on Website for Client
                      </button>
                    `}
                  </div>
                </div>
              </div>`;
          }).join('');

          // Bind enable buttons
          listEl.querySelectorAll('[data-enable-vid]').forEach(btn => {
            btn.onclick = () => {
              const fid = btn.dataset.enableVid;
              const v = currentScannedVideos.find(x => x.fileId === fid);
              if (!v) return;

              const existingIdx = (DATA.reels || []).findIndex(r => r.fileId === fid || (r.url && r.url.includes(fid)));
              if (existingIdx !== -1) {
                DATA.reels[existingIdx].hidden = false;
                DATA.reels[existingIdx].status = 'approved';
              } else {
                const newReel = {
                  id: 'r' + Date.now().toString(36),
                  c: cObj.id,
                  y: new Date().getFullYear(),
                  m: new Date().getMonth(),
                  b: v.folder || '',
                  album: v.folder || 'General',
                  title: v.title,
                  date: v.dateCreated || new Date().toISOString().slice(0, 10),
                  url: v.viewUrl,
                  fileId: v.fileId,
                  dur: '',
                  coverUrl: v.thumbUrl,
                  hidden: false,
                  status: 'approved',
                  views: 0,
                  downloads: 0
                };
                if (!DATA.reels) DATA.reels = [];
                DATA.reels.unshift(newReel);
                try { api('addReel', { reel: newReel }); } catch(e) {}
              }

              saveAndBroadcast(`"${v.title}" is now LIVE on ${cObj.name}'s website!`);
              toast(`"${v.title}" enabled on website!`, 'success');
              renderScannedList();
              renderReels();
            };
          });

          // Bind hide buttons
          listEl.querySelectorAll('[data-toggle-reel]').forEach(btn => {
            btn.onclick = () => {
              const rid = btn.dataset.toggleReel;
              const r = (DATA.reels || []).find(x => x.id === rid);
              if (r) {
                r.hidden = true;
                saveAndBroadcast(`"${r.title}" hidden from website`);
                toast('Reel hidden from client', 'info');
                try { api('toggleHideReel', { id: r.id }); } catch(e) {}
                renderScannedList();
                renderReels();
              }
            };
          });
        }

        // Quick Enable Handler
        quickBtn.onclick = () => {
          const val = quickInput.value.trim();
          if (!val) { toast('Please paste a Google Drive video link', 'error'); return; }

          const m = val.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || val.match(/[?&]id=([a-zA-Z0-9_-]+)/);
          const fileId = m ? m[1] : '';
          if (!fileId) { toast('Could not find Google Drive file ID in link', 'error'); return; }

          const cid = clientSel.value;
          const cObj = (DATA.clients || []).find(c => c.id === cid) || { name: 'Client' };
          const driveThumb = 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w1000';
          const defaultTitle = 'Drive Reel ' + new Date().toISOString().slice(5, 10);

          const existingIdx = (DATA.reels || []).findIndex(r => r.fileId === fileId || (r.url && r.url.includes(fileId)));
          if (existingIdx !== -1) {
            DATA.reels[existingIdx].hidden = false;
            DATA.reels[existingIdx].status = 'approved';
          } else {
            const newReel = {
              id: 'r' + Date.now().toString(36),
              c: cObj.id,
              y: new Date().getFullYear(),
              m: new Date().getMonth(),
              b: '',
              album: 'General',
              title: defaultTitle,
              date: new Date().toISOString().slice(0, 10),
              url: val,
              fileId: fileId,
              dur: '',
              coverUrl: driveThumb,
              hidden: false,
              status: 'approved',
              views: 0,
              downloads: 0
            };
            if (!DATA.reels) DATA.reels = [];
            DATA.reels.unshift(newReel);
            try { api('addReel', { reel: newReel }); } catch(e) {}
          }

          saveAndBroadcast(`Video enabled on ${cObj.name}'s website!`);
          toast(`Video is now live on ${cObj.name} website!`, 'success');
          quickInput.value = '';
          renderScannedList();
          renderReels();
        };

        scanBtn.onclick = runScan;
        clientSel.onchange = runScan;
        searchInput.oninput = renderScannedList;

        // Auto run scan on open
        runScan();
      });
    }

        const editThumbImg = sc.querySelector('#edit-thumb-preview-img');
        const editThumbStatus = sc.querySelector('#edit-thumb-status');
        const editThumbNote = sc.querySelector('#edit-thumb-note');

        if (btnEditPickThumb && eCoverFileInput) {
          btnEditPickThumb.onclick = () => eCoverFileInput.click();
          eCoverFileInput.onchange = e => {
            const f = e.target.files[0];
            if (!f) return;
            const reader = new FileReader();
            reader.onload = () => {
              const img = new Image();
              img.onload = () => {
                const maxDim = 1200;
                let w = img.width, h = img.height;
                if (w > maxDim || h > maxDim) {
                  if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                  else { w = Math.round((w * maxDim) / h); h = maxDim; }
                }
                const canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.88);
                eCoverInput.value = dataUrl;
                editThumbImg.src = dataUrl;
                editThumbBox.style.display = 'flex';
                editThumbStatus.textContent = 'Custom Thumbnail Loaded (' + f.name + ')';
                editThumbStatus.style.color = 'var(--green)';
                editThumbNote.textContent = `${w}×${h} · Click "Save Changes" to apply`;
                toast('Custom thumbnail loaded! Click Save Changes to apply.', 'info');
              };
              img.src = reader.result;
            };
            reader.readAsDataURL(f);
          };
        }

        sc.querySelector('#e-save').onclick = async () => {
          r.title = sc.querySelector('#e-title').value.trim();
          r.url = sc.querySelector('#e-url').value.trim();
          r.coverUrl = sc.querySelector('#e-cover').value.trim();
          r.b = sc.querySelector('#e-branch').value.trim();
          r.album = sc.querySelector('#e-album').value.trim();
          const selectedWave = sc.querySelector('#e-wave').value;
          r.wave = selectedWave;
          r.phase = selectedWave;
          r.dur = sc.querySelector('#e-dur').value.trim();
          r.views = parseInt(sc.querySelector('#e-views').value, 10) || 0;
          r.date = sc.querySelector('#e-date').value;
          r.y = Number(r.date.slice(0, 4)) || r.y;
          r.m = (Number(r.date.slice(5, 7)) - 1);
          r.status = sc.querySelector('#e-status').value;
          saveAndBroadcast('Reel updated successfully');
          sc.remove();
          try {
            await api('modifyReel', { reel: r });
            toast('Reel synced to Google Drive', 'success');
          } catch(e) {}
        };
      });
    }

        fileInput.onchange = async e => {

          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {

            img.onload = () => {
              const maxDim = 1200;
              let w = img.width, h = img.height;
              if (w > maxDim || h > maxDim) {

          const code = sc.querySelector('#cl-code').value.trim();
          const status = sc.querySelector('#cl-status').value;
          const dlPaused = !!sc.querySelector('#cl-pause-dl').checked;
          const sharePaused = !!sc.querySelector('#cl-pause-share').checked;
          const branches = sc.querySelector('#cl-branches').value.split(',').map(x => x.trim()).filter(Boolean);
          const albums = sc.querySelector('#cl-albums').value.split(',').map(x => x.trim()).filter(Boolean);
          const wavesInp = sc.querySelector('#cl-waves')?.value.trim();
          const waves = wavesInp ? wavesInp.split(',').map(x => x.trim()).filter(Boolean) : ['Phase 1', 'Phase 2', 'Phase 3'];
          const animStyle = sc.querySelector('#cl-anim').value;
          const tagline = sc.querySelector('#cl-tag').value.trim();
          const accent = sc.querySelector('#cl-accent').value.trim();

          if (!name) { toast('Client name is required', 'error'); return; }
          if (!code || !/^\d{4}$/.test(code)) { toast('Client must have an exact 4-digit numeric code (e.g. 4821)', 'error'); return; }

          const rec = Object.assign({}, client, {
            id: client.id || ('c' + Date.now().toString(36)),
            name, slug: slug || name.toLowerCase().replace(/[^a-z0-9]/g, ''),
            code, status, downloadsPaused: dlPaused, sharesPaused: sharePaused,
            branches, albums, waves, animStyle, tagline, accent,
            logo: logoData,
            banner: bannerData,
            coverUrl: bannerData
          });

          if (!DATA.clients) DATA.clients = [];
          const idx = DATA.clients.findIndex(c => c.id === rec.id);
          if (idx >= 0) {
            DATA.clients[idx] = rec;
          } else {
            DATA.clients.push(rec);
          }

          saveAndBroadcast('Client profile saved!');
          sc.remove();
          try {
            await api('saveClient', { client: rec });
            toast('Client synced to Google Drive!', 'success');
          } catch(e) {}
        };
      });

    // DIRECT DOWNLOAD HELPER (Forces native download, never opens Google Drive)
    function triggerDirectDownload(r) {
      if (!r || !r.url) {
        toast('Sample reel layout. Download available when real file is uploaded.', 'amber');
        return;
      }
      const id = driveId(r.url);
      const cleanTitle = (r.title || 'video').replace(/[/\\?%*:|"<>]/g, '_').trim() || 'video';
      const filename = cleanTitle.toLowerCase().endsWith('.mp4') ? cleanTitle : `${cleanTitle}.mp4`;

      toast('Downloading video...', 'info');

      const dlEndpoint = id
        ? `/api/download?id=${encodeURIComponent(id)}&name=${encodeURIComponent(filename)}`
        : `/api/download?url=${encodeURIComponent(r.url)}&name=${encodeURIComponent(filename)}`;

      const a = document.createElement('a');
      a.href = dlEndpoint;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => a.remove(), 1000);
    }

                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>
                </svg>
              </button>
              
              <button class="btn-portal" data-close style="border-radius:999px;padding:4px 14px;">Close</button>

              <!-- Settings Dropdown Menu (Theme Styled) -->
              <div class="video-gear-menu" id="adm-gear-menu">
                <!-- Status Controls -->
                <div class="v-menu-sec">
                  <div class="v-menu-label">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    Client Approval
                  </div>
                  <div id="adm-status-indicator" class="v-status-badge ${r.status === 'approved' ? 'approved' : 'review'}">
                    <span class="v-status-dot"></span>
                    <span id="adm-status-text">${r.status === 'approved' ? 'Approved by Client' : 'In Review / Pending'}</span>
                  </div>
                  <div class="v-approval-actions">
                    <button type="button" class="v-act-btn approve-btn ${r.status === 'approved' ? 'active' : ''}" id="adm-btn-approve">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><polyline points="20 6 9 17 4 12"/></svg>
                      Approve
                    </button>
                    <button type="button" class="v-act-btn reject-btn ${r.status !== 'approved' ? 'active' : ''}" id="adm-btn-reject">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                      Needs Edit
                    </button>
                  </div>
                </div>

                <!-- Quality -->
                <div class="v-menu-sec">
                  <div class="v-menu-label">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                    Stream Quality
                  </div>
                  <div class="v-quality-pill">
                    <div style="display:flex;align-items:center;gap:6px;">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2.4"><rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>
                      <span style="font-weight:600;font-size:12px;color:var(--navy);">1080p Master (HD)</span>
                    </div>
                    <span class="v-quality-active">ACTIVE</span>
                  </div>
                </div>

                <!-- Speed -->
                <div class="v-menu-sec">
                  <div class="v-menu-label">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    Playback Speed
                  </div>
                  <div class="v-speed-grid">
                    <button type="button" class="adm-speed-btn" data-speed="0.5">0.5x</button>
                    <button type="button" class="adm-speed-btn" data-speed="0.75">0.75x</button>
                    <button type="button" class="adm-speed-btn active" data-speed="1.0">1.0x</button>
                    <button type="button" class="adm-speed-btn" data-speed="1.25">1.25x</button>
                    <button type="button" class="adm-speed-btn" data-speed="1.5">1.5x</button>
                  </div>
                </div>

                <!-- Repeat Loop -->
                <div class="v-menu-sec">
                  <div class="v-menu-label">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                    Repeat Loop
                  </div>
                  <button type="button" id="adm-loop-btn" class="v-loop-toggle">
                    <span>Loop Video</span>
                    <span id="adm-loop-status" class="v-loop-val">Off</span>
                  </button>
                </div>

                <!-- Technical Specs -->
                <div class="v-menu-sec" style="margin-bottom:0;border-bottom:none;padding-bottom:0;">
                  <div class="v-menu-label">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                    Technical Specs
                  </div>
                  <div class="v-specs-list">
                    <div class="v-spec-item"><span>Format</span><b id="adm-spec-fmt">MP4 Video</b></div>
                    <div class="v-spec-item"><span>Resolution</span><b id="adm-spec-res">Loading...</b></div>
                    <div class="v-spec-item"><span>Branch</span><b>${esc(r.b || r.album || 'General')}</b></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="video-viewport">
            <video id="admin-native-vid" src="${streamSrc}" controls autoplay playsinline preload="auto" poster="${r.coverUrl || ''}"></video>
          </div>

          <div style="display:flex;gap:10px;width:100%;">
            <button class="btn-primary" id="admin-btn-dl" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 4v11m-5-5l5 5 5-5M5 20h14"/></svg>
              Download
            </button>
            ${id ? `<a class="btn-portal" href="https://drive.google.com/file/d/${id}/view" target="_blank" rel="noopener" style="text-align:center;padding:10px 14px;border-radius:10px;">Google Drive ↗</a>` : ''}
          </div>

          <!-- Client Feedback & Comments inside Admin Video Modal -->
          <div class="admin-modal-feedback-box" style="margin-top:14px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
              <b style="font-size:12.5px;color:var(--navy);display:flex;align-items:center;gap:6px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2F7DF6" stroke-width="2.2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                Client Feedback &amp; Suggestions (${(r.comments || []).length})
              </b>
              <span class="v-status-badge ${r.status === 'approved' ? 'approved' : 'review'}" style="font-size:10px;padding:2px 8px;">
                ${r.status === 'approved' ? '<span style="display:inline-flex;align-items:center;gap:4px;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Approved</span>' : '<span style="display:inline-flex;align-items:center;gap:4px;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>In Review</span>'}
              </span>
            </div>
            <div id="adm-modal-comments-list" style="max-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:8px;">
              ${(r.comments && r.comments.length) ? r.comments.map(c => `
                <div style="background:#FFFFFF;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11.5px;">
                  <span style="font-weight:700;color:var(--navy);">${esc(c.author)}:</span> ${esc(c.text)}
                  <small style="float:right;color:var(--mute);">${c.dateStr || ''}</small>
                </div>
              `).join('') : '<p style="font-size:11px;color:var(--mute);margin:4px 0;">No written comments submitted for this reel yet.</p>'}
            </div>
            <div style="display:flex;gap:6px;">
              <input type="text" id="adm-modal-reply-inp" placeholder="Reply to client..." style="flex:1;min-width:0;background:#FFF;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;outline:none;">
              <button type="button" id="adm-modal-reply-btn" style="background:#2F7DF6;color:#FFF;border:none;border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;">Send</button>
            </div>
          </div>

        </div>`, mSc => {
        mSc.querySelector('#admin-btn-dl').onclick = () => triggerDirectDownload(r);

        const vid = mSc.querySelector('#admin-native-vid');
        const gearBtn = mSc.querySelector('#adm-gear-btn');
        const gearMenu = mSc.querySelector('#adm-gear-menu');
        const loopBtn = mSc.querySelector('#adm-loop-btn');
        const loopStatus = mSc.querySelector('#adm-loop-status');
        const speedBtns = mSc.querySelectorAll('.adm-speed-btn');
        const btnApprove = mSc.querySelector('#adm-btn-approve');
        const btnReject = mSc.querySelector('#adm-btn-reject');
        const statusBadge = mSc.querySelector('#adm-status-indicator');
        const statusText = mSc.querySelector('#adm-status-text');

        if (gearBtn && gearMenu) {
          gearBtn.addEventListener('click', e => {
            e.stopPropagation();
            const isOpen = gearMenu.style.display === 'block';
            gearMenu.style.display = isOpen ? 'none' : 'block';
            gearBtn.classList.toggle('active', !isOpen);
          });

          mSc.addEventListener('click', e => {
            if (!gearMenu.contains(e.target) && e.target !== gearBtn) {
              gearMenu.style.display = 'none';
              gearBtn.classList.remove('active');
            }
          });
        }

        function updateStatusUi(newStatus) {
          r.status = newStatus;
          if (statusBadge && statusText) {
            if (newStatus === 'approved') {
              statusBadge.className = 'v-status-badge approved';
              statusText.textContent = 'Approved by Client';
              btnApprove?.classList.add('active');
              btnReject?.classList.remove('active');
            } else {
              statusBadge.className = 'v-status-badge review';
              statusText.textContent = 'In Review / Pending';
              btnReject?.classList.add('active');
              btnApprove?.classList.remove('active');
            }
          }
          if (typeof renderReels === 'function') renderReels();
        }

        if (vid) {
          vid.addEventListener('loadedmetadata', () => {
            const resEl = mSc.querySelector('#adm-spec-res');
            if (resEl && vid.videoWidth && vid.videoHeight) {
              resEl.textContent = `${vid.videoWidth} × ${vid.videoHeight}`;
            }
          });
        }

        if (btnApprove) {
          btnApprove.addEventListener('click', async () => {
            updateStatusUi('approved');
            saveAndBroadcast('Reel marked as Approved');
            if (GAS_URL) {
              try {
                await api('updateReelStatus', { id: r.id, reelId: r.id, status: 'approved' });
              } catch (err) {
                console.warn('Status sync notice:', err);
                api('syncData', { data: DATA }).catch(() => {});
              }
            }
          });
        }

        if (btnReject) {
          btnReject.addEventListener('click', async () => {
            updateStatusUi('denied');
            saveAndBroadcast('Reel marked as Denied / Edits Requested');
            toast('Reel marked for review / edits', 'amber');
            if (GAS_URL) {
              try {
                await api('updateReelStatus', { id: r.id, reelId: r.id, status: 'denied' });
              } catch (err) {
                console.warn('Status sync notice:', err);
                api('syncData', { data: DATA }).catch(() => {});
              }
            }
          });
        }

        if (vid && loopBtn && loopStatus) {
          loopBtn.addEventListener('click', () => {
            vid.loop = !vid.loop;
            loopStatus.textContent = vid.loop ? 'On' : 'Off';
            loopStatus.style.color = vid.loop ? 'var(--green)' : 'var(--mute)';
          });
        }

        if (vid && speedBtns) {
          speedBtns.forEach(btn => {
            btn.addEventListener('click', () => {
              const speed = parseFloat(btn.dataset.speed) || 1.0;
              vid.playbackRate = speed;
              speedBtns.forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
            });
          });
        }

        // Real-Time Admin Reply Sender
        const replyInp = mSc.querySelector('#adm-modal-reply-inp');
        const replyBtn = mSc.querySelector('#adm-modal-reply-btn');
        const commentsList = mSc.querySelector('#adm-modal-comments-list');
        function doModalReply() {
          if (!replyInp || !replyInp.value.trim()) return;
          const text = replyInp.value.trim();
          r.comments = r.comments || [];
          const newComm = {
            id: 'c_' + Date.now(),
            text: text,
            author: 'Day Night Media (Admin)',
            authorRole: 'admin',
            time: Date.now(),
            dateStr: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };
          r.comments.push(newComm);
          DATA._updatedAt = Date.now();
          
          try { if (syncHub) syncHub.postMessage({ type: 'DATA_MUTATED', data: DATA, time: DATA._updatedAt }); } catch(e) {}
          toast('Reply sent to client in real time!', 'success');
          if (GAS_URL) {
            api('modifyReel', { reel: r }).catch(() => {});
          }
          if (commentsList) {
            const pEmpty = commentsList.querySelector('p');
            if (pEmpty) pEmpty.remove();
            const div = document.createElement('div');
            div.style.cssText = 'background:#FFFFFF;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11.5px;';
            div.innerHTML = `<span style="font-weight:700;color:var(--navy);">${esc(newComm.author)}:</span> ${esc(newComm.text)}<small style="float:right;color:var(--mute);">${newComm.dateStr || ''}</small>`;
            commentsList.appendChild(div);
          }
          replyInp.value = '';
          if (typeof renderReels === 'function') renderReels();
        }
        if (replyBtn) replyBtn.onclick = doModalReply;
        if (replyInp) {
          replyInp.onkeydown = e => {
            if (e.key === 'Enter') {
              e.preventDefault();
              doModalReply();
            }
          };
        }
      });
    }

        // Header Actions
    document.getElementById('btn-manual-sync').onclick = () => sync(true);
    document.getElementById('btn-lock-admin').onclick = () => {
      sessionStorage.removeItem('dn_admin_auth');
      isAuthenticated = false;
      render();
      toast('Admin session locked', 'info');
    };

    // Sidebar Tab Switching
    document.querySelectorAll('.nav-item').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        activeTab = b.dataset.tab;
        render();
      };
    });

    // Initial Load & Auto Poll
    render();
    if (isAuthenticated) {
      sync(false);
    }
    // Auto poll removed to prevent re-rendering over user forms and eliminate network lag.
    // User can manually sync anytime via the "Sync Cloud" header button.

  })();
  </script>
</body>
</html>
