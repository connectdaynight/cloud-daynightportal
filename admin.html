  <meta name="twitter:title" content="Admin Dashboard | DAY NIGHT">
  <meta name="twitter:description" content="Day Night Media - Executive Control &amp; Client Delivery Management">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&display=swap">
  <style>
    /* ==========================================================================
       DAY NIGHT MEDIA - FULL PAGE ADMIN DASHBOARD SYSTEM
       Theme: Preserved signature milk-white luxury palette with desktop-grade layout
       ========================================================================== */
    :root {
      --bg: #FFFDF8;
      --card: #FFFFFF;
      --line: #EEE8DD;
      --soft: #F7F3EC;
      --ink: #1D2433;
      --navy: #12294A;
      --mute: #7A7468;
      --gold: #B8935A;
      --red: #E53225;
      --rose: #E8457A;
      --teal: #17A598;
      --amber: #F2992E;
      --violet: #6C5CE7;
      --blue: #2F7DF6;
      --green: #16884D;
      --f: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --serif: 'Cormorant Garamond', Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--f);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    /* Top Navigation Header */
    .admin-header {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 2px 12px rgba(29, 36, 51, 0.03);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--red);
      display: grid;
      place-items: center;
      box-shadow: 0 4px 12px rgba(229, 50, 37, 0.25);
    }
    .brand-mark svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2.2; }

    .brand-title b {
      display: block;
      font-size: 17px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.01em;
    }
    .brand-title span {
      display: block;
      font-size: 11px;
      color: var(--mute);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--soft);
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
    }
    .status-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status-dot.offline { background: var(--red); }

    .btn-portal {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      font-size: 12px;
      font-weight: 600;
      color: var(--navy);
      transition: all 0.15s ease;
    }
    .btn-portal:hover { border-color: var(--navy); background: var(--soft); }

    /* Main Layout */
    .admin-layout {
      display: flex;
      flex: 1;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 28px;
      gap: 28px;
    }

    /* Sidebar Navigation */
    .admin-sidebar {
      width: 240px;
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--mute);
      border: 1px solid transparent;
      background: none;
      text-align: left;
      width: 100%;
      transition: all 0.15s ease;
    }
    .nav-item:hover { color: var(--navy); background: var(--soft); }
    .nav-item.active {
      color: var(--navy);
      background: var(--card);
      border-color: var(--line);
      box-shadow: 0 4px 14px rgba(29, 36, 51, 0.04);
    }
    .nav-item .icon { width: 20px; height: 20px; display: grid; place-items: center; flex: none; }
    .nav-item .icon svg { width: 18px; height: 18px; stroke: currentColor; }

    /* Content Area */
    .admin-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Stats Overview Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(29, 36, 51, 0.03);
    }
    .stat-card small { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--mute); letter-spacing: 0.05em; }
    .stat-card b { font-size: 28px; font-weight: 700; color: var(--navy); line-height: 1.1; }
    .stat-card span { font-size: 11px; color: var(--green); font-weight: 500; }

    /* Action Bar */
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .action-bar h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
    }
    .action-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-input {
      padding: 10px 16px;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      font-size: 13px;
      width: 240px;
      outline: none;
    }
    .search-input:focus { border-color: var(--navy); }

    .btn-primary {
      background: var(--navy);
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(18, 41, 74, 0.18);
      transition: all 0.15s ease;
    }
    .btn-primary:hover { background: #1C3A63; }

    /* Reels Grid Desktop */
    .reels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    .reel-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(29, 36, 51, 0.04);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .reel-box:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(29, 36, 51, 0.08);
    }

    .reel-thumb-wrap {
      aspect-ratio: 9/16;
      border-radius: 14px;
      background: radial-gradient(120% 80% at 50% 30%, #B8935A 0%, #12294A 100%);
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: #fff;
      cursor: pointer;
    }
    .reel-thumb-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .reel-thumb-wrap .dur {
      position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.45);
      padding: 2px 6px; border-radius: 999px; font-size: 9px; font-weight: 600;
    }
    .reel-thumb-wrap .play-badge {
      width: 44px; height: 44px; border-radius: 50%; background: #fff; color: var(--navy);
      display: grid; place-items: center; box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }
    .reel-thumb-wrap .zari {
      position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
      background: repeating-linear-gradient(90deg, #E9C77B 0 6px, #B8935A 6px 9px, #F6E3B4 9px 12px);
    }

    .reel-details h4 {
      font-size: 13px; font-weight: 600; color: var(--navy); line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .reel-details p {
      font-size: 11px; color: var(--mute); margin-top: 2px;
    }
    .reel-meta-row {
      display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--mute);
    }

    .badge-status {
      font-size: 9px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 6px;
    }
    .badge-status.approved { background: rgba(22, 136, 77, 0.12); color: var(--green); }
    .badge-status.review { background: rgba(242, 153, 46, 0.15); color: var(--amber); }
    .badge-status.draft { background: rgba(122, 116, 104, 0.15); color: var(--mute); }
    .badge-status.hidden { background: rgba(229, 50, 37, 0.12); color: var(--red); }

    .reel-box-actions {
      display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-top: 4px; border-top: 1px solid var(--line);
    }
    .reel-box-actions button {
      border: 0; background: none; font-size: 11px; font-weight: 600; padding: 4px 6px; border-radius: 6px;
    }
    .reel-box-actions button:hover { background: var(--soft); }
    .action-edit { color: var(--blue); }
    .action-hide { color: var(--amber); }
    .action-delete { color: var(--red); }

    /* Client Cards Grid */
    .clients-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }

    .client-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 4px 16px rgba(29, 36, 51, 0.03);
    }

    .client-card-head {
      display: flex; align-items: center; gap: 14px;
    }
    .client-logo-box {
      width: 70px; height: 42px; border-radius: 12px; border: 1px solid var(--line);
      display: grid; place-items: center; padding: 6px; background: #fff; flex: none;
    }
    .client-logo-box img { max-width: 100%; max-height: 100%; }

    .client-info h3 { font-size: 16px; font-weight: 700; color: var(--navy); }
    .client-info p { font-size: 11px; color: var(--mute); }

    .client-url-box {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 11px;
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: space-between;
      word-break: break-all;
    }
    .client-url-box button {
      border: 0; background: none; color: var(--blue); font-weight: 600; cursor: pointer; flex: none;
    }

    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .tag-pill {
      font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
      background: var(--soft); color: var(--navy); display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--line);
    }
    .tag-pill .tag-del {
      border: 0; background: none; cursor: pointer; color: var(--mute); font-size: 14px; line-height: 1; padding: 0 2px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .tag-pill .tag-del:hover { color: var(--red); }
    .tag-add-btn {
      font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
      background: #fff; color: var(--blue); border: 1px dashed var(--blue); cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px; transition: all 0.15s ease;
    }
    .tag-add-btn:hover { background: #EEF2FF; border-style: solid; }

    /* Modal Sheet Backdrop (Anti-Dismissal protected) */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(29, 36, 51, 0.45); backdrop-filter: blur(4px);
      z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-window {
      background: var(--card); border-radius: 24px; padding: 28px; width: 100%; max-width: 540px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2); max-height: 90vh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 16px; position: relative;
    }
    .modal-window h3 { font-size: 20px; color: var(--navy); font-weight: 700; margin: 0; }

    /* Passkey Lock Screen */
    .lock-screen {
      position: fixed; inset: 0; background: var(--bg); z-index: 9999;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .lock-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 28px;
      padding: 36px 32px; width: 100%; max-width: 420px; text-align: center;
      box-shadow: 0 16px 40px rgba(18, 41, 74, 0.08); display: flex; flex-direction: column; gap: 18px;
    }
    .lock-mark {
      width: 56px; height: 56px; border-radius: 18px; background: var(--navy); color: #fff;
      display: inline-grid; place-items: center; margin: 0 auto; box-shadow: 0 8px 20px rgba(18, 41, 74, 0.25);
    }
    .spinning .sync-icon { animation: spin 0.8s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* Form Fields & Luxury Controls */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 11px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: 0.05em; }
    .form-group input, .form-group select, .form-group textarea {
      padding: 11px 14px; border: 1px solid var(--line); background: var(--bg); border-radius: 12px;
      font-size: 13px; width: 100%; outline: none; transition: border-color 0.2s ease, box-shadow 0.2s ease;
      font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--navy); box-shadow: 0 0 0 3px rgba(18, 41, 74, 0.08);
    }
    .form-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Custom Luxury File Input - Zero Legacy Button */
    input[type="file"] {
      border: 1.5px dashed var(--line) !important;
      background: var(--card) !important;
      border-radius: 14px !important;
      padding: 10px 14px !important;
      font-size: 13px !important;
      color: var(--mute) !important;
      cursor: pointer !important;
      transition: all 0.2s ease !important;
      display: block !important;
    }
    input[type="file"]:hover {
      border-color: var(--navy) !important;
      background: var(--soft) !important;
    }
    input[type="file"]::file-selector-button {
      background: var(--navy);
      color: #FFFFFF;
      border: none;
      border-radius: 9px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      margin-right: 14px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 3px 10px rgba(18, 41, 74, 0.2);
      font-family: inherit;
    }
    input[type="file"]::file-selector-button:hover {
      background: #1c3860;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(18, 41, 74, 0.28);
    }
    input[type="file"]::-webkit-file-upload-button {
      background: var(--navy);
      color: #FFFFFF;
      border: none;
      border-radius: 9px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      margin-right: 14px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 3px 10px rgba(18, 41, 74, 0.2);
      font-family: inherit;
    }
    input[type="file"]::-webkit-file-upload-button:hover {
      background: #1c3860;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(18, 41, 74, 0.28);
    }

    select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2312294A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") !important;
      background-repeat: no-repeat !important;
      background-position: right 14px center !important;
      background-size: 14px 14px !important;
      padding-right: 38px !important;
      appearance: none !important;
      -webkit-appearance: none !important;
      cursor: pointer !important;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 0.75;
      transition: opacity 0.2s ease;
    }
    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    /* Floating Toast Alerts */
    .toast-tray {
      position: fixed; top: 20px; right: 28px; z-index: 100; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
    }
    .toast-box {
      padding: 12px 20px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #fff;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18); pointer-events: auto; animation: toastIn 0.3s ease;
    }
    @keyframes toastIn { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
    .toast-box.success { background: var(--green); }
    .toast-box.error { background: var(--red); }
    .toast-box.info { background: var(--navy); }
    .toast-box.amber { background: var(--amber); }

    /* Video Player Modal (Theme Integrated) */
    .video-dialog-wrap {
      display: flex; flex-direction: column; gap: 12px; align-items: center; width: 100%; max-width: 480px;
    }
    .video-viewport {
      width: 100%; max-width: 440px; aspect-ratio: 9/16; max-height: calc(88dvh - 110px);
      border-radius: 20px; overflow: hidden; background: #000;
      box-shadow: 0 14px 36px rgba(18, 41, 74, 0.12); position: relative; margin: 0 auto;
    }
    .video-viewport video {
      width: 100%; height: 100%; object-fit: contain;
      background: #000; border-radius: 20px; border: 0; display: block;
    }

    .video-gear-btn-header {
      background: var(--soft); border: 1px solid var(--line); color: var(--navy); border-radius: 50%;
      width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer;
      box-shadow: 0 2px 8px rgba(18, 41, 74, 0.06); transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); flex: none;
    }
    .video-gear-btn-header:hover, .video-gear-btn-header.active {
      background: var(--card); border-color: var(--navy); color: var(--navy); transform: scale(1.05);
    }

    .video-gear-menu {
      display: none; position: absolute; top: 42px; right: 0; z-index: 100;
      background: #FFFFFF; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px;
      color: var(--navy); width: 275px; max-height: calc(100vh - 120px); overflow-y: auto;
      box-shadow: 0 18px 48px rgba(18, 41, 74, 0.2); animation: popIn 0.2s ease-out;
    }
    .v-menu-sec { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .v-menu-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--mute); display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .v-status-badge { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; margin-bottom: 8px; }
    .v-status-badge.approved { background: rgba(31, 175, 100, 0.12); color: var(--green); border: 1px solid rgba(31, 175, 100, 0.25); }
    .v-status-badge.review { background: rgba(242, 153, 46, 0.12); color: var(--amber); border: 1px solid rgba(242, 153, 46, 0.25); }
    .v-status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .v-approval-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

    .adm-speed-btn { background: var(--soft); border: 1px solid var(--line); color: var(--navy); padding: 6px 0; border-radius: 7px; font-size: 11px; font-weight: 600; cursor: pointer; text-align: center; }
    .adm-speed-btn.active, .adm-speed-btn:hover { background: var(--navy); border-color: var(--navy); color: #FFFFFF; font-weight: 700; }
    .v-loop-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; background: var(--soft); border: 1px solid var(--line); color: var(--navy); padding: 7px 10px; border-radius: 9px; font-size: 11px; font-weight: 600; cursor: pointer; }

    /* Video Thumbnail Generation Preview Box */

    /* Live Upload Progress Panel */
    .live-upload-box {

    /* Portal Controls & Social Styling */
    .ctrl-preset-btn {
      background: var(--soft);

    }
    .admin-comm-thumb-wrap .admin-comm-play-ic {

    .admin-comm-info {

    async function api(action, payload = {}) {
      if (action === 'saveReel') action = 'addReel';

    // Network Upload via standard fetch with progress simulation (CORS preflight-safe)
    async function apiWithProgress(action, payload, onProgress) {
      if (!GAS_URL) throw new Error('Backend URL not configured');
      payload.action = action;
      payload.passkey = PASSKEY;

      const totalBytes = payload.base64Data ? payload.base64Data.length : 1000000;
      let currentPct = 10;
      let progressTimer = null;

      if (onProgress) {
        onProgress({ loaded: Math.round(totalBytes * 0.1), total: totalBytes, percent: 10 });
        progressTimer = setInterval(() => {
          if (currentPct < 90) {
            currentPct += Math.max(1, Math.round((90 - currentPct) / 6));
            const loaded = Math.round(totalBytes * (currentPct / 100));
            onProgress({ loaded, total: totalBytes, percent: currentPct });
          }
        }, 300);
      }

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 65000);

      try {
        const bodyStr = JSON.stringify(payload);
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: bodyStr,
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        const data = await res.json();
        if (progressTimer) clearInterval(progressTimer);
        if (onProgress) {
          onProgress({ loaded: totalBytes, total: totalBytes, percent: 100 });
        }
        return data;
      } catch (err) {
        clearTimeout(timeoutId);
        if (progressTimer) clearInterval(progressTimer);
        if (err.name === 'AbortError') {
          throw new Error('Upload timed out. Google Apps Script cannot handle large base64 files. Please deploy Code.gs in script.google.com to enable direct Google Drive streaming.');
        }
        throw err;
      }
    }

    // Video Thumbnail Generation Engine (Optimized Zero-Leak Lightweight Frame Extraction)
    function generateVideoThumbnail(file, targetSec = 1.0) {
      return new Promise((resolve, reject) => {
        if (!file || (!(file.type && file.type.startsWith('video/')) && !file.name.match(/\.(mp4|mov|webm|m4v)$/i))) {
          return reject(new Error('Selected file is not a supported video format'));
        }
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.muted = true;
        video.playsInline = true;
        const blobUrl = URL.createObjectURL(file);
        video.src = blobUrl;

        let resolved = false;
        const cleanup = () => {
          try {
            video.pause();
            video.removeAttribute('src');
            video.load();
            URL.revokeObjectURL(blobUrl);
            video.remove();
          } catch(e) {}
        };

        const timeout = setTimeout(() => {
          if (!resolved) {
            resolved = true;
            cleanup();
            reject(new Error('Thumbnail extraction timed out'));
          }
        }, 12000);

        video.onloadedmetadata = () => {
          const duration = video.duration || 30;
          const seekTo = Math.min(Math.max(0.2, targetSec), Math.max(0.2, duration - 0.2));
          video.currentTime = seekTo;
        };

        video.onseeked = () => {
          if (resolved) return;
          resolved = true;
          clearTimeout(timeout);
          try {
            // Downscale to lightweight thumbnail dimensions (max 480w, max 854h) to avoid canvas OOM crashes
            const rawW = video.videoWidth || 720;
            const rawH = video.videoHeight || 1280;
            const maxW = 480;
            const maxH = 854;
            let targetW = rawW;
            let targetH = rawH;

            if (targetW > maxW) {
              targetH = Math.round((targetH * maxW) / targetW);
              targetW = maxW;
            }
            if (targetH > maxH) {
              targetW = Math.round((targetW * maxH) / targetH);
              targetH = maxH;
            }

            const canvas = document.createElement('canvas');
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, targetW, targetH);

            // Compress to efficient 0.76 quality JPEG (~25KB-40KB)
            const dataUrl = canvas.toDataURL('image/jpeg', 0.76);
            canvas.width = 0;
            canvas.height = 0;

            const durationSec = Math.floor(video.duration) || 0;
            const m = Math.floor(durationSec / 60);
            const s = durationSec % 60;
            const durStr = `${m}:${s < 10 ? '0' : ''}${s}`;

            cleanup();

            resolve({
              dataUrl,
              durationStr: durStr,
              durationSec,
              width: targetW,
              height: targetH,
              sizeBytes: file.size
            });
          } catch (err) {
            cleanup();
            reject(err);
          }
        };

        video.onerror = err => {
          if (resolved) return;
          resolved = true;
          clearTimeout(timeout);
          cleanup();
          reject(new Error('Video decoding failed in browser'));
        };
      });
    }

    // Extract high-definition video thumbnail and duration cleanly with fallback
    async function extractThumbAndDuration(file) {
      try {
        const res = await generateVideoThumbnail(file, 1.0);
        return {
          durationStr: res.durationStr || '0:30',
          thumbData: res.dataUrl || ''
        };
      } catch (err) {
        console.warn('Video thumb extraction fallback:', err);
        return {
          durationStr: '0:30',
          thumbData: ''
        };
      }
    }

    // High-Capacity Google Drive Direct Streaming Engine
    async function uploadVideoFileToDrive(file, meta, onProgress) {
      if (!GAS_URL) throw new Error('Google Apps Script URL is not configured');
      
      // 1. Initialize Resumable Upload Session with Google Drive
      let initRes = null;
      try {
        initRes = await api('initVideoUpload', {
          clientName: meta.clientName || 'General',
          branch: meta.branch || '',
          album: meta.album || 'General',
          filename: file.name,
          mimeType: file.type || 'video/mp4',
          fileSize: file.size,
          origin: window.location.origin
        });
      } catch(e) {
        console.warn('initVideoUpload request failed, checking fallback:', e);
      }

      // 2. Stream raw binary file directly to Google Drive (Resumable PUT)
      if (initRes && initRes.success && initRes.uploadUrl) {
        const startTime = Date.now();
        const driveFileJson = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('PUT', initRes.uploadUrl, true);
          xhr.setRequestHeader('Content-Type', file.type || 'video/mp4');

          xhr.upload.onprogress = e => {
            if (!e.lengthComputable) return;
            const pct = Math.min(99, Math.round((e.loaded / e.total) * 100));
            const loadedMB = (e.loaded / (1024 * 1024)).toFixed(1);
            const totalMB = (e.total / (1024 * 1024)).toFixed(1);
            const elapsedSec = (Date.now() - startTime) / 1000;
            let speedText = 'Connecting...';
            if (elapsedSec > 0.5 && e.loaded > 0) {
              const speed = (e.loaded / (1024 * 1024) / elapsedSec).toFixed(1);
              const remBytes = e.total - e.loaded;
              const remSec = Math.max(1, Math.round(remBytes / (e.loaded / elapsedSec)));
              const remMin = remSec >= 60 ? `${Math.floor(remSec / 60)}m ${remSec % 60}s` : `${remSec}s`;
              speedText = `${speed} MB/s · ${remMin} remaining`;
            }
            if (onProgress) {
              onProgress({
                pct,
                loaded: e.loaded,
                total: e.total,
                bytesText: `${loadedMB} MB of ${totalMB} MB transferred`,
                speedText
              });
            }
          };

          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              try {
                resolve(JSON.parse(xhr.responseText));
              } catch(err) {
                reject(new Error('Invalid response from Google Drive'));
              }
            } else {
              reject(new Error(`Google Drive returned HTTP ${xhr.status}`));
            }
          };

          xhr.onerror = () => reject(new Error('Network error during Google Drive stream'));
          xhr.send(file);
        });

        // 3. Finalize video upload metadata in Google Apps Script
        if (onProgress) {
          onProgress({ pct: 99, bytesText: 'Finalizing permissions in Google Drive...', speedText: 'Saving metadata...' });
        }

        const reelId = meta.id || ('r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
        const fileId = driveFileJson.id;
        const finalCover = meta.coverUrl || `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;

        const finRes = await api('finalizeVideoUpload', {
          id: reelId,
          fileId,
          clientId: meta.clientId,
          clientName: meta.clientName,
          branch: meta.branch,
          album: meta.album,
          phase: meta.wave || 'wave_0',
          title: meta.title,
          year: new Date(meta.date || Date.now()).getFullYear(),
          month: new Date(meta.date || Date.now()).getMonth(),
          date: meta.date || new Date().toISOString().slice(0, 10),
          dur: meta.dur || '0:30',
          coverUrl: finalCover,
          status: meta.status || 'review'
        });

        if (finRes && finRes.reel) return finRes.reel;

        return {
          id: reelId,
          c: meta.clientId,
          type: 'reel',
          y: new Date(meta.date || Date.now()).getFullYear(),
          m: new Date(meta.date || Date.now()).getMonth(),
          b: meta.branch,
          album: meta.album,
          phase: meta.wave || 'wave_0',
          title: meta.title,
          date: meta.date || new Date().toISOString().slice(0, 10),
          url: `https://drive.google.com/file/d/${fileId}/view`,
          fileId,
          dur: meta.dur || '0:30',
          coverUrl: finalCover,
          hidden: false,
          status: meta.status || 'review',
          views: 0,
          downloads: 0
        };
      }

      // Fallback: For videos <= 25MB, upload via direct base64 if resumable is not ready
      if (file.size <= 25 * 1024 * 1024) {
        if (onProgress) onProgress({ pct: 15, bytesText: 'Encoding direct stream...', speedText: 'Preparing...' });
        const base64Data = await new Promise((res, rej) => {
          const reader = new FileReader();
          reader.onload = () => res(reader.result);
          reader.onerror = () => rej(new Error('Failed to read video file'));
          reader.readAsDataURL(file);
        });

        const fallbackRes = await apiWithProgress('uploadVideo', {
          clientName: meta.clientName,
          clientId: meta.clientId,
          branch: meta.branch,
          album: meta.album,
          title: meta.title,
          year: new Date(meta.date || Date.now()).getFullYear(),
          month: new Date(meta.date || Date.now()).getMonth(),
          date: meta.date || new Date().toISOString().slice(0, 10),
          dur: meta.dur || '0:30',
          coverUrl: meta.coverUrl || '',
          base64Data,
          filename: file.name,
          mimeType: file.type || 'video/mp4',
          status: meta.status || 'review'
        }, prog => {
          if (onProgress) {
            onProgress({
              pct: prog.percent,
              loaded: prog.loaded,
              total: prog.total,
              bytesText: `${(prog.loaded / (1024 * 1024)).toFixed(1)} MB of ${(prog.total / (1024 * 1024)).toFixed(1)} MB transferred`,
              speedText: 'Uploading directly to Drive...'
            });
          }
        });

        if (fallbackRes && fallbackRes.success && fallbackRes.reel) {
          return fallbackRes.reel;
        }
      }

      throw new Error((initRes && initRes.error) || 'Failed to initialize Google Drive upload session. Please verify connection.');
    }

    // Real-Time Cross-Tab & Storage Sync
    function saveAndBroadcast(msg = '') {
      DATA._updatedAt = Date.now();
      try {
        localStorage.setItem('dn_cloud_cache', JSON.stringify(DATA));
      } catch(e) {
        try {
          const slim = JSON.parse(JSON.stringify(DATA));
          if (slim.reels) {
            slim.reels.forEach(r => { if (r.coverUrl && r.coverUrl.length > 30000) r.coverUrl = ''; });
          }
          localStorage.setItem('dn_cloud_cache', JSON.stringify(slim));
        } catch(ex) {}
      }
      try {
        if (syncHub) syncHub.postMessage({ type: 'DATA_MUTATED', data: DATA, time: DATA._updatedAt });
      } catch(e) {}
      try {
        fetch('/api/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(DATA)
        }).catch(() => {});
      } catch(e) {}
      const hasChecked = document.querySelectorAll('.reel-batch-chk:checked').length > 0;
      const hasModal = document.querySelectorAll('.scrim, .modal-scrim, dialog[open]').length > 0;

    // Cloud Sync with Google Drive Engine
    async function sync(manual = false) {
      const syncBtn = document.getElementById('btn-manual-sync');
      if (syncBtn && manual) { syncBtn.classList.add('spinning'); setTimeout(() => syncBtn.classList.remove('spinning'), 1200); }
      try {
        const res = await fetch(`${GAS_URL}?action=getData`);
        const json = await res.json();
        if (json.success && json.data) {
          let deletedReelIds = getDeletedReelIds();
          let deletedClientIds = getDeletedClientIds();
          if (Array.isArray(json.data.deletedReelIds)) {
            let upd = false;
            json.data.deletedReelIds.forEach(id => {
              if (!deletedReelIds.includes(id)) { deletedReelIds.push(id); upd = true; }
            });
            if (upd) setDeletedReelIds(deletedReelIds);
          }
          if (Array.isArray(json.data.deletedClientIds)) {
            let upd = false;
            json.data.deletedClientIds.forEach(id => {
              if (!deletedClientIds.includes(id)) { deletedClientIds.push(id); upd = true; }
            });
            if (upd) setDeletedClientIds(deletedClientIds);
          }
          DATA.deletedReelIds = deletedReelIds;
          DATA.deletedClientIds = deletedClientIds;

          // Strip deleted and mock items; Google Drive is the source of truth
          const gasReels = (json.data.reels || []).filter(r => !deletedReelIds.includes(r.id));
          const pendingLocal = (DATA.reels || []).filter(lr => lr && lr._isLocalDraft && !deletedReelIds.includes(lr.id));
          const mergedReels = [...gasReels];
          pendingLocal.forEach(plr => {
            if (!mergedReels.some(gr => gr.id === plr.id)) mergedReels.unshift(plr);
          });

          const gasClients = (json.data.clients || []).filter(c => !deletedClientIds.includes(c.id));
          const localClients = (DATA.clients || []).filter(c => !deletedClientIds.includes(c.id));
          const mergedClients = [...gasClients];
          localClients.forEach(lc => {
            if (!mergedClients.some(gc => gc.id === lc.id)) mergedClients.push(lc);
          });

          DATA.settings = json.data.settings || DATA.settings;
          DATA.clients = mergedClients.length ? mergedClients : DATA.clients;
          DATA.reels = mergedReels;

          saveAndBroadcast('');

          document.getElementById('hdr-dot').className = 'status-dot online';
          document.getElementById('hdr-status').textContent = 'Google Drive Connected';
          document.getElementById('hdr-agency').textContent = DATA.settings?.agency || 'Day Night Media';
          if (manual) toast('Live sync complete with Google Drive!', 'success');
        }
      } catch(e) {
        document.getElementById('hdr-dot').className = 'status-dot offline';
        document.getElementById('hdr-status').textContent = 'Drive Engine Offline';
        if (manual) toast('Drive Engine Offline (cached local data active)', 'info');
      } finally {
        if (syncBtn) syncBtn.classList.remove('spinning');
      }
    }

              <button type="button" id="toggle-lock-pass" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--mute);">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div id="lock-err" style="color:var(--red);font-size:11px;font-weight:600;min-height:16px;margin-top:2px;"></div>
          </div>

          <button class="btn-primary" id="btn-unlock" style="justify-content:center;padding:12px;font-size:14px;">Unlock Admin Dashboard</button>
          
          <div style="margin-top:6px;border-top:1px solid var(--line);padding-top:12px;">
            <a href="/" style="font-size:12px;color:var(--blue);text-decoration:none;font-weight:600;">&larr; Return to Client Portal</a>
          </div>
        </div>`;
      
      document.body.appendChild(lockOverlay);

      const passInp = lockOverlay.querySelector('#lock-pass');
      const errBox = lockOverlay.querySelector('#lock-err');
      const toggleBtn = lockOverlay.querySelector('#toggle-lock-pass');
      const unlockBtn = lockOverlay.querySelector('#btn-unlock');

      toggleBtn.onclick = () => {
        passInp.type = passInp.type === 'password' ? 'text' : 'password';
      };

      const attemptUnlock = () => {
        const now = Date.now();
        if (lockedUntil > now) {
          const rem = Math.ceil((lockedUntil - now) / 1000);
          errBox.textContent = `Too many failed attempts. Locked for ${rem}s.`;
          return;
        }

        const entered = passInp.value.trim();
        if (isMasterAdminAuth(entered)) {
          PASSKEY = entered;
          localStorage.setItem('dn_admin_passkey', entered);
          sessionStorage.setItem('dn_admin_auth', entered);
          sessionStorage.removeItem('dn_failed_auth');
          sessionStorage.removeItem('dn_lock_until');
          isAuthenticated = true;
          lockOverlay.remove();
          toast('Admin Console Unlocked', 'success');
          render();
          return;
        }

        failedCount++;
        sessionStorage.setItem('dn_failed_auth', failedCount);
        if (failedCount >= 5) {
          lockedUntil = Date.now() + 30000;
          sessionStorage.setItem('dn_lock_until', lockedUntil);
          errBox.textContent = '5 failed attempts. Locked out for 30 seconds.';
        } else {
          errBox.textContent = `Invalid passkey. (${5 - failedCount} attempts remaining).`;
        }
        passInp.value = '';
        passInp.focus();
      };

      unlockBtn.onclick = attemptUnlock;
      passInp.onkeydown = e => { if (e.key === 'Enter') attemptUnlock(); };
    }

    function bindReelActions() {
      // Reordering / Video Arrangement (Real-Time Drag / Swapping)
      document.querySelectorAll('[data-move-up]').forEach(b => {
        b.onclick = (e) => {
          e.stopPropagation();
          const id = b.dataset.moveUp;
          const idx = DATA.reels.findIndex(x => x.id === id);
          if (idx > 0) {
            const temp = DATA.reels[idx];
            DATA.reels[idx] = DATA.reels[idx - 1];
            DATA.reels[idx - 1] = temp;
            DATA.reels.forEach((r, i) => r.order = i);
            persistLocal('Video order moved up in real time');
            renderReels();
          }
        };
      });

      document.querySelectorAll('[data-move-down]').forEach(b => {
        b.onclick = (e) => {
          e.stopPropagation();
          const id = b.dataset.moveDown;
          const idx = DATA.reels.findIndex(x => x.id === id);
          if (idx !== -1 && idx < DATA.reels.length - 1) {
            const temp = DATA.reels[idx];
            DATA.reels[idx] = DATA.reels[idx + 1];
            DATA.reels[idx + 1] = temp;
            DATA.reels.forEach((r, i) => r.order = i);
            persistLocal('Video order moved down in real time');
            renderReels();
          }
        };
      });

      // Sort / Arrange Videos
      const sortSelect = document.getElementById('sort-reels-order');
      if (sortSelect) {
        sortSelect.onchange = e => {
          const mode = e.target.value;
          if (mode === 'date-desc') {
            DATA.reels.sort((a,b) => (b.date || '') < (a.date || '') ? -1 : 1);
          } else if (mode === 'date-asc') {
            DATA.reels.sort((a,b) => (a.date || '') < (b.date || '') ? -1 : 1);
          } else if (mode === 'title-asc') {
            DATA.reels.sort((a,b) => (a.title || '').localeCompare(b.title || ''));
          } else if (mode === 'views-desc') {
            DATA.reels.sort((a,b) => (b.views || 0) - (a.views || 0));
          }
          DATA.reels.forEach((r, i) => r.order = i);
          persistLocal('Video arrangement updated in real time');
          renderReels();
        };
      }



      document.querySelectorAll('[data-play]').forEach(b => {
        b.onclick = () => {
          const r = DATA.reels.find(x => x.id === b.dataset.play);
          if (r) openVideoModal(r);
        };
      });
      document.querySelectorAll('[data-edit]').forEach(b => {
        b.onclick = () => {
          const r = DATA.reels.find(x => x.id === b.dataset.edit);
          if (r) openEditModal(r);
        };
      });
      document.querySelectorAll('[data-hide]').forEach(b => {
        b.onclick = async () => {
          const r = DATA.reels.find(x => x.id === b.dataset.hide);
          if (r) {
            r.hidden = !r.hidden;
            persistLocal(r.hidden ? 'Reel hidden from client' : 'Reel visible to client');
            try { await api('toggleHideReel', { id: r.id }); } catch(e) {}
          }
        };
      });
      document.querySelectorAll('[data-del]').forEach(b => {
        b.onclick = () => {
          const r = DATA.reels.find(x => x.id === b.dataset.del);
          if (!r) return;
          confirmModal('Delete Reel?', `Are you sure you want to delete "${r.title}"? This will permanently remove the reel from the client portal and trash the file in Google Drive.`, async () => {
            const delIds = getDeletedReelIds();
            if (!delIds.includes(r.id)) delIds.push(r.id);
            setDeletedReelIds(delIds);
            DATA.deletedReelIds = delIds;
            DATA.reels = (DATA.reels || []).filter(x => x.id !== r.id);
            try {
              if (syncHub) syncHub.postMessage({ type: 'REEL_DELETED', id: r.id });
            } catch(e) {}
            saveAndBroadcast('Reel removed from dashboard');
            try {
              const res = await api('deleteReel', { id: r.id });
              if (res && res.success) {
                toast(`"${r.title}" permanently deleted from Google Drive!`, 'success');
              }
            } catch(e) {
              console.warn('Backend deleteReel failed:', e);
            }
          }, 'Delete Reel', true);
        };
      });

      // Expand / Collapse Client Comments Box
      const toggleCommentsBtn = document.getElementById('btn-toggle-comments-box');
      const commentsHeaderEl = document.getElementById('admin-comments-header');
      const commentsListEl = document.getElementById('admin-comment-reels-list');
      const commentsTxtEl = document.getElementById('txt-toggle-comments');
      const commentsIcEl = document.getElementById('ic-toggle-comments');
      const commentsBox = document.querySelector('.admin-comments-box');

      function toggleCommentsCollapse(e) {
        if (e) e.stopPropagation();
        isCommentsCollapsed = !isCommentsCollapsed;
        localStorage.setItem('dn_admin_comments_collapsed', isCommentsCollapsed ? 'true' : 'false');
        if (commentsListEl) commentsListEl.style.display = isCommentsCollapsed ? 'none' : 'flex';
        if (commentsTxtEl) commentsTxtEl.textContent = isCommentsCollapsed ? 'Expand' : 'Collapse';
        if (commentsIcEl) commentsIcEl.style.transform = isCommentsCollapsed ? 'rotate(-90deg)' : 'rotate(0deg)';
        if (commentsBox) {
          if (isCommentsCollapsed) commentsBox.classList.add('is-collapsed');
          else commentsBox.classList.remove('is-collapsed');
        }
      }

      if (toggleCommentsBtn) toggleCommentsBtn.onclick = toggleCommentsCollapse;
      if (commentsHeaderEl) {
        commentsHeaderEl.onclick = (e) => {
          if (e.target.closest('#btn-toggle-comments-box')) return;
          toggleCommentsCollapse(e);
        };
      }
    }

    function bindBatchBoxActions(targetKind = 'reels', renderCallback) {
      const panel = document.getElementById('admin-batch-panel');
      const chks = document.querySelectorAll('.reel-batch-chk');
      const selectAll = document.getElementById('chk-select-all');
      const countSpan = document.getElementById('batch-selected-count');
      const btnCountSpan = document.getElementById('batch-btn-count');

      function getSelectedItems() {
        const selIds = Array.from(document.querySelectorAll('.reel-batch-chk:checked')).map(c => c.dataset.id);
        return (DATA.reels || []).filter(r => selIds.includes(r.id));
      }

      function updateBatchUI() {
        const selected = getSelectedItems();
        const count = selected.length;
        if (countSpan) countSpan.textContent = count;
        if (btnCountSpan) btnCountSpan.textContent = count;
        if (selectAll) selectAll.checked = chks.length > 0 && selected.length === chks.length;

        if (panel) {
          if (count > 0) {
            panel.style.borderColor = '#2F7DF6';
            panel.style.boxShadow = '0 6px 24px rgba(47,125,246,0.14)';
          } else {
            panel.style.borderColor = 'var(--line)';
            panel.style.boxShadow = '0 4px 20px rgba(0,0,0,0.06)';
          }
        }
      }

      chks.forEach(chk => {
        chk.onchange = () => updateBatchUI();
      });

      if (selectAll) {
        selectAll.onchange = e => {
          chks.forEach(c => c.checked = e.target.checked);
          updateBatchUI();
        };
      }

      // Branch Custom Input Toggle
      const brSel = document.getElementById('be-box-branch');
      const brCustom = document.getElementById('be-box-branch-custom');
      if (brSel && brCustom) {
        brSel.onchange = () => {
          brCustom.style.display = brSel.value === '__custom__' ? 'block' : 'none';
          if (brSel.value === '__custom__') brCustom.focus();
        };
      }

      // Wave Custom Input Toggle
      const waveSel = document.getElementById('be-box-wave');
      const waveCustom = document.getElementById('be-box-wave-custom');
      if (waveSel && waveCustom) {
        waveSel.onchange = () => {
          waveCustom.style.display = waveSel.value === '__custom__' ? 'block' : 'none';
          if (waveSel.value === '__custom__') waveCustom.focus();
        };
      }

      // Album Custom Input Toggle
      const albSel = document.getElementById('be-box-album');
      const albCustom = document.getElementById('be-box-album-custom');
      if (albSel && albCustom) {
        albSel.onchange = () => {
          albCustom.style.display = albSel.value === '__custom__' ? 'block' : 'none';
          if (albSel.value === '__custom__') albCustom.focus();
        };
      }

      // Deselect All
      document.getElementById('btn-batch-clear')?.addEventListener('click', () => {
        chks.forEach(c => c.checked = false);
        if (selectAll) selectAll.checked = false;
        updateBatchUI();
      });

      // Apply Changes Button
      document.getElementById('btn-batch-box-apply')?.addEventListener('click', async () => {
        const targets = getSelectedItems();
        if (!targets.length) {
          toast('Please select at least 1 item using checkboxes below', 'amber');
          return;
        }

        let branchVal = brSel ? brSel.value : '';
        if (branchVal === '__custom__') branchVal = brCustom ? brCustom.value.trim() : '';
        else if (branchVal === '__none__') branchVal = '';

        let waveVal = waveSel ? waveSel.value : '';
        if (waveVal === '__custom__') waveVal = waveCustom ? waveCustom.value.trim() : '';

        let albumVal = albSel ? albSel.value : '';
        if (albumVal === '__custom__') albumVal = albCustom ? albCustom.value.trim() : '';
        else if (albumVal === '__none__') albumVal = 'General';

        const monthEl = document.getElementById('be-box-month');
        const monthVal = monthEl ? monthEl.value : '';

        const statusEl = document.getElementById('be-box-status');
        let statusVal = statusEl ? statusEl.value : '';

        // If an album is explicitly selected for items and status was left untouched, auto-approve them for that album
        if (albumVal && albumVal !== 'General' && statusVal === '') {
          statusVal = 'approved';
        }

        const visEl = document.getElementById('be-box-visibility');
        const visVal = visEl ? visEl.value : '';

        if (!branchVal && branchVal !== '' && !waveVal && !albumVal && monthVal === '' && statusVal === '' && visVal === '') {
          toast('Please select at least one property to update', 'amber');
          return;
        }

        targets.forEach(r => {
          if (branchVal !== '') r.b = branchVal;
          if (waveVal !== '') { r.wave = waveVal; r.phase = waveVal; }
          if (albumVal !== '') r.album = albumVal;
          if (monthVal !== '') r.m = parseInt(monthVal, 10);
          if (statusVal !== '') r.status = statusVal;
          if (visVal === 'show') r.hidden = false;
          else if (visVal === 'hide') r.hidden = true;
        });

        const targetClient = (DATA.clients || []).find(c => c.id === (targets[0] && targets[0].c));
        if (branchVal && targetClient && targetClient.branches && !targetClient.branches.includes(branchVal)) {
          targetClient.branches.push(branchVal);
        }
        if (waveVal && targetClient && targetClient.waves && !targetClient.waves.includes(waveVal)) {
          targetClient.waves.push(waveVal);
        }
        if (albumVal && albumVal !== 'General' && targetClient) {
          targetClient.albums = targetClient.albums || [];
          if (!targetClient.albums.includes(albumVal)) targetClient.albums.push(albumVal);
        }

        saveAndBroadcast(`Batch updated ${targets.length} items in real time!`);
        if (typeof renderCallback === 'function') renderCallback();

        if (GAS_URL) {
          const updates = {};
          if (branchVal !== '') updates.b = branchVal;
          if (waveVal !== '') updates.wave = waveVal;
          if (albumVal !== '') updates.album = albumVal;
          if (monthVal !== '') updates.m = monthVal;
          if (statusVal !== '') updates.status = statusVal;
          if (visVal === 'show') updates.hidden = false;
          else if (visVal === 'hide') updates.hidden = true;
          api('batchUpdateReels', { ids: targets.map(r => r.id), updates }).catch(e => console.warn('Background sync:', e));
          api('syncData', { data: DATA }).catch(e => console.warn('Background sync:', e));
        }
      });

      // Bulk Approve
      document.getElementById('btn-batch-approve')?.addEventListener('click', () => {
        const targets = getSelectedItems();
        if (!targets.length) { toast('Please select items first', 'amber'); return; }
        confirmModal('Batch Approve Items?', `Approve ${targets.length} selected items? They will be immediately published to client portals.`, async () => {
          targets.forEach(r => r.status = 'approved');
          saveAndBroadcast(`Batch approved ${targets.length} items`);
          if (typeof renderCallback === 'function') renderCallback();
          if (GAS_URL) {
            try {
              await api('batchUpdateReels', { ids: targets.map(r => r.id), updates: { status: 'approved' } });
              await api('syncData', { data: DATA });
              toast(`Synced ${targets.length} approved items to Google Drive!`, 'success');
            } catch (e) {
              console.warn('Batch approve sync error:', e);
            }
          }
        }, 'Approve All', false);
      });

      // Bulk Review
      document.getElementById('btn-batch-review')?.addEventListener('click', async () => {
        const targets = getSelectedItems();
        if (!targets.length) { toast('Please select items first', 'amber'); return; }
        targets.forEach(r => r.status = 'review');
        saveAndBroadcast(`Marked ${targets.length} items as In Review`);
        if (typeof renderCallback === 'function') renderCallback();
        if (GAS_URL) {
          try {
            await api('batchUpdateReels', { ids: targets.map(r => r.id), updates: { status: 'review' } });
            await api('syncData', { data: DATA });
          } catch(e) {}
        }
      });

      // Bulk Deny
      document.getElementById('btn-batch-deny')?.addEventListener('click', () => {
        const targets = getSelectedItems();
        if (!targets.length) { toast('Please select items first', 'amber'); return; }
        confirmModal('Batch Deny Items?', `Mark ${targets.length} selected items as Denied / Revisions Requested?`, async () => {
          targets.forEach(r => r.status = 'denied');
          saveAndBroadcast(`Marked ${targets.length} items as Denied`);
          if (typeof renderCallback === 'function') renderCallback();
          if (GAS_URL) {
            try {
              await api('batchUpdateReels', { ids: targets.map(r => r.id), updates: { status: 'denied' } });
              await api('syncData', { data: DATA });
            } catch(e) {}
          }
        }, 'Deny All', true);
      });

      // Bulk Toggle Hide
      document.getElementById('btn-batch-hide')?.addEventListener('click', async () => {
        const targets = getSelectedItems();
        if (!targets.length) { toast('Please select items first', 'amber'); return; }
        const anyVisible = targets.some(r => !r.hidden);
        targets.forEach(r => r.hidden = anyVisible);
        saveAndBroadcast(`Updated visibility for ${targets.length} items`);
        if (typeof renderCallback === 'function') renderCallback();
        if (GAS_URL) {
          try {
            await api('batchUpdateReels', { ids: targets.map(r => r.id), updates: { hidden: anyVisible } });
            await api('syncData', { data: DATA });
          } catch(e) {}
        }
      });

      // Bulk Delete
      document.getElementById('btn-batch-del')?.addEventListener('click', () => {
        const targets = getSelectedItems();
        if (!targets.length) { toast('Please select items first', 'amber'); return; }
        confirmModal('Delete Selected Items?', `Are you sure you want to permanently remove ${targets.length} items? This cannot be undone.`, async () => {
          const ids = targets.map(r => r.id);
          const delIds = getDeletedReelIds();
          ids.forEach(id => {
            if (!delIds.includes(id)) delIds.push(id);
          });
          setDeletedReelIds(delIds);
          DATA.deletedReelIds = delIds;
          DATA.reels = (DATA.reels || []).filter(r => !ids.includes(r.id));
          ids.forEach(id => {
            try { if (syncHub) syncHub.postMessage({ type: 'REEL_DELETED', id }); } catch(e) {}
          });
          saveAndBroadcast(`Deleted ${targets.length} items`);
          if (typeof renderCallback === 'function') renderCallback();
          try {
            await api('batchDeleteReels', { ids });
            await api('syncData', { data: DATA });
          } catch(e) {
            console.warn('Batch delete backend error:', e);
          }
        }, 'Delete All Selected', true);
      });
    }

        </div>

          <input type="url" id="u-img-url" placeholder="https://drive.google.com/file/d/... or https://...">
        </div>

        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;">
          <button type="button" class="btn-portal" data-close>Cancel</button>
          <button type="button" class="btn-primary" id="u-img-submit-btn" style="background:linear-gradient(135deg, #6C5CE7, #2F7DF6);border-color:#6C5CE7;">Publish Content</button>
        </div>
      `, sc => {
        let currentImgUrl = '';
        const prevBox = sc.querySelector('#u-img-prev-box');
        const fileInput = sc.querySelector('#u-img-file');
        const urlInput = sc.querySelector('#u-img-url');
        const submitBtn = sc.querySelector('#u-img-submit-btn');

        function updatePrev(url) {
          currentImgUrl = url;
          if (url) prevBox.innerHTML = `<img src="${esc(url)}" style="width:100%;height:100%;object-fit:contain;">`;
          else prevBox.innerHTML = '<span style="font-size:12px;color:#8E9BAE;">Select file or paste link to preview</span>';
        }

        fileInput.onchange = e => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const maxDim = 1200;
              let w = img.width, h = img.height;
              if (w > maxDim || h > maxDim) {
                if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                else { w = Math.round((w * maxDim) / h); h = maxDim; }
              }
              const canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
              updatePrev(dataUrl);
              urlInput.value = '';
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        };

        urlInput.oninput = () => {
          let val = urlInput.value.trim();
          if (val) {
            const dId = driveId(val);
            if (dId) val = `https://drive.google.com/thumbnail?id=${dId}&sz=w1200`;
            updatePrev(val);
          }
        };

        submitBtn.onclick = () => {
          const clientId = sc.querySelector('#u-img-client').value;
          const type = sc.querySelector('#u-img-type').value;
          const title = sc.querySelector('#u-img-title').value.trim() || (type === 'story' ? 'Festive Story' : 'Festive Poster');
          const date = sc.querySelector('#u-img-date').value || new Date().toISOString().slice(0, 10);
          const branch = sc.querySelector('#u-img-branch').value.trim();
          const album = sc.querySelector('#u-img-album').value.trim();

          if (!currentImgUrl) {
            toast('Please upload an image file or provide a link', 'amber');
            return;
          }

          const y = parseInt(date.slice(0, 4), 10);
          const m = parseInt(date.slice(5, 7), 10) - 1;

          const newItem = {
            id: 'img_' + Date.now().toString(36),
            c: clientId,
            type: type,
            title: title,
            date: date,
            y: y,
            m: m,
            b: branch,
            album: album,
            url: currentImgUrl,
            coverUrl: currentImgUrl,
            dur: type === 'story' ? '9:16' : '1:1',
            status: 'approved',
            views: 0,
            downloads: 0,
            hidden: false
          };

          DATA.reels = DATA.reels || [];
          DATA.reels.unshift(newItem);
          saveAndBroadcast(`${type === 'story' ? 'Story' : 'Poster'} published for client!`);
          toast(`${type === 'story' ? 'Story' : 'Poster'} published successfully!`, 'success');
          sc.remove();
          render();
          api('addReel', { reel: newItem }).catch(() => {});
        };
      });
    }

      document.getElementById('btn-add-client').onclick = () => openClientModal(null);

          promptModal('Add Store Branch', `New branch location for ${client.name}:`, '', async val => {
            client.branches = client.branches || [];
            if (!client.branches.includes(val)) {
              client.branches.push(val);
              saveAndBroadcast(`Branch "${val}" added!`);
              try { await api('saveClient', { client }); } catch(e) {}
            } else {
              toast('Branch already exists', 'info');
            }
          }, 'e.g. T. Nagar, Coimbatore');
        };
      });

      document.querySelectorAll('[data-del-branch]').forEach(b => {
        b.onclick = () => {
          const client = DATA.clients.find(x => x.id === b.dataset.delBranch);

          if (!client) return;
          confirmModal('Remove Store Branch?', `Are you sure you want to remove "${branchName}" from ${client.name}? Existing reels will retain their record.`, async () => {

            } else {
              toast('Wave already exists', 'info');
            }
          }, 'e.g. Week 1, Phase 1, Festive Wave');
        };
      });

      document.querySelectorAll('[data-del-wave]').forEach(b => {
        b.onclick = () => {
          const client = DATA.clients.find(x => x.id === b.dataset.delWave);
          if (!client) return;
          const waveName = b.dataset.w;
          confirmModal('Remove Delivery Wave?', `Are you sure you want to remove "${waveName}" from ${client.name}?`, async () => {
            client.waves = (client.waves || []).filter(x => x !== waveName);
            saveAndBroadcast(`Wave "${waveName}" removed`);
            try { await api('saveClient', { client }); } catch(e) {}
          }, 'Remove Wave', true);
        };
      });

    // TAB: PORTAL CONTROLS & SOCIAL

            <p style="font-size:11px;color:var(--mute);margin-top:10px;">When active, only visitors with the Admin Passkey can access the portal.</p>

          valDisp.textContent = `${slider.value}s`;
          document.querySelectorAll('.ctrl-preset-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.dur === slider.value);
          });
        };
      }

      // Preset buttons listener
      document.querySelectorAll('.ctrl-preset-btn').forEach(btn => {
        btn.onclick = () => {
          const d = btn.dataset.dur;
          if (slider) slider.value = d;
          if (valDisp) valDisp.textContent = `${d}s`;
          document.querySelectorAll('.ctrl-preset-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

      function bindStudioEvents() {
        studioEl.querySelector('#st-btn-discard').onclick = () => studioEl.remove();

        const clientSel = studioEl.querySelector('#st-client-sel');
        clientSel.onchange = e => {
          activeClient = (DATA.clients || []).find(c => c.id === e.target.value) || activeClient;
          renderStudio();
        };

        // Tabs
        const tabFiles = studioEl.querySelector('#st-tab-files');
        const tabLinks = studioEl.querySelector('#st-tab-links');
        const boxFiles = studioEl.querySelector('#st-box-files');
        const boxLinks = studioEl.querySelector('#st-box-links');

        tabFiles.onclick = () => {
          tabFiles.classList.add('active'); tabLinks.classList.remove('active');
          boxFiles.style.display = 'block'; boxLinks.style.display = 'none';
        };
        tabLinks.onclick = () => {
          tabLinks.classList.add('active'); tabFiles.classList.remove('active');
          boxLinks.style.display = 'block'; boxFiles.style.display = 'none';
        };

        // Multi-file browse & drag-and-drop
        const fileInp = studioEl.querySelector('#st-file-multi');
        studioEl.querySelector('#st-btn-pick-files').onclick = () => fileInp.click();
        boxFiles.onclick = e => { if (e.target !== studioEl.querySelector('#st-btn-pick-files')) fileInp.click(); };

        boxFiles.ondragover = e => {
          e.preventDefault();
          boxFiles.style.borderColor = '#2563EB';
          boxFiles.style.background = '#EFF6FF';
        };
        boxFiles.ondragleave = () => {
          boxFiles.style.borderColor = '';
          boxFiles.style.background = '';
        };
        boxFiles.ondrop = async e => {
          e.preventDefault();
          boxFiles.style.borderColor = '';
          boxFiles.style.background = '';
          const droppedFiles = Array.from(e.dataTransfer.files).filter(f => (f.type && f.type.startsWith('video/')) || f.name.match(/\.(mp4|mov|webm|m4v)$/i));
          if (droppedFiles.length) {
            handleVideoFiles(droppedFiles);
          } else {
            toast('Please drop valid video files (.mp4, .mov, .webm)', 'amber');
          }
        };

        fileInp.onchange = async e => {
          const files = Array.from(e.target.files);
          if (!files.length) return;
          handleVideoFiles(files);
        };

        async function handleVideoFiles(files) {
          toast(`Ingesting ${files.length} video file${files.length > 1 ? 's' : ''}...`, 'info');

          for (const file of files) {
            const rawTitle = file.name.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' ').trim();
            const formattedTitle = rawTitle.charAt(0).toUpperCase() + rawTitle.slice(1);
            const waves = getClientWaves();
            const defaultWave = 'wave_0';
            const defaultBranch = activeClient.branches && activeClient.branches[0] ? activeClient.branches[0] : '';

            const newItem = {
              id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
              title: formattedTitle,
              fileName: file.name,
              fileObj: file,
              dur: '0:30',
              coverUrl: '',
              branch: defaultBranch,
              album: activeClient.albums && activeClient.albums[0] ? activeClient.albums[0] : 'General',
              wave: defaultWave,
              status: 'review',
              date: new Date().toISOString().slice(0, 10),
              url: ''
            };
            queue.push(newItem);

            // Asynchronously extract thumbnail & duration without freezing queue rendering
            extractThumbAndDuration(file).then(res => {
              if (res) {
                if (res.durationStr) newItem.dur = res.durationStr;
                if (res.thumbData) newItem.coverUrl = res.thumbData;
                renderStudio();
              }
            }).catch(() => {});
          }
          activeItemIdx = queue.length - 1;
          renderStudio();
        }
