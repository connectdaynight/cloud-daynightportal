<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFDF8">
  <!-- Primary Meta Tags -->
  <title>Day Night Media | DAY NIGHT</title>
  <meta name="title" content="Day Night Media | DAY NIGHT">
  <meta name="description" content="Day Night Media - Production Company &amp; Private Client Delivery Portal">

  <!-- Favicon & Touch Icons -->
  <link rel="icon" type="image/png" id="dynamic-favicon" href="/Logo/logo.png">
  <link rel="apple-touch-icon" id="dynamic-apple-icon" href="/Logo/logo.png">

  <!-- Open Graph / WhatsApp / Facebook / LinkedIn -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DAY NIGHT">
  <meta property="og:url" content="https://zd-daynight-portal.pages.dev/">
  <meta property="og:title" content="Day Night Media | DAY NIGHT">
  <meta property="og:description" content="Day Night Media - Production Company &amp; Private Client Delivery Portal">
  <meta property="og:image" content="https://zd-daynight-portal.pages.dev/Logo/logo.png">
  <meta property="og:image:secure_url" content="https://zd-daynight-portal.pages.dev/Logo/logo.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Day Night Media | DAY NIGHT">
  <meta name="twitter:description" content="Day Night Media - Production Company &amp; Private Client Delivery Portal">
  <meta name="twitter:image" content="https://zd-daynight-portal.pages.dev/Logo/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&display=swap">
  <style>
    /* ==========================================================================
       DAY NIGHT MEDIA - SIGNATURE LUXURY MILK-WHITE THEME
       ========================================================================== */
    :root {
      --bg: #FFFDF8;
      --card: #FFFFFF;
      --line: #EEE8DD;
      --soft: #F7F3EC;
      --ink: #1D2433;
      --navy: #12294A;
      --mute: #7A7468;
      --gold: #B8935A;
      --red: #E53225;
      --rose: #E8457A;
      --teal: #17A598;
      --amber: #F2992E;
      --violet: #6C5CE7;
      --blue: #2F7DF6;
      --green: #1FAF64;
      --f: 'Poppins', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      color-scheme: light;
    }

    html, body {
      min-height: 100%;
      min-height: 100dvh;
      margin: 0;
      padding: 0;
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: none;
    }

    body {
      color: var(--ink);
      font-family: var(--f);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      display: flex;
      flex-direction: column;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
      touch-action: manipulation;
    }

    button {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    button:active, .btn:active, .act:active, .home-client-btn:active, .month:active, .branch:active, .back:active {
      transform: scale(0.96) !important;
      transition: transform 0.08s ease;
    }

    :focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

    .app {
      max-width: 440px;
      margin: 0 auto;
      min-height: 100dvh;
      width: 100%;
      padding-inline: 16px;
      padding-bottom: max(32px, calc(18px + env(safe-area-inset-bottom, 0px)));
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Day Night Signature Mark */
    .dn { display: block; }
    .dn .scrib { stroke-dasharray: 1; stroke-dashoffset: 0; }
    .splash .dn .scrib, .dn-intro .dn .scrib { animation: draw 1.5s 0.7s ease-in-out both; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

    /* Day Night Intro Animation */
    .dn-intro {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      text-align: center;
      padding-block: 64px 120px;
      position: relative;
      overflow: hidden;
      min-height: 85vh;
      min-height: 85dvh;
      cursor: pointer;
    }
    .dn-intro .confetti {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .dn-intro .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 2;
    }
    .dn-intro .mark {
      width: 76px;
      height: 76px;
      filter: drop-shadow(0 14px 24px rgba(229, 50, 37, 0.28));
    }
    .mark-wrap {
      animation: pop 0.8s cubic-bezier(0.2, 1.5, 0.4, 1) both;
    }
    @keyframes pop {
      0% { transform: scale(0); opacity: 0; }
      70% { opacity: 1; }
      100% { transform: none; opacity: 1; }
    }
    .dn-intro h1 {
      margin: 0;
      font-weight: 700;
      font-size: 26px;
      letter-spacing: -0.01em;
      color: var(--navy);
      line-height: 1.15;
      text-wrap: balance;
    }
    .dn-intro .sub {
      margin: 5px 0 0;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .dn-intro .slogan {
      margin: 0;
      font-family: var(--serif);
      font-style: italic;
      font-weight: 500;
      font-size: 17px;
      color: var(--mute);
    }
    .a2 { animation: rise 0.7s 1.2s ease-out both; }
    .a3 { animation: rise 0.7s 1.6s ease-out both; }
    @keyframes rise {
      from { transform: translateY(14px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }
    .dn-intro .start {
      position: absolute;
      bottom: calc(36px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translate(-50%, 10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s, transform 0.5s;
      z-index: 3;
    }
    .dn-intro.ready .start {
      opacity: 1;
      transform: translate(-50%, 0);
      pointer-events: auto;
    }

    /* Client Dedicated PIN Screen */
    .client-pin-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      animation: rise 0.35s ease-out both;
    }
    .client-pin-card {
      margin-top: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 28px 20px;
      box-shadow: 0 16px 40px rgba(18, 41, 74, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }
    .client-pin-logo-box {
      width: 200px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 8px 16px;
      box-shadow: 0 4px 14px rgba(18, 41, 74, 0.06);
    }
    .client-pin-logo-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .client-pin-logo-box .wordmark {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 24px;
      color: var(--navy);
    }
    .client-pin-title {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.01em;
    }
    .client-pin-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: var(--violet);
      background: rgba(108, 92, 231, 0.08);
      padding: 4px 14px;
      border-radius: 999px;
      letter-spacing: 0.03em;
    }
    .client-pin-desc {
      margin: 0;
      font-size: 13px;
      color: var(--mute);
    }
    .client-pin-footer {
      font-size: 11px;
      color: var(--mute);
      margin-top: 4px;
    }

    /* ==========================================================================
       DAY NIGHT MEDIA - ULTRA-LUXURY HOME HUB (MOBILE-FIRST)
       ========================================================================== */
    .home-hub {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding-block: 14px 28px;
      text-align: center;
      position: relative;
      z-index: 1;
      width: 100%;
    }

    .canvas-fx {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .home-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 2;
      animation: pop 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .home-logo-wrap {
      width: 82px;
      height: 82px;
      border-radius: 26px;
      background: #FFFFFF;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      padding: 10px;
      box-shadow: 0 12px 32px rgba(18, 41, 74, 0.12), 0 2px 8px rgba(0, 0, 0, 0.04);
      position: relative;
    }
    .home-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .home-title {
      font-size: clamp(24px, 6vw, 30px);
      font-weight: 700;
      color: var(--navy);
      margin: 0;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .home-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mute);
    }

    .home-slogan {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(15px, 4vw, 17px);
      color: var(--mute);
      margin: 0;
      max-width: 320px;
    }

    /* Home Direct PIN Card */
    .home-card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 20px 18px;
      box-shadow: 0 10px 30px rgba(18, 41, 74, 0.05);
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: left;
      z-index: 2;
      animation: rise 0.7s 0.2s ease-out both;
    }

    .home-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .home-card-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--navy), #1D3A63);
      color: #fff;
      display: grid;
      place-items: center;
      flex: none;
      box-shadow: 0 6px 16px rgba(18, 41, 74, 0.2);
    }
    .home-card-header b {
      display: block;
      font-size: 15px;
      color: var(--navy);
      font-weight: 600;
    }
    .home-card-header small {
      display: block;
      font-size: 11px;
      color: var(--mute);
      line-height: 1.3;
    }

    /* Direct PIN Row */
    .home-pin-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 280px;
      margin: 2px auto 0;
      width: 100%;
    }
    .home-pin-row input {
      width: 100%;
      height: 56px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: var(--bg);
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: var(--navy);
      font-variant-numeric: tabular-nums;
      outline: none;
      transition: all 0.2s ease;
      -webkit-appearance: none;
    }
    .home-pin-row input:focus {
      border-color: var(--navy);
      background: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(18, 41, 74, 0.1);
      transform: translateY(-2px);
    }
    .home-pin-row.bad input {
      border-color: var(--red);
      animation: shake 0.35s;
    }

    .home-pin-msg {
      text-align: center;
      font-size: 12px;
      min-height: 18px;
      color: var(--mute);
      font-weight: 500;
    }
    .home-pin-msg.bad { color: var(--red); }
    .home-pin-msg.ok { color: var(--green); }

    /* Client Selector List */
    .home-clients-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--mute);
      margin-top: 2px;
    }
    .home-clients-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .home-client-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--soft);
      border: 1px solid var(--line);
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      color: var(--ink);
      width: 100%;
    }
    .home-client-btn:hover, .home-client-btn:active {
      background: #FFFFFF;
      border-color: var(--navy);
      transform: translateX(2px);
      box-shadow: 0 4px 12px rgba(18, 41, 74, 0.06);
    }
    .home-client-logo {
      width: 44px;
      height: 28px;
      display: grid;
      place-items: center;
      flex: none;
    }
    .home-client-logo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .home-client-info {
      flex: 1;
      min-width: 0;
    }
    .home-client-info b {
      display: block;
      font-size: 13px;
      color: var(--navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .home-client-info small {
      display: block;
      font-size: 10px;
      color: var(--mute);
    }
    .home-client-arrow {
      color: var(--mute);
      flex: none;
    }

    /* Home Footer Info */
    .home-footer-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      z-index: 2;
      animation: rise 0.7s 0.4s ease-out both;
    }
    .cloud-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--line);
      font-size: 11px;
      font-weight: 500;
      color: var(--mute);
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #E53225;
      display: inline-block;
    }
    .pulse-dot.online {
      background: #16884D;
      box-shadow: 0 0 0 3px rgba(22, 136, 77, 0.18);
    }
    .admin-hint {
      font-size: 10px;
      color: var(--mute);
    }
    .admin-hint code {
      font-family: inherit;
      font-weight: 700;
      color: var(--navy);
      background: var(--soft);
      padding: 2px 5px;
      border-radius: 4px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 2;
    }

    .mark-wrap { animation: pop 0.8s cubic-bezier(0.2, 1.5, 0.4, 1) both; }
    @keyframes pop {
      0% { transform: scale(0); opacity: 0; }
      70% { opacity: 1; }
      100% { transform: none; opacity: 1; }
    }

    .a2 { animation: rise 0.7s 1.2s ease-out both; }
    .a3 { animation: rise 0.7s 1.6s ease-out both; }
    @keyframes rise {
      from { transform: translateY(14px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 12px 24px;
      font-weight: 600;
      font-size: 13px;
      background: var(--navy);
      color: #fff;
      display: inline-flex;
      gap: 10px;
      align-items: center;
      box-shadow: 0 10px 24px rgba(18, 41, 74, 0.18);
      white-space: nowrap;
    }

    .btn:hover { background: #1C3A63; }

    /* Top Navigation Bar */
    .top {
      position: sticky;
      top: 0;
      z-index: 25;
      background: rgba(255, 253, 248, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      margin-inline: -16px;
      padding: max(10px, env(safe-area-inset-top, 0px)) 16px 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(238, 232, 221, 0.7);
    }

    .back {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--card);
      display: grid;
      place-items: center;
      flex: none;
      box-shadow: 0 4px 12px rgba(29, 36, 51, 0.06);
    }

    .top .crumb { min-width: 0; flex: 1; }
    .top .crumb small {
      display: block;
      font-size: 11px;
      color: var(--mute);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top .crumb span {
      display: block;
      font-weight: 600;
      font-size: 16px;
      color: var(--navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top .mini { width: 34px; height: 34px; flex: none; }

    /* Floating Modal Sheet & Backdrop */
    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(18, 41, 74, 0.42);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 40;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: fade 0.2s ease-out;
      overscroll-behavior: contain;
    }

    .scrim.center { align-items: center; padding: 16px; }

    /* Centered High-Definition Video Modal */
    .scrim.video-modal-scrim {
      align-items: center !important;
      justify-content: center !important;
      padding: 16px !important;
      background: rgba(18, 41, 74, 0.45) !important;
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
    }
    .scrim.video-modal-scrim .sheet {
      border-radius: 26px !important;
      max-width: 480px !important;
      width: 100% !important;
      max-height: 96dvh !important;
      padding: 16px 18px 20px !important;
      margin: auto !important;
      box-shadow: 0 28px 70px rgba(18, 41, 74, 0.25) !important;
      background: var(--bg) !important;
      color: var(--navy) !important;
      border: 1px solid var(--line) !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 10px !important;
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    .scrim.video-modal-scrim .sheet h4 {
      color: var(--navy) !important;
      font-size: 16px !important;
      font-weight: 700 !important;
    }
    .scrim.video-modal-scrim .sheet p {
      color: var(--mute) !important;
      font-size: 11px !important;
    }
    .scrim.video-modal-scrim .sheet button.ghost[data-close] {
      color: var(--navy) !important;
      background: var(--soft) !important;
      border: 1px solid var(--line) !important;
      border-radius: 999px !important;
      padding: 6px 14px !important;
      font-size: 12px !important;
      font-weight: 600 !important;
      transition: all 0.2s ease;
    }
    .scrim.video-modal-scrim .sheet button.ghost[data-close]:hover {
      background: var(--card) !important;
      border-color: var(--navy) !important;
    }

    /* FULL-SCREEN MOBILE VIDEO VIEWPORT (THEME INTEGRATED) */
    @media (max-width: 640px) {
      .scrim.video-modal-scrim {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100dvh !important;
        max-width: 100vw !important;
        max-height: 100dvh !important;
        padding: 0 !important;
        margin: 0 !important;
        background: var(--bg) !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: stretch !important;
        justify-content: stretch !important;
        z-index: 9999 !important;
        border-radius: 0 !important;
      }
      .scrim.video-modal-scrim .sheet {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        max-width: 100vw !important;
        height: 100dvh !important;
        max-height: 100dvh !important;
        border-radius: 0 !important;
        margin: 0 !important;
        padding: calc(env(safe-area-inset-top, 8px) + 8px) 14px calc(env(safe-area-inset-bottom, 8px) + 8px) 14px !important;
        background: var(--bg) !important;
        color: var(--navy) !important;
        box-shadow: none !important;
        border: none !important;
        animation: none !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
        gap: 8px !important;
        overflow: hidden !important;
        z-index: 10000 !important;
      }
      .scrim.video-modal-scrim .sheet .video-modal-wrap {
        height: 100% !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
        gap: 8px !important;
        width: 100% !important;
      }
      .scrim.video-modal-scrim .sheet h4 {
        color: var(--navy) !important;
      }
      .scrim.video-modal-scrim .sheet p {
        color: var(--mute) !important;
      }
      .scrim.video-modal-scrim .video-frame-box {
        flex: 1 1 auto !important;
        width: 100% !important;
        max-width: min(100%, calc((100dvh - 150px) * 9 / 16)) !important;
        aspect-ratio: 9/16 !important;
        height: auto !important;
        max-height: calc(100dvh - 150px) !important;
        border-radius: 20px !important;
        margin: auto !important;
        background: #000000 !important;
        box-shadow: 0 16px 45px rgba(18, 41, 74, 0.16) !important;
      }
      .scrim.video-modal-scrim .sheet .acts {
        flex: none !important;
        margin-top: 0 !important;
        padding-bottom: 2px !important;
        display: grid !important;
        grid-template-columns: repeat(3, 1fr) !important;
        gap: 8px !important;
      }
      .scrim.video-modal-scrim .sheet .act {
        background: var(--card) !important;
        border: 1px solid var(--line) !important;
        color: var(--ink) !important;
        border-radius: 14px !important;
        padding: 8px 4px 6px !important;
        box-shadow: 0 4px 12px rgba(18, 41, 74, 0.04) !important;
      }
      .scrim.video-modal-scrim .sheet .act .chip {
        width: 28px !important;
        height: 28px !important;
        border-radius: 99px !important;
        display: grid !important;
        place-items: center !important;
        background: var(--k) !important;
      }
      .scrim.video-modal-scrim .sheet .act span {
        color: var(--ink) !important;
        font-size: 11px !important;
        font-weight: 500 !important;
      }
    }

    /* Mobile Recent Apps Style Carousel Container (Zero Black Empty Space) */
    .video-frame-box {
      position: relative;
      width: 100%;
      max-width: min(100%, calc((88dvh - 130px) * 9 / 16));
      aspect-ratio: 9/16;
      border-radius: 20px;
      overflow: hidden;
      background: #000000;
      box-shadow: 0 16px 45px rgba(18, 41, 74, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
    }

    /* Mobile Recent Apps Card Inner Container (Pinned Edge-to-Edge) */
    .video-card-inner {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.32s ease, filter 0.32s ease;
      will-change: transform, opacity;
      transform: translateX(0) scale(1);
      opacity: 1;
    }
    .video-card-inner video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover !important;
      display: block;
      border-radius: 20px;
      background: #000000;
    }

    /* Mobile Recent Apps Carousel Transitions */
    .video-card-inner.app-slide-out-left {
      transform: translateX(-105%) scale(0.88);
      opacity: 0;
      filter: brightness(0.85);
    }
    .video-card-inner.app-slide-out-right {
      transform: translateX(105%) scale(0.88);
      opacity: 0;
      filter: brightness(0.85);
    }
    .video-card-inner.app-slide-in-right-prep {
      transform: translateX(105%) scale(0.88) !important;
      opacity: 0 !important;
      filter: brightness(0.85) !important;
      transition: none !important;
    }
    .video-card-inner.app-slide-in-left-prep {
      transform: translateX(-105%) scale(0.88) !important;
      opacity: 0 !important;
      filter: brightness(0.85) !important;
      transition: none !important;
    }
    .video-card-inner.app-slide-active {
      transform: translateX(0) scale(1) !important;
      opacity: 1 !important;
      filter: none !important;
    }

    /* Floating Navigation Arrows - Rock Solid (Zero Vertical Jumping) */
    .v-flip-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%) !important;
      z-index: 28;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      color: var(--navy);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(18, 41, 74, 0.16);
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .v-flip-btn:hover {
      background: #FFFFFF;
      box-shadow: 0 6px 20px rgba(18, 41, 74, 0.24);
      border-color: var(--navy);
    }
    .v-flip-btn:active {
      background: var(--cream);
      box-shadow: 0 2px 8px rgba(18, 41, 74, 0.12);
    }
    .v-flip-btn:disabled, .v-flip-btn[aria-disabled="true"] {
      opacity: 0.25;
      pointer-events: none;
    }
    .v-flip-prev { left: 10px; }
    .v-flip-next { right: 10px; }

    /* Header Action & Gear Buttons */
    .video-gear-btn-header {
      background: var(--soft);
      border: 1px solid var(--line);
      color: var(--navy);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(18, 41, 74, 0.06);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      flex: none;
    }
    .video-gear-btn-header:hover, .video-gear-btn-header.active {
      background: var(--card);
      border-color: var(--navy);
      color: var(--navy);
      transform: scale(1.05);
    }

    /* Reel Counter Pill */
    .v-reel-pill {
      font-size: 10px;
      font-weight: 700;
      background: var(--soft);
      border: 1px solid var(--line);
      color: var(--navy);
      padding: 2px 7px;
      border-radius: 99px;
      letter-spacing: 0.4px;
    }

    /* Social Icons Safe Zone Overlay */
    .v-social-overlay {
      position: absolute;
      inset: 0;
      z-index: 22;
      pointer-events: none;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 12px 18px 14px;
      color: #FFFFFF;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
      animation: popIn 0.25s ease-out;
    }
    .v-social-overlay.active {
      display: flex;
    }

    /* Top Social Bar */
    .v-soc-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .v-soc-top-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .v-soc-top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Center Badge */
    .v-soc-center-pill {
      align-self: center;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 99px;
      font-size: 10px;
      font-weight: 600;
      color: #FFFFFF;
      opacity: 0.85;
      letter-spacing: 0.3px;
    }

    /* Bottom Safe Zone */
    .v-soc-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
    }
    .v-soc-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-bottom: 2px;
    }
    .v-soc-profile {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .v-soc-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1.5px solid #FFFFFF;
      overflow: hidden;
      background: #FFFFFF;
      flex: none;
    }
    .v-soc-avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .v-soc-handle {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .v-soc-follow-btn {
      padding: 3px 10px;
      font-size: 10.5px;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      line-height: 1;
    }
    .v-soc-caption {
      font-size: 11px;
      font-weight: 500;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
      color: rgba(255, 255, 255, 0.95);
    }
    .v-soc-audio {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    /* Right Action Stack */
    .v-soc-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex: none;
      padding-bottom: 2px;
    }
    .v-soc-act-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .v-soc-act-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
    }
    .v-soc-act-num {
      font-size: 10px;
      font-weight: 700;
      color: #FFFFFF;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      letter-spacing: 0.2px;
    }
    .v-soc-disc {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #FFFFFF;
      background: #111;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      animation: spin 3.5s linear infinite;
    }

    /* Theme-Styled Settings Dropdown Menu */
    .video-gear-menu {
      display: none;
      position: absolute;
      top: 42px;
      right: 0;
      z-index: 100;
      background: #FFFFFF;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 14px 16px;
      color: var(--navy);
      width: 275px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      box-shadow: 0 18px 48px rgba(18, 41, 74, 0.2);
      animation: popIn 0.2s ease-out;
    }
    .v-menu-sec {
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .v-menu-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--mute);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .v-status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .v-status-badge.approved {
      background: rgba(31, 175, 100, 0.12);
      color: var(--green);
      border: 1px solid rgba(31, 175, 100, 0.25);
    }
    .v-status-badge.review {
      background: rgba(242, 153, 46, 0.12);
      color: var(--amber);
      border: 1px solid rgba(242, 153, 46, 0.25);
    }
    .v-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }
    .v-approval-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .v-act-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.18s ease;
    }
    .v-act-btn.approve-btn {
      background: rgba(31, 175, 100, 0.12);
      border-color: rgba(31, 175, 100, 0.25);
      color: var(--green);
    }
    .v-act-btn.approve-btn.active, .v-act-btn.approve-btn:hover {
      background: var(--green);
      border-color: var(--green);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(31, 175, 100, 0.3);
    }
    .v-act-btn.reject-btn {
      background: rgba(229, 50, 37, 0.08);
      border-color: rgba(229, 50, 37, 0.2);
      color: var(--red);
    }
    .v-act-btn.reject-btn.active, .v-act-btn.reject-btn:hover {
      background: var(--red);
      border-color: var(--red);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(229, 50, 37, 0.3);
    }
    .v-quality-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      background: var(--soft);
      border-radius: 9px;
      border: 1px solid var(--line);
    }
    .v-quality-active {
      background: var(--green);
      color: #FFFFFF;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.4px;
    }
    .v-speed-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }
    .v-speed-btn {
      background: var(--soft);
      border: 1px solid var(--line);
      color: var(--navy);
      padding: 6px 0;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .v-speed-btn.active, .v-speed-btn:hover {
      background: var(--navy);
      border-color: var(--navy);
      color: #FFFFFF;
      font-weight: 700;
    }
    .v-loop-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--soft);
      border: 1px solid var(--line);
      color: var(--navy);
      padding: 7px 10px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .v-loop-toggle:hover {
      background: #EAE6DC;
    }
    .v-loop-val {
      color: var(--mute);
      font-size: 11px;
      font-weight: 600;
    }
    .v-specs-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: var(--soft);
      padding: 8px 10px;
      border-radius: 9px;
      border: 1px solid var(--line);
    }
    .v-spec-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
    }
    .v-spec-item span {
      color: var(--mute);
    }
    .v-spec-item b {
      color: var(--navy);
      font-weight: 600;
    }

    .sheet {
      background: var(--card);
      width: 100%;
      max-width: 440px;
      border-radius: 26px 26px 0 0;
      padding: 12px 20px calc(24px + env(safe-area-inset-bottom, 16px));
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 90dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      animation: up 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -12px 40px rgba(18, 41, 74, 0.16);
    }

    .center .sheet {
      border-radius: 24px;
      padding: 24px 22px;
      max-width: 390px;
    }

    .sheet .grab {
      width: 40px;
      height: 4px;
      border-radius: 4px;
      background: var(--line);
      margin: 2px auto 8px;
    }

    .sheet h4 { margin: 0; font-size: 18px; color: var(--navy); }
    .sheet p { margin: 0; font-size: 12px; color: var(--mute); }

    @keyframes up {
      from { transform: translateY(40px); opacity: 0.4; }
      to { transform: none; opacity: 1; }
    }
    @keyframes fade { from { opacity: 0; } }

    /* 4-Digit PIN Code Modal */
    .code-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .code-head .key {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--violet), var(--blue));
      display: grid;
      place-items: center;
      box-shadow: 0 10px 20px -8px var(--violet);
    }

    .pins {
      display: grid;
      grid-template-columns: repeat(4, 56px);
      gap: 12px;
      justify-content: center;
    }

    .pins input {
      width: 56px;
      height: 64px;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      background: var(--bg);
      text-align: center;
      font-size: 26px;
      font-weight: 600;
      color: var(--navy);
      font-variant-numeric: tabular-nums;
    }

    .pins input:focus {
      border-color: var(--blue);
      outline: none;
      box-shadow: 0 0 0 4px rgba(47, 125, 246, 0.15);
    }

    .pins.bad input {
      border-color: var(--red);
      animation: shake 0.35s;
    }

    @keyframes shake {
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .code-msg {
      text-align: center;
      font-size: 12px;
      min-height: 1.4em;
      color: var(--mute);
    }
    .code-msg.bad { color: var(--red); }

    /* Client Genesis Screen */
    .genesis {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding-block: 20px 40px;
      min-height: 78vh;
    }

    .lockup {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      width: 100%;
      max-width: 420px;
      animation: pop2 0.9s ease-out both;
    }
    @keyframes pop2 { from { transform: scale(0.88); opacity: 0; } to { transform: none; opacity: 1; } }

    .lockup img { width: 100%; height: auto; }
    .lockup .wordmark {
      width: 100%;
      text-align: center;
      font-family: var(--serif);
      font-weight: 600;
      font-size: 40px;
      color: var(--navy);
    }

    .tagline {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 600;
      font-size: clamp(16px, 4.6vw, 21px);
      color: #3A3A3A;
      margin-top: 6px;
      white-space: nowrap;
    }
    .tagline .ch.hid { visibility: hidden; }

    .caret {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--red);
      margin-left: 2px;
      vertical-align: -2px;
      opacity: 0;
    }

    .genesis.typing .caret { opacity: 1; animation: blink 0.8s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .genesis .go-btn {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.5s, transform 0.5s;
    }
    .genesis.ready .go-btn {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    /* Page Header */
    .head { padding-block: 6px 18px; display: flex; flex-direction: column; gap: 4px; }
    .head small { font-size: 12px; color: var(--mute); }
    .head h2 { margin: 0; font-size: 26px; font-weight: 700; color: var(--navy); line-height: 1.2; text-wrap: balance; }
    .head .clogo { height: 34px; width: auto; max-width: 220px; align-self: flex-start; margin-bottom: 6px; }

    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .years { display: flex; background: var(--soft); border-radius: 999px; padding: 3px; }
    .years button {
      border: 0; background: none; padding: 6px 14px; border-radius: 999px;
      font-size: 12px; font-weight: 600; color: var(--mute); font-variant-numeric: tabular-nums;
    }
    .years button[aria-pressed="true"] { background: var(--navy); color: #fff; }

    /* Segmented Navigation Switcher (Months / Branches / Albums) */
    .view-switcher {
      display: flex;
      background: var(--soft);
      border-radius: 14px;
      padding: 3px;
      margin-bottom: 14px;
      gap: 4px;
    }
    .view-btn {
      flex: 1;
      border: 0;
      background: none;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 11px;
      color: var(--mute);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .view-btn.active {
      background: var(--card);
      color: var(--navy);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* Months Calendar Grid */
    .months { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .month {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 18px;
      padding: 16px 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .month:hover { transform: translateY(-2px); border-color: var(--c); box-shadow: 0 10px 22px -12px var(--c); }
    .month .cal {
      width: 46px; height: 46px; border-radius: 14px; background: var(--c); color: #fff;
      display: flex; align-items: flex-end; justify-content: center; padding-bottom: 7px;
      font-weight: 700; font-size: 11px; letter-spacing: 0.06em; position: relative; overflow: hidden;
      box-shadow: 0 8px 16px -8px var(--c);
    }
    .month .cal::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 12px; background: rgba(255,255,255,0.3); }
    .month .mn { font-weight: 600; font-size: 13px; color: var(--ink); }
    .month .ct { font-size: 10px; color: var(--mute); font-variant-numeric: tabular-nums; }
    .month.has .ct { color: var(--c); font-weight: 600; }
    .month.off { opacity: 0.45; }
    .month.now { border-color: var(--c); border-width: 2px; }

    /* Favorites & Profile Styling (Luxury Milk-White Theme) */
    .fav-toggle-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.25);

      place-items: center;
      color: #fff;
      cursor: pointer;
      z-index: 4;
      transition: all 0.18s ease;

    .fav-toggle-btn:hover {
      transform: scale(1.15);
      background: rgba(0, 0, 0, 0.6);
    }
    .fav-toggle-btn.is-fav {
      background: #FFFFFF;
      border-color: var(--rose, #E8457A);
      box-shadow: 0 4px 12px rgba(232, 69, 122, 0.35);
    }
    .fav-toggle-btn.is-fav svg {

      stroke: var(--rose, #E8457A);
    }

    /* Profile Card & Layout */
    .profile-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 10px;
    }
    .profile-hero {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 24px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 6px 24px rgba(18, 41, 74, 0.05);
    }
    .profile-avatar-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--soft);
      border: 2px solid var(--line);
      display: grid;
      place-items: center;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(18, 41, 74, 0.08);
    }
    .profile-avatar { width: 100%; height: 100%; object-fit: contain; }
    .profile-avatar-ph { font-size: 26px; font-weight: 700; color: var(--navy); }
    .profile-name { font-size: 20px; font-weight: 700; color: var(--navy); margin: 0 0 4px; line-height: 1.2; }
    .profile-slogan { font-size: 12px; color: var(--mute); margin: 0 0 12px; }
    .profile-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--soft);
      border: 1px solid var(--line);
      font-size: 11px;
      font-weight: 600;
      color: var(--navy);
    }

    .profile-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .pstat-item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .pstat-item b { font-size: 17px; font-weight: 700; color: var(--navy); line-height: 1.2; }
    .pstat-item small { font-size: 10px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: 0.03em; }

    .profile-section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
    }
    .profile-section h4 {
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 0 0 12px;
    }
    .pbranch-list { display: flex; flex-direction: column; gap: 8px; }
    .pbranch-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--soft);
      font-size: 13px;
      font-weight: 600;
      color: var(--navy);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pbranch-item:hover { background: #FFFFFF; box-shadow: 0 3px 10px rgba(18, 41, 74, 0.06); }
    .pbranch-item small { color: var(--gold, #B8935A); font-weight: 600; font-size: 11px; }

    .paction-box { display: flex; flex-direction: column; gap: 12px; }
    .btn-lock {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      background: var(--soft);
      border: 1px solid var(--line);
      color: var(--red);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-lock:hover { background: #FEE2E2; border-color: #FCDAD7; }

    .profile-footer {
      text-align: center;
      padding: 10px 0 20px;
    }
    .dn-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--line);
      text-align: left;
    }
    .dn-badge b { display: block; font-size: 12px; color: var(--navy); line-height: 1.2; }
    .dn-badge small { display: block; font-size: 10px; color: var(--mute); }
    /* Client Hero Banner & Top Header Card (Reference Concept) */
    .client-hero-banner {
      width: calc(100% + 40px);
      margin: -20px -20px 0 -20px;
      height: 180px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #12294A 0%, #1c3860 100%);
      display: flex;
      align-items: flex-end;
    }
    .hero-banner-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.88;
    }
    .hero-banner-overlay {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 16px 20px 20px;
      background: linear-gradient(to top, rgba(18, 41, 74, 0.95) 0%, rgba(18, 41, 74, 0.5) 60%, transparent 100%);
      color: #FFFFFF;
    }
    .hero-brand-name {
      display: block;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .hero-brand-slogan {
      display: block;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
      margin-top: 3px;
      letter-spacing: 0.02em;
    }

    /* Floating Client Header Card */
    .client-header-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: -14px 0 16px;
      position: relative;
      z-index: 4;
      box-shadow: 0 6px 20px rgba(18, 41, 74, 0.06);
    }
    .ch-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .ch-logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: contain;
      background: var(--soft);
      border: 1px solid var(--line);
      flex: none;
    }
    .ch-info { min-width: 0; }
    .ch-info h3 {
      font-size: 14px;
      font-weight: 700;
      color: var(--navy);
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .ch-info p {
      font-size: 11px;
      color: var(--mute);
      margin: 2px 0 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .month-selector-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--navy);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex: none;
      transition: all 0.15s ease;
    }
    .month-selector-btn:hover { background: #FFFFFF; border-color: var(--navy); transform: translateY(-1px); }

    /* Gallery Heading & Search Tools */
    .gallery-title-row {
      margin-bottom: 12px;
    }
    .gallery-heading {
      font-family: var(--serif, 'Cormorant Garamond', Georgia, serif);
      font-size: 26px;
      font-weight: 600;
      color: var(--navy);
      margin: 0 0 2px;
      line-height: 1.15;
    }
    .gallery-sub {
      font-size: 12px;
      color: var(--mute);
      margin: 0;
      line-height: 1.4;
    }

    .gallery-tools-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .gallery-search-box {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }
    .gallery-search-box svg {
      position: absolute;
      left: 12px;
      color: var(--mute);
      pointer-events: none;
    }
    .gallery-search-inp {
      width: 100%;
      padding: 9px 32px 9px 36px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--navy);
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .gallery-search-inp:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(18, 41, 74, 0.08);
    }
    .clear-search-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--mute);
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    /* Density Switcher (2 per row / 3 per row) */
    .density-switcher {
      display: inline-flex;
      background: var(--soft);
      padding: 3px;
      border-radius: 999px;
      border: 1px solid var(--line);
      flex: none;
      gap: 2px;
    }
    .density-btn {
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: var(--mute);
      border: none;
      background: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .density-btn.active {
      background: #FFFFFF;
      color: var(--navy);
      box-shadow: 0 2px 6px rgba(18, 41, 74, 0.08);
      font-weight: 700;
    }

    /* Grid Density Variations */
    .reels.grid-1col { grid-template-columns: 1fr !important; }
    .reels.grid-2col { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
    .reels.grid-3col { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
    .reels.grid-3col .acts { display: flex; flex-direction: column; gap: 3px; }
    .reels.grid-3col .act { padding: 4px 2px; font-size: 9px; flex-direction: row; justify-content: center; gap: 3px; }
    .reels.grid-3col .act .chip { width: 18px; height: 18px; }
    .reels.grid-3col .act .chip svg { width: 10px; height: 10px; }
    .reels.grid-3col .poster .cap { font-size: 10.5px; bottom: 8px; left: 6px; right: 6px; }
    .reels.grid-3col .poster .cap small { font-size: 8.5px; }
    .reels.grid-3col .poster .views-badge { display: none; }

    /* Views Badge on Thumbnail (Reference Concept) */
    .poster .views-badge {
      position: absolute;
      bottom: 40px;
      left: 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9.5px;
      font-weight: 600;
      color: #FFFFFF;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      padding: 2px 7px;
      border-radius: 999px;
      z-index: 2;
    }

    /* Bottom Navigation Bar (Navbar - Reference Concept) */
    .client-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 253, 248, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
      z-index: 50;
      box-shadow: 0 -4px 20px rgba(18, 41, 74, 0.05);
    }
    .bnav-btn {
      flex: 1;
      max-width: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: none;
      background: none;
      color: var(--mute);
      cursor: pointer;
      padding: 4px 0;
      border-radius: 12px;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .bnav-icon {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      color: currentColor;
      transition: transform 0.15s ease;
    }
    .bnav-label {
      font-size: 10px;
      font-weight: 600;
      color: currentColor;
      letter-spacing: 0.02em;
    }
    .bnav-btn.active {
      color: var(--navy);
    }
    .bnav-btn.active .bnav-icon {
      color: var(--gold, #B8935A);
      transform: translateY(-2px);
    }
    .bnav-btn.active .bnav-label {
      font-weight: 700;
      color: var(--navy);
    }

    /* Ensure app scroll area has clearance above bottom navbar */
    #app {
      padding-bottom: calc(78px + env(safe-area-inset-bottom, 0px)) !important;
    }

    /* Month Dropdown Popover */
    .month-picker-scrim {
      position: fixed;
      inset: 0;
      background: rgba(18, 41, 74, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }
    .month-picker-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 16px 40px rgba(18, 41, 74, 0.15);
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .mp-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .mp-title h3 { font-size: 16px; font-weight: 700; color: var(--navy); margin: 0; }
    .mp-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .mp-btn {
      padding: 10px 6px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .mp-btn small { font-size: 9.5px; color: var(--mute); font-weight: 500; }
    .mp-btn:hover { border-color: var(--navy); background: #FFFFFF; }
    .mp-btn.active { background: var(--navy); color: #FFFFFF; border-color: var(--navy); }
    .mp-btn.active small { color: rgba(255, 255, 255, 0.85); }
    
    /* Branches & Folders Grid (Image Fills Box, Clean Text, Zero Pin Icon) */
    .branches { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .branch {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 20px;
      padding: 0 !important;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      text-align: left;
      transition: transform 0.15s, box-shadow 0.15s;
      min-width: 0;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }
    .branch:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(29, 36, 51, 0.08); }
    .branch-cover-wrap {
      width: 100%;
      height: 148px;
      background: var(--soft);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .branch-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .branch:hover .branch-cover-img { transform: scale(1.04); }
    .branch-cover-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--mute);
      font-size: 11px;
      font-weight: 600;
      background: linear-gradient(135deg, var(--soft) 0%, color-mix(in srgb, var(--c) 14%, var(--soft)) 100%);
    }
    .branch-cov-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--navy);
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      transition: all 0.15s ease;
      z-index: 3;
    }
    .branch-cov-btn:hover { background: #FFFFFF; transform: scale(1.1); color: var(--gold, #B8935A); }
    .branch-meta-wrap {
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
      background: var(--card);
    }
    .branch-meta-wrap .bn { min-width: 0; }
    .branch-meta-wrap .bn small { display: block; font-size: 10px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.2; }
    .branch-meta-wrap .bn b { display: block; font-weight: 700; font-size: 15px; color: var(--navy); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .branch-meta-wrap .cnt { font-size: 11px; color: var(--mute); font-variant-numeric: tabular-nums; margin-top: 1px; }
    .branch-meta-wrap .cnt strong { color: var(--c); font-weight: 700; }

    /* Reels Poster Grid */
    .reels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .reel { display: flex; flex-direction: column; gap: 8px; min-width: 0; position: relative; }

    .poster {
      aspect-ratio: 9/16;
      max-width: 100%;
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      display: block;
      color: #fff;
      cursor: pointer;
      background: radial-gradient(120% 80% at 50% 30%, color-mix(in srgb, var(--c) 55%, #fff) 0%, var(--c) 55%, color-mix(in srgb, var(--c) 70%, #000) 100%);
    }

    .poster .custom-cover {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .poster .motif {
      position: absolute; left: 50%; top: 40%; width: 86%; transform: translate(-50%, -50%); opacity: 0.32;
    }

    .poster .zari {
      position: absolute; left: 0; right: 0; bottom: 0; height: 35%;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.65), transparent);
    }

    .poster .border {
      position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
      background: repeating-linear-gradient(90deg, #E9C77B 0 6px, #B8935A 6px 9px, #F6E3B4 9px 12px);
    }

    .poster .no {
      position: absolute; top: 10px; left: 10px; font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
      background: rgba(255, 255, 255, 0.9); color: var(--navy); padding: 3px 8px; border-radius: 999px;
    }

    .poster .dur {
      position: absolute; top: 10px; right: 10px; font-size: 9px; font-weight: 600;
      background: rgba(0, 0, 0, 0.35); padding: 3px 7px; border-radius: 999px; font-variant-numeric: tabular-nums;
    }

    .poster .status-tag {
      position: absolute; top: 32px; left: 10px; font-size: 8px; font-weight: 700; letter-spacing: 0.08em;
      color: #fff; padding: 2px 6px; border-radius: 999px; text-transform: uppercase;
    }

    .poster .status-tag.approved { background: var(--green); }
    .poster .status-tag.review { background: var(--amber); }
    .poster .status-tag.draft { background: var(--mute); }
    .poster .status-tag.hidden { background: var(--red); }

    .poster .play {
      position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
      width: 50px; height: 50px; border-radius: 50%; background: #fff;
      display: grid; place-items: center; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
    }

    .poster .cap {
      position: absolute; left: 10px; right: 10px; bottom: 16px;
      font-size: 12px; font-weight: 600; line-height: 1.3; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
    }

    .poster .cap small {
      display: block; font-weight: 400; font-size: 10px; opacity: 0.95; margin-top: 2px;
    }

    .stats-line {
      font-size: 10px; color: var(--mute); display: flex; gap: 8px; align-items: center;
      margin-top: -2px; padding-inline: 4px;
    }

    /* Reference Action Buttons Strip */
    .acts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      padding: 7px 4px 6px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(18, 41, 74, 0.03);
    }
    .act {
      border: none;
      background: none;
      border-radius: 8px;
      padding: 3px 2px;
      font-size: 10px;
      font-weight: 500;
      color: var(--navy);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .act .act-icon {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      color: var(--navy);
      transition: transform 0.15s ease, color 0.15s ease;
    }
    .act .act-icon svg {
      width: 17px;

    /* Floating Toast Notifications (Zero legacy alerts) */

    // Custom Modal Bottom / Center Sheet (Protected against accidental backdrop close)
    function sheet(html, onMount, center, customClass) {
      if (customClass !== 'share-modal-scrim') {
        document.querySelector('.scrim:not(.video-modal-scrim)')?.remove();
      }
      const sc = document.createElement('div');
      sc.className = 'scrim' + (center ? ' center' : '') + (customClass ? ' ' + customClass : '');
      sc.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${center ? '' : '<div class="grab"></div>'}${html}</div>`;
      sc.addEventListener('click', e => {
        if (e.target.closest('[data-close]') || (customClass === 'share-modal-scrim' && e.target === sc)) sc.remove();
      });
      document.body.appendChild(sc);

      // Track modal in browser history for back button support
      try { window.history.pushState({ modalOpen: true, t: Date.now() }, ''); } catch(e) {}
      const origRemove = sc.remove.bind(sc);
      sc.remove = function() {
        origRemove();
        if (!isClosingModalViaHistory && window.history.state && window.history.state.modalOpen) {
          isProgrammaticHistoryBack = true;
          try { window.history.back(); } catch(e) {}
          setTimeout(() => { isProgrammaticHistoryBack = false; }, 150);
        }
      };

      // Swiping down bottom sheets (like share modal) = closing it
      const sheetEl = sc.querySelector('.sheet');
      if (sheetEl && !center) {
        let touchStartY = 0, currentDeltaY = 0, isDragging = false;

        sheetEl.addEventListener('touchstart', e => {
          if (e.touches.length === 1 && sheetEl.scrollTop <= 0) {
            touchStartY = e.touches[0].clientY;
            currentDeltaY = 0;
            isDragging = true;
          }
        }, { passive: true });

        sheetEl.addEventListener('touchmove', e => {
          if (!isDragging) return;
          const diff = e.touches[0].clientY - touchStartY;
          if (diff > 0) {
            currentDeltaY = diff;
            sheetEl.style.transition = 'none';
            sheetEl.style.transform = `translateY(${diff}px)`;
          } else {
            sheetEl.style.transform = '';
          }
        }, { passive: true });

        const finishDrag = () => {
          if (!isDragging) return;
          isDragging = false;
          if (currentDeltaY > 70) {
            sheetEl.style.transition = 'transform 0.22s ease-out, opacity 0.22s ease-out';
            sheetEl.style.transform = 'translateY(100%)';
            sheetEl.style.opacity = '0';
            setTimeout(() => sc.remove(), 220);
          } else {
            sheetEl.style.transition = 'transform 0.24s cubic-bezier(0.18, 0.89, 0.32, 1.28)';
            sheetEl.style.transform = '';
          }
        };

        sheetEl.addEventListener('touchend', finishDrag, { passive: true });
        sheetEl.addEventListener('touchcancel', finishDrag, { passive: true });
      }

      onMount && onMount(sc);
      return sc;
    }

    // Google Apps Script Engine API
    async function gasApi(action, payload = {}) {
      if (!CONFIG.gasUrl) throw new Error('Backend URL not configured');
      payload.action = action;
      payload.passkey = CONFIG.adminPasskey;

      const res = await fetch(CONFIG.gasUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    // Live Socket Upload via XMLHttpRequest with true bytes progress
    function gasApiWithProgress(action, payload, onProgress) {
      return new Promise((resolve, reject) => {
        if (!CONFIG.gasUrl) return reject(new Error('Backend URL not configured'));
        payload.action = action;
        payload.passkey = CONFIG.adminPasskey;

        const bodyStr = JSON.stringify(payload);
        const xhr = new XMLHttpRequest();
        xhr.open('POST', CONFIG.gasUrl, true);
        xhr.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');

        if (xhr.upload && onProgress) {
          xhr.upload.onprogress = e => {
            if (e.lengthComputable) {
              const pct = Math.min(99, Math.round((e.loaded / e.total) * 100));
              onProgress({
                loaded: e.loaded,
                total: e.total,
                percent: pct
              }, xhr);
            }
          };
        }

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              resolve(JSON.parse(xhr.responseText));
            } catch(e) {
              resolve({ success: true, text: xhr.responseText });
            }
          } else {
            reject(new Error(`Server returned HTTP ${xhr.status}`));
          }
        };

        xhr.onerror = () => reject(new Error('Network error during upload'));
        xhr.ontimeout = () => reject(new Error('Upload timed out'));
        xhr.send(bodyStr);
      });
    }

    // Video Thumbnail Generation Engine (Optimized Zero-Leak Lightweight Frame Extraction)
    function generateVideoThumbnail(file, targetSec = 1.0) {
      return new Promise((resolve, reject) => {
        if (!file || (!(file.type && file.type.startsWith('video/')) && !file.name.match(/\.(mp4|mov|webm|m4v)$/i))) {
          return reject(new Error('Selected file is not a supported video format'));
        }
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.muted = true;
        video.playsInline = true;
        const blobUrl = URL.createObjectURL(file);
        video.src = blobUrl;

        let resolved = false;
        const cleanup = () => {
          try {
            video.pause();
            video.removeAttribute('src');
            video.load();
            URL.revokeObjectURL(blobUrl);
            video.remove();
          } catch(e) {}
        };

        const timeout = setTimeout(() => {
          if (!resolved) {
            resolved = true;
            cleanup();
            reject(new Error('Thumbnail extraction timed out'));
          }
        }, 12000);

        video.onloadedmetadata = () => {
          const duration = video.duration || 30;
          const seekTo = Math.min(Math.max(0.2, targetSec), Math.max(0.2, duration - 0.2));
          video.currentTime = seekTo;
        };

        video.onseeked = () => {
          if (resolved) return;
          resolved = true;
          clearTimeout(timeout);
          try {
            // Downscale to lightweight thumbnail dimensions (max 480w, max 854h) to avoid canvas OOM crashes
            const rawW = video.videoWidth || 720;
            const rawH = video.videoHeight || 1280;
            const maxW = 480;
            const maxH = 854;
            let targetW = rawW;
            let targetH = rawH;

            if (targetW > maxW) {
              targetH = Math.round((targetH * maxW) / targetW);
              targetW = maxW;
            }
            if (targetH > maxH) {
              targetW = Math.round((targetW * maxH) / targetH);
              targetH = maxH;
            }

            const canvas = document.createElement('canvas');
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, targetW, targetH);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.76);
            canvas.width = 0;
            canvas.height = 0;

            const durationSec = Math.floor(video.duration) || 0;
            const m = Math.floor(durationSec / 60);
            const s = durationSec % 60;
            const durStr = `${m}:${s < 10 ? '0' : ''}${s}`;

            cleanup();

            resolve({
              dataUrl,
              durationStr: durStr,
              durationSec,
              width: targetW,
              height: targetH,
              sizeBytes: file.size
            });
          } catch (err) {
            cleanup();
            reject(err);
          }
        };

        video.onerror = err => {
          if (resolved) return;
          resolved = true;
          clearTimeout(timeout);
          cleanup();
          reject(new Error('Video decoding failed in browser'));
        };
      });
    }

    function _legacyThumb(file) {
      return new Promise((resolve, reject) => {
        if (!file || !(file.type && file.type.startsWith('video/')) && !file.name.match(/\.(mp4|mov|webm|m4v)$/i)) {

          if (!resolved) {

            reject(new Error('Thumbnail extraction timed out'));
          }
        }, 12000);

        video.onloadedmetadata = () => {

          video.currentTime = seekTo;

        video.onseeked = () => {

            canvas.width = w;

            const s = durationSec % 60;
            const durStr = `${m}:${s < 10 ? '0' : ''}${s}`;

            resolved = true;

            resolve({

    async function checkConnection() {
      if (!CONFIG.gasUrl) {
        connectionState = { status: 'unconfigured', message: 'GAS URL not set (using local data)' };
        return;
      }
      try {
        const res = await fetch(`${CONFIG.gasUrl}?action=ping`);
        const json = await res.json();
        if (json.success) {
          connectionState = { status: 'online', message: 'Google Drive connected' };
          fetchLiveData();
        } else {
          connectionState = { status: 'offline', message: json.error || 'Connection failed' };
        }
      } catch (e) {
        connectionState = { status: 'offline', message: 'Offline mode active' };
      }
    }

    async function fetchLiveData() {
      try {
        const res = await fetch(`${CONFIG.gasUrl}?action=getData`);
        const json = await res.json();
        if (json.success && json.data) {
          DATA.deletedReelIds = DATA.deletedReelIds || [];
          DATA.deletedClientIds = DATA.deletedClientIds || [];

          // Strip deleted items
          const gasReels = (json.data.reels || []).filter(r => !DATA.deletedReelIds.includes(r.id));
          const localReels = (DATA.reels || []).filter(r => !DATA.deletedReelIds.includes(r.id));
          const mergedReels = [...gasReels];
          localReels.forEach(lr => {
            if (!mergedReels.some(gr => gr.id === lr.id)) mergedReels.unshift(lr);
          });

          const gasClients = (json.data.clients || []).filter(c => !DATA.deletedClientIds.includes(c.id));
          const localClients = (DATA.clients || []).filter(c => !DATA.deletedClientIds.includes(c.id));
          const mergedClients = [...gasClients];
          localClients.forEach(lc => {
            if (!mergedClients.some(gc => gc.id === lc.id)) mergedClients.push(lc);
          });

          DATA.settings = json.data.settings || DATA.settings;
          DATA.clients = mergedClients.length ? mergedClients : DATA.clients;
          DATA.reels = mergedReels;

          DATA._updatedAt = Date.now();
          localStorage.setItem('dn_local_data', JSON.stringify(DATA));
          try {
            if (syncHub) syncHub.postMessage({ type: 'DATA_MUTATED', data: DATA, time: DATA._updatedAt });
          } catch(e) {}
          render();
        }
      } catch (e) {
        console.warn('Fallback to local cache:', e);
      }
    }

    async function persist(msg) {
      document.querySelector('.scrim')?.remove();
      DATA._updatedAt = Date.now();
      localStorage.setItem('dn_local_data', JSON.stringify(DATA));
      try {
        if (syncHub) syncHub.postMessage({ type: 'DATA_MUTATED', data: DATA, time: DATA._updatedAt });
      } catch(e) {}
      render();
      toast('Saving changes...', 'info');
      try {
        if (CONFIG.gasUrl) {
          await gasApi('syncData', { data: DATA });
          toast(msg || 'Saved to Google Drive', 'success');
        } else {
          toast(msg || 'Saved locally', 'amber');
        }
      } catch (e) {
        toast('Saved locally (Sync: ' + (e.message || 'offline') + ')', 'amber');
      }
    }

        link.id = 'dynamic-favicon';
        link.rel = 'icon';
        document.head.appendChild(link);
      }
      link.type = href.startsWith('data:image/svg') ? 'image/svg+xml' : 'image/png';
      link.href = href;

      let apple = document.getElementById('dynamic-apple-icon') || document.querySelector('link[rel="apple-touch-icon"]');
      if (apple) {
        apple.href = href.startsWith('data:image/svg') ? (href.includes('tcs') ? '/Logo/tcs-logo.png' : '/Logo/logo.png') : href;
      }
    }

    // Favorites persistence helpers
    function isFavorited(id) {
      if (!view.client || !id) return false;
      try {
        const favs = JSON.parse(localStorage.getItem('dn_favs_' + view.client) || '[]');
        return favs.includes(id);
      } catch(e) { return false; }
    }

    function toggleFavorite(id) {
      if (!view.client || !id) return;
      const key = 'dn_favs_' + view.client;
      let favs = [];
      try { favs = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) {}
      const pos = favs.indexOf(id);
      if (pos > -1) {
        favs.splice(pos, 1);
        toast('Removed from Favorites', 'info');
      } else {
        favs.push(id);
        toast('Saved to Favorites', 'success');
      }
      localStorage.setItem(key, JSON.stringify(favs));
      render();
    }
