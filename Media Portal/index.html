<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Daynight-media | Official Social Platform</title>
  <meta name="description" content="Daynight-media - Official public platform for client brand reels, creator stories, and real-time social feeds">

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/png" href="./Logo/logo.png">
  <link rel="apple-touch-icon" href="./Logo/logo.png">

  <!-- Google Fonts: Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap">

  <!-- Modular Instagram-Grade Stylesheets -->
  <link rel="stylesheet" href="./Stylesheets/instagram-core.css?v=2.5">
  <link rel="stylesheet" href="./Stylesheets/feed.css?v=2.5">
  <link rel="stylesheet" href="./Stylesheets/reels.css?v=2.5">
  <link rel="stylesheet" href="./Stylesheets/explore.css?v=2.5">
  <link rel="stylesheet" href="./Stylesheets/settings.css?v=2.5">
  <link rel="stylesheet" href="./Stylesheets/profile.css?v=2.5">
  <link rel="stylesheet" href="./Stylesheets/upload.css?v=2.5">
  <link rel="stylesheet" href="./Stylesheets/player.css?v=2.5">

  <!-- Real Google Identity Services & Firebase Auth SDKs -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

  <!-- App Main Frame -->
  <div class="dnm-app-container">

    <!-- Top Sticky Instagram Header with Intelligent Scroll Hide/Show -->
    <header class="dnm-top-header" id="dnm-main-header">
      <a href="#" class="dnm-logo" id="dnm-header-logo" aria-label="Daynight-media Home">
        <img src="./Logo/logo.png?v=2.2" alt="Day Night" class="dnm-official-header-logo">
        <span class="dnm-header-brand-title">Day Night</span>
      </a>

      <div class="dnm-header-actions">
        <button type="button" class="dnm-header-btn" id="dnm-btn-theme-toggle" aria-label="Toggle Theme" title="Toggle Light/Dark Theme">
          <svg class="dnm-theme-icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="dnm-theme-icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button type="button" class="dnm-header-btn" id="dnm-btn-search-header" aria-label="Search">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>
    </header>

    <!-- Tab 1: Home Social Feed -->
    <main class="dnm-tab-view active" id="dnm-tab-feed">
      <!-- Stories Carousel Tray with Real Client Logos -->
      <section class="dnm-stories-tray" id="dnm-stories-tray"></section>

      <!-- Feed Cards Wrap -->
      <section class="dnm-feed-container" id="dnm-feed-cards-wrap"></section>
    </main>

    <!-- Tab 2: Explore & Search Tab -->
    <main class="dnm-tab-view" id="dnm-tab-explore" style="display:none;">
      <div class="dnm-explore-container">
        <!-- Search Header -->
        <div class="dnm-search-header">
          <div class="dnm-search-bar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="dnm-global-search-inp" class="dnm-search-input" placeholder="Search accounts, reels, or tags...">
            <button type="button" id="dnm-global-search-clear" class="dnm-search-clear" style="display:none;" aria-label="Clear">&times;</button>
            <div class="dnm-search-dropdown" id="dnm-global-search-dropdown"></div>
          </div>
        </div>

        <!-- Explore Grid Wrap -->
        <div class="dnm-explore-grid" id="dnm-explore-grid-wrap"></div>
      </div>
    </main>

    <!-- Tab 3: Full-Screen Reels Tab -->
    <main class="dnm-tab-view" id="dnm-tab-reels" style="display:none;">
      <div class="dnm-reels-feed-container" id="dnm-reels-feed-container"></div>
    </main>

    <!-- Tab 4: Platform Settings Page (Accessed from Profile) -->
    <main class="dnm-tab-view" id="dnm-tab-settings" style="display:none;"></main>

    <!-- Tab 5: Profile & Brand Hub Tab -->
    <main class="dnm-tab-view" id="dnm-tab-profile" style="display:none;"></main>

    <!-- Bottom Navigation Bar (5 Classic Instagram Tabs - No Settings Button) -->
    <nav class="dnm-bottom-nav">
      <!-- 1. Home Feed -->
      <button type="button" class="dnm-nav-item active" data-tab="feed" aria-label="Home Feed">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>

      <!-- 2. Explore / Search -->
      <button type="button" class="dnm-nav-item" data-tab="explore" aria-label="Explore and Search">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>

      <!-- 3. Upload Studio (+) -->
      <button type="button" class="dnm-nav-item" data-tab="upload" aria-label="Upload Video or Photo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      </button>

      <!-- 4. Reels Tab -->
      <button type="button" class="dnm-nav-item" data-tab="reels" aria-label="Video Reels">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="4"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
      </button>

      <!-- 5. Profile -->
      <button type="button" class="dnm-nav-item" data-tab="profile" aria-label="Profile">
        <img class="dnm-nav-avatar" id="dnm-nav-user-avatar" src="./Logo/logo.png?v=2.2" alt="Profile">
      </button>
    </nav>

  </div>

  <!-- Toast Container -->
  <div class="dnm-toast-container" id="dnm-toast-container"></div>

  <!-- Modular Scripts -->
  <script src="./Scripts/firebase-config.js?v=2.5"></script>
  <script src="./Scripts/auth.js?v=2.5"></script>
  <script src="./Scripts/data.js?v=2.5"></script>
  <script src="./Scripts/player.js?v=2.5"></script>
  <script src="./Scripts/feed.js?v=2.5"></script>
  <script src="./Scripts/reels.js?v=2.5"></script>
  <script src="./Scripts/settings.js?v=2.5"></script>
  <script src="./Scripts/upload.js?v=2.5"></script>
  <script src="./Scripts/app.js?v=2.5"></script>
</body>
</html>
